<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE UNDERGROUND TEKNO - Live Radio VJ</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%2300ff41' d='M2 1h1v1H2zM5 1h1v1H5zM10 1h1v1h-1zM13 1h1v1h-1zM3 2h1v1H3zM12 2h1v1h-1zM1 3h1v1H1zM4 3h2v1H4zM7 3h2v1H7zM10 3h2v1h-2zM14 3h1v1h-1zM1 4h1v1H1zM3 4h1v1H3zM5 4h6v1H5zM12 4h1v1h-1zM14 4h1v1h-1zM1 5h14v1H1zM1 6h1v1H1zM3 6h10v1H3zM14 6h1v1h-1zM1 7h1v1H1zM4 7h1v1H4zM11 7h1v1h-1zM14 7h1v1h-1zM2 8h2v1H2zM12 8h2v1h-2zM3 9h1v1H3zM5 9h1v1H5zM10 9h1v1h-1zM12 9h1v1h-1z'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        
        /* BACKGROUND IMAGE - con effetti 3D e motion blur */
        #background {
            position: fixed;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 0;
            transition: transform 0.05s ease-out, filter 0.1s ease-out;
            transform-origin: center center;
            will-change: transform, filter;
        }

        #proceduralBg {
            width: 100%;
            height: 100%;
        }
        
        /* Zoom burst effect SOTTOCASSA - PIÙ POTENTE! */
        body.zoom-burst #background {
            animation: zoom-burst 0.3s ease-out;
        }
        
        @keyframes zoom-burst {
            0% { 
                transform: scale(1);
                filter: blur(0);
            }
            50% { 
                transform: scale(1.35); /* da 1.15 a 1.35! */
                filter: blur(12px); /* da 8px a 12px! */
            }
            100% { 
                transform: scale(1);
                filter: blur(0);
            }
        }
        
        /* Rapid shake */
        body.shake-burst #background {
            animation: shake-burst 0.2s ease-out;
        }
        
        @keyframes shake-burst {
            0%, 100% { transform: translate(0, 0) scale(1); }
            20% { transform: translate(-10px, 5px) scale(1.05) rotate(2deg); }
            40% { transform: translate(10px, -5px) scale(0.98) rotate(-2deg); }
            60% { transform: translate(-8px, -5px) scale(1.03) rotate(1deg); }
            80% { transform: translate(8px, 5px) scale(0.99) rotate(-1deg); }
        }
        
        /* Psychedelic states */
        body.trip-mode #background {
            animation: breathe 4s ease-in-out infinite;
        }
        
        @keyframes breathe {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(2deg); }
        }
        
        body.khole-mode #background {
            filter: blur(3px) contrast(1.5) saturate(0);
            animation: khole-drift 8s ease-in-out infinite;
        }
        
        @keyframes khole-drift {
            0%, 100% { transform: scale(1) translateY(0); }
            25% { transform: scale(1.05) translateY(-20px) rotate(1deg); }
            75% { transform: scale(0.95) translateY(20px) rotate(-1deg); }
        }
        
        /* STROBE OVERLAY - flash bianco */
        #strobeFlash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            opacity: 0;
            z-index: 999;
            pointer-events: none;
        }
        
        /* GEOMETRIC STROBES - flash geometrici che seguono il disegno */
        .geo-strobe {
            position: fixed;
            opacity: 0;
            pointer-events: none;
            z-index: 50;
            transition: opacity 0.05s;
        }
        
        /* Strobes laterali (sound system walls) */
        .geo-strobe.left-wall {
            left: 0;
            top: 0;
            width: 25%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0.9), transparent);
        }
        
        .geo-strobe.right-wall {
            right: 0;
            top: 0;
            width: 25%;
            height: 100%;
            background: linear-gradient(to left, rgba(255,255,255,0.9), transparent);
        }
        
        /* Strobes cerchi (seguono i cerchi concentrici) */
        .geo-strobe.circle-ring {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 3px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            background: transparent;
        }
        
        /* Strobes orizzontali (crowd/stage) */
        .geo-strobe.horizontal-bottom {
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            background: linear-gradient(to top, rgba(255,255,255,0.9), transparent);
        }
        
        .geo-strobe.horizontal-top {
            top: 0;
            left: 0;
            width: 100%;
            height: 20%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
        }
        
        /* Strobes radiali dal centro */
        .geo-strobe.radial-burst {
            top: 50%;
            left: 50%;
            width: 200%;
            height: 200%;
            transform: translate(-50%, -50%);
            background: radial-gradient(
                circle at center,
                transparent 20%,
                rgba(255,255,255,0.8) 40%,
                transparent 60%
            );
        }
        
        /* PULSE EFFECT - cerchi molto più visibili */
        #circlePulse {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 5px solid rgba(255, 255, 255, 0.9);
            z-index: 1;
            pointer-events: none;
            box-shadow: 
                0 0 30px rgba(255, 255, 255, 0.8),
                0 0 60px rgba(255, 255, 255, 0.6),
                inset 0 0 30px rgba(255, 255, 255, 0.4);
        }
        
        /* SPEAKER FLASHES - flash sulle casse laterali */
        .speaker-flash {
            position: fixed;
            width: 150px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, transparent 70%);
            opacity: 0;
            pointer-events: none;
            z-index: 2;
            filter: blur(30px);
        }
        
        .speaker-flash.left {
            left: 15%;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .speaker-flash.right {
            right: 15%;
            top: 50%;
            transform: translateY(-50%);
        }
        
        /* CROWD STROBES - luci che illuminano la folla */
        #crowdStrobe {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            background: linear-gradient(to top, rgba(255,255,255,0.8), transparent);
            opacity: 0;
            pointer-events: none;
            z-index: 3;
            mix-blend-mode: overlay;
        }
        
        /* VORTEX ROTATION - rotazione cerchi più visibile */
        #vortexRotation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
            mix-blend-mode: screen;
            opacity: 0.6;
        }
        
        /* TUNNEL EFFECT - zoom 3D verso centro */
        #tunnelEffect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            perspective: 1000px;
        }
        
        .tunnel-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: tunnel-zoom 3s linear infinite;
        }
        
        @keyframes tunnel-zoom {
            0% {
                width: 50px;
                height: 50px;
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                width: 2000px;
                height: 2000px;
                opacity: 0;
            }
        }
        
        /* GRAIN OVERLAY - rumore analogico */
        #grainOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.4"/></svg>');
            opacity: 0.15;
            z-index: 100;
            pointer-events: none;
            animation: grain-move 0.5s steps(4) infinite;
        }
        
        @keyframes grain-move {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-2px, 2px); }
            50% { transform: translate(2px, -2px); }
            75% { transform: translate(-2px, -2px); }
        }
        
        /* VHS GLITCH LINES */
        #vhsLines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 101;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
        }
        
        .vhs-line {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            animation: vhs-scan 8s linear infinite;
        }
        
        @keyframes vhs-scan {
            0% { top: -2px; }
            100% { top: 100%; }
        }
        
        /* CHROMATIC ABERRATION */
        body.aberration-mode #background {
            animation: chromatic-shift 0.3s ease-in-out infinite;
        }
        
        @keyframes chromatic-shift {
            0%, 100% { 
                filter: none;
            }
            50% { 
                filter: 
                    drop-shadow(2px 0 0 rgba(255,0,0,0.5))
                    drop-shadow(-2px 0 0 rgba(0,255,255,0.5));
            }
        }
        
        /* SCANLINES - effetto CRT */
        #scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 102;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0) 50%,
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            opacity: 0.3;
        }
        
        /* VIGNETTE - bordi scuri */
        #vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 103;
            pointer-events: none;
            background: radial-gradient(
                ellipse at center,
                transparent 30%,
                rgba(0, 0, 0, 0.4) 80%,
                rgba(0, 0, 0, 0.8) 100%
            );
        }
        
        /* DUST PARTICLES - polvere sullo schermo */
        .dust-particle {
            position: fixed;
            width: 2px;
            height: 2px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            z-index: 104;
            pointer-events: none;
            animation: dust-float 20s linear infinite;
        }
        
        @keyframes dust-float {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translate(var(--dust-x), var(--dust-y)) rotate(360deg);
                opacity: 0;
            }
        }
        
        
        /* 🌀 DISTORTION ZONES - distorsioni parziali graduali */
        .distortion-zone {
            position: fixed;
            pointer-events: none;
            z-index: 50;
            mix-blend-mode: screen;
            opacity: 0;
            transition: opacity 0.1s ease-out, transform 0.2s ease-out;
        }
        
        .distortion-zone.active {
            animation: distort-pulse 0.4s ease-out;
        }
        
        @keyframes distort-pulse {
            0% { 
                opacity: 0;
                transform: scale(0.8);
                filter: blur(10px) hue-rotate(0deg);
            }
            50% { 
                opacity: 0.8;
                transform: scale(1.2);
                filter: blur(5px) hue-rotate(180deg);
            }
            100% { 
                opacity: 0;
                transform: scale(1);
                filter: blur(15px) hue-rotate(360deg);
            }
        }
        
        /* Effetto glitch warp su zone specifiche */
        .warp-zone {
            position: fixed;
            pointer-events: none;
            z-index: 51;
            background: linear-gradient(45deg, 
                transparent 0%, 
                rgba(255,0,0,0.3) 25%,
                rgba(0,255,255,0.3) 50%,
                rgba(255,0,255,0.3) 75%,
                transparent 100%
            );
            opacity: 0;
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
        }
        
        .warp-zone.active {
            animation: warp-glitch 0.3s steps(3) infinite;
        }
        
        @keyframes warp-glitch {
            0% { 
                opacity: 0.6;
                transform: translateX(0) skewX(0deg);
                filter: hue-rotate(0deg);
            }
            33% { 
                opacity: 0.8;
                transform: translateX(-5px) skewX(5deg);
                filter: hue-rotate(120deg);
            }
            66% { 
                opacity: 0.7;
                transform: translateX(5px) skewX(-5deg);
                filter: hue-rotate(240deg);
            }
            100% { 
                opacity: 0.6;
                transform: translateX(0) skewX(0deg);
                filter: hue-rotate(360deg);
            }
        }
        
        /* Chromatic split su zone specifiche */
        .chroma-zone {
            position: fixed;
            pointer-events: none;
            z-index: 52;
            background: radial-gradient(
                circle at center,
                rgba(255,0,0,0.4) 0%,
                transparent 50%
            );
            opacity: 0;
            mix-blend-mode: screen;
        }
        
        .chroma-zone.active {
            animation: chroma-split 0.2s ease-out;
        }
        
        @keyframes chroma-split {
            0% { 
                opacity: 0;
                transform: translate(0, 0);
            }
            25% { 
                opacity: 0.9;
                transform: translate(-3px, 0);
                filter: drop-shadow(6px 0 0 cyan) drop-shadow(-6px 0 0 red);
            }
            75% { 
                opacity: 0.7;
                transform: translate(3px, 0);
                filter: drop-shadow(-4px 0 0 cyan) drop-shadow(4px 0 0 red);
            }
            100% { 
                opacity: 0;
                transform: translate(0, 0);
            }
        }

        
        /* 💫 SUPER SPATIAL GLOW STROBO - effetto strobo spaziale con glow */
        #spatialStrobo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 500;
            opacity: 0;
            mix-blend-mode: screen;
            transition: opacity 0.05s linear;
        }
        
        /* Pattern 1: Radial explosion */
        #spatialStrobo.radial-explosion {
            background: radial-gradient(
                circle at center,
                rgba(255, 255, 255, 1) 0%,
                var(--glow-color, rgba(255, 0, 255, 0.8)) 30%,
                transparent 60%
            );
            filter: blur(20px);
        }
        
        /* Pattern 2: Cross beam */
        #spatialStrobo.cross-beam {
            background: 
                linear-gradient(to bottom, transparent 48%, var(--glow-color, rgba(0, 255, 255, 0.9)) 50%, transparent 52%),
                linear-gradient(to right, transparent 48%, var(--glow-color, rgba(0, 255, 255, 0.9)) 50%, transparent 52%);
            filter: blur(15px);
        }
        
        /* Pattern 3: Diamond burst */
        #spatialStrobo.diamond-burst {
            background: conic-gradient(
                from 45deg at center,
                transparent 0deg,
                var(--glow-color, rgba(255, 255, 0, 0.9)) 90deg,
                transparent 180deg,
                var(--glow-color, rgba(255, 255, 0, 0.9)) 270deg,
                transparent 360deg
            );
            filter: blur(25px);
        }
        
        /* Pattern 4: Spiral glow */
        #spatialStrobo.spiral-glow {
            background: conic-gradient(
                from 0deg at center,
                var(--glow-color, rgba(0, 255, 0, 0.0)) 0deg,
                var(--glow-color, rgba(0, 255, 0, 0.9)) 60deg,
                var(--glow-color, rgba(0, 255, 0, 0.0)) 120deg,
                var(--glow-color, rgba(0, 255, 0, 0.9)) 180deg,
                var(--glow-color, rgba(0, 255, 0, 0.0)) 240deg,
                var(--glow-color, rgba(0, 255, 0, 0.9)) 300deg,
                var(--glow-color, rgba(0, 255, 0, 0.0)) 360deg
            );
            filter: blur(30px);
            animation: rotate-strobo 0.3s linear infinite;
        }
        
        /* Pattern 5: Ring pulse */
        #spatialStrobo.ring-pulse {
            background: radial-gradient(
                circle at center,
                transparent 30%,
                var(--glow-color, rgba(255, 0, 0, 0.9)) 40%,
                transparent 50%,
                var(--glow-color, rgba(255, 0, 0, 0.7)) 60%,
                transparent 70%
            );
            filter: blur(10px);
            animation: pulse-scale 0.2s ease-out infinite;
        }
        
        @keyframes rotate-strobo {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        @keyframes pulse-scale {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
        }

        /* ✨ SILVER GLOW PARTICLES - particelle glow argentate stroboscopiche */
        .silver-glow-particle {
            position: fixed;
            pointer-events: none;
            z-index: 40;
            border-radius: 50%;
            opacity: 0;
            filter: blur(8px);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.9),
                        0 0 40px rgba(200, 200, 255, 0.6),
                        0 0 60px rgba(150, 150, 255, 0.4);
            background: radial-gradient(circle, rgba(255, 255, 255, 0.8) 0%, rgba(200, 200, 255, 0.5) 50%, transparent 70%);
        }

        .silver-glow-particle.active {
            animation: glow-pulse 0.6s ease-out forwards;
        }

        @keyframes glow-pulse {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            40% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: scale(1.8);
            }
        }

        /* 🌀 SPIRAL WHIRL - effetti spiraloidi rotativi */
        .spiral-whirl {
            position: fixed;
            pointer-events: none;
            z-index: 35;
            opacity: 0;
        }

        .spiral-whirl.active {
            animation: whirl-spin 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes whirl-spin {
            0% {
                opacity: 0;
                transform: scale(0.2) rotate(0deg);
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: scale(1.5) rotate(720deg);
            }
        }

        /* ✨ SHIMMER TWINKLE - effetto scintillio */
        .shimmer-twinkle {
            position: fixed;
            pointer-events: none;
            z-index: 38;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            opacity: 0;
            box-shadow: 0 0 15px rgba(200, 220, 255, 0.9);
        }

        .shimmer-twinkle.active {
            animation: twinkle-flash 0.4s ease-out forwards;
        }

        @keyframes twinkle-flash {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(3);
            }
        }

        /* 🌀 LOCALIZED SPIRAL ZOOM - zoom spirale localizzati */
        .spiral-vortex {
            position: fixed;
            pointer-events: none;
            z-index: 60;
            opacity: 0;
            mix-blend-mode: screen;
            border-radius: 50%;
            transition: opacity 0.1s ease-out;
        }
        
        .spiral-vortex.active {
            animation: spiral-zoom-in 0.8s ease-out forwards;
        }
        
        @keyframes spiral-zoom-in {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.3) rotate(0deg);
                filter: blur(20px);
            }
            30% {
                opacity: 0.9;
                transform: translate(-50%, -50%) scale(1.5) rotate(180deg);
                filter: blur(5px);
            }
            70% {
                opacity: 0.7;
                transform: translate(-50%, -50%) scale(2.2) rotate(360deg);
                filter: blur(10px);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(3) rotate(540deg);
                filter: blur(25px);
            }
        }
        
        /* Variante: spirale che si contrae (implode) */
        .spiral-vortex.implode {
            animation: spiral-implode 0.6s ease-in forwards;
        }
        
        @keyframes spiral-implode {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(3) rotate(540deg);
                filter: blur(25px);
            }
            40% {
                opacity: 0.9;
                transform: translate(-50%, -50%) scale(1.5) rotate(270deg);
                filter: blur(5px);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.2) rotate(0deg);
                filter: blur(15px);
            }
        }
        
        /* Variante: spirale pulsante */
        .spiral-vortex.pulse {
            animation: spiral-pulse 0.5s ease-in-out forwards;
        }
        
        @keyframes spiral-pulse {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8) rotate(0deg);
            }
            25% {
                opacity: 0.9;
                transform: translate(-50%, -50%) scale(1.8) rotate(90deg);
                filter: blur(3px);
            }
            50% {
                opacity: 0.8;
                transform: translate(-50%, -50%) scale(1.2) rotate(180deg);
                filter: blur(8px);
            }
            75% {
                opacity: 0.6;
                transform: translate(-50%, -50%) scale(1.6) rotate(270deg);
                filter: blur(5px);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(2.5) rotate(360deg);
                filter: blur(20px);
            }
        }
        
        /* ⚫⚪ NEGATIVE LAYER - effetto negativo con raggi rotativi */
        #negativeLayer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 150;
            opacity: 0;
            mix-blend-mode: difference; /* effetto negativo/inverso */
            transition: opacity 0.05s linear;
        }
        
        /* Raggi rotativi dal centro */
        .rotating-rays {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200vw;
            height: 200vw;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.05s linear;
        }
        
        .rotating-rays.active {
            animation: rotate-rays-fast 0.3s linear infinite;
        }

                const intervals = [];
                for (let i = 1; i < _beatH.length; i++) {
                    intervals.push(_beatH[i] - _beatH[i - 1]);
                }
                const avgInterval = intervals.reduce((a, b) => a + b, 0) / intervals.length;
                let variance = 0;
                for (let i = 0; i < intervals.length; i++) {
                    const diff = intervals[i] - avgInterval;
                    variance += diff * diff;
                }
                variance /= intervals.length;
                bpmStable = variance < 10000; // < 100ms²
                if (bpmStable && avgInterval > 0) {
                    bpmSyncAngle = ((time % avgInterval) / avgInterval) * Math.PI * 2;
                    bpmPulsePhase = (time % avgInterval) / avgInterval;
                    bpmPulseIntensity = Math.pow(1 - bpmPulsePhase, 3); // cubic decay
                }
            }
            if (!bpmStable) bpmPulseIntensity *= 0.95;

            // Pupil dilation: steady beats make the pupil grow
            if (_beatH && _beatH.length >= 3) {
                const recentIntervals = [];
                for (let i = Math.max(1, _beatH.length - 4); i < _beatH.length; i++) {
                    recentIntervals.push(_beatH[i] - _beatH[i-1]);
                }
                const avgInt = recentIntervals.reduce((a,b) => a+b, 0) / recentIntervals.length;
                const lastInt = recentIntervals[recentIntervals.length - 1];
                const deviation = Math.abs(lastInt - avgInt) / avgInt;

                if (deviation < 0.3 && time - _beatH[_beatH.length-1] < 1000) {
                    // Beat is steady
                    if (lastInt !== lastBeatInterval) {
                        steadyBeatCount = Math.min(steadyBeatCount + 1, 20);
                        lastBeatInterval = lastInt;
                        lastSteadyBeatTime = time;
                    }
                }
            }
            // Decay when no steady beats
            if (time - lastSteadyBeatTime > 500) {
                steadyBeatCount = Math.max(0, steadyBeatCount - 0.05); // smooth decay per frame
            }
            pupilTarget = Math.min(1, steadyBeatCount / 16);
            pupilDilation += (pupilTarget - pupilDilation) * 0.08; // smooth lerp

            // ===== LAYER 0: Star Field / Warehouse Dust =====
            const starBrightBase = silenceMode ? 0.6 : 0.25;
            for (let i = 0; i < bgParticles.length; i++) {
                const p = bgParticles[i];
                // Drift upward
                p.y -= p.speed;
                if (p.y < -0.01) { p.y = 1.01; p.x = Math.random(); }

                const twinkle = Math.sin(time * 0.003 + p.twinkleOffset) * 0.5 + 0.5;
                const trebleBoost = trebleLevel * twinkle;
                const bpmBoost = bpmPulseIntensity * 0.4;
                const alpha = starBrightBase + trebleBoost * 0.5 + bpmBoost;

                if (p.warm && marathonMode) {
                    ctx.fillStyle = `rgba(255,200,100,${alpha})`;
                } else {
                    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                }
                ctx.fillRect(p.x * w, p.y * h, p.size, p.size);
            }

            // ===== LAYER 0.5: Radial BPM Wave =====
            if (bpmPulseIntensity > 0.05) {
                const waveRadius = (1 - bpmPulseIntensity) * minDim * 0.6;
                const waveAlpha = bpmPulseIntensity * 0.15;
                ctx.beginPath();
                ctx.arc(cx, cy, waveRadius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255,255,255,${waveAlpha})`;
                ctx.lineWidth = 2 + bpmPulseIntensity * 3;
                ctx.stroke();
            }

            // ===== LAYER 1: Pulse Rings =====
            // Spawn on bass peaks (non-drop)
            if (bassLevel > 0.5 && time - lastPulseTime > 300 && time > dropCooldownUntil - 4700) {
                const ring = pulseRings[pulseRingIdx % pulseRingMax];
                ring.active = true;
                ring.radius = minDim * 0.06;
                ring.alpha = 0.6;
                ring.maxRadius = minDim * 0.35;
                pulseRingIdx++;
                lastPulseTime = time;
            }

            for (let i = 0; i < pulseRingMax; i++) {
                const ring = pulseRings[i];
                if (!ring.active) continue;
                ring.radius += (ring.maxRadius - ring.radius) * 0.04;
                ring.alpha *= 0.96;
                if (ring.alpha < 0.01) { ring.active = false; continue; }
                ctx.beginPath();
                ctx.arc(cx, cy, ring.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255,255,255,${ring.alpha})`;
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }

            // ===== LAYER 2: Hex Grid (pre-rendered blit) =====

            ctx.globalAlpha = Math.min(hexAlpha, 1);
            ctx.drawImage(hexGridCanvas, 0, 0);
            ctx.globalAlpha = 1;

            // ===== LAYER 3: Spiral Vortex =====
            if (bpmStable) {
                spiralAngleAccum = bpmSyncAngle * 0.5;
            } else {
                spiralAngleAccum += energy * 2 * 0.016;
            }
            const armCount = 14;
            const spiralAlpha = 0.15 + bassLevel * 0.2;
            const spiralLineWidth = 1.5 + bassLevel * 2;
            let _slow = false;
            try { _slow = isSlowDevice; } catch(e) {}
            const spiralSteps = _slow ? 40 : 80;

            for (let arm = 0; arm < armCount; arm++) {
                const armAngle = (arm / armCount) * Math.PI * 2 + spiralAngleAccum;
                let prevX, prevY;
                for (let s = 0; s <= spiralSteps; s++) {
                    const t = s / spiralSteps;
                    const r = t * Math.min(cx, cy) * 0.9;
                    const theta = armAngle + t * Math.PI * 3;
                    const x = cx + r * Math.cos(theta);
                    const y = cy + r * Math.sin(theta);
                    if (s > 0) {
                        const segAlpha = spiralAlpha * (1 - t * t); // quadratic fade-out
                        if (segAlpha < 0.01) break;
                        ctx.beginPath();
                        ctx.moveTo(prevX, prevY);
                        ctx.lineTo(x, y);
                        ctx.strokeStyle = `rgba(255,255,255,${segAlpha})`;
                        ctx.lineWidth = spiralLineWidth * (1 - t * 0.6); // thinner toward edge
                        ctx.stroke();
                    }
                    prevX = x;
                    prevY = y;
                }
            }


            // ===== LAYER 5: Central Circle + Broadcast Icon (enhanced) =====
            const baseR = minDim * 0.06;
            let circleScale = 1 + bassLevel * 0.1 + pupilDilation * 0.5;
            // Silence breathing
            if (silenceMode) {
                circleScale = 1 + Math.sin(time * 0.002) * 0.03;
            }
            const circleRadius = baseR * circleScale;

            ctx.save();
            if (raveMode) {
                ctx.shadowColor = 'rgba(255,200,100,0.9)';
                ctx.shadowBlur = 20 + bassLevel * 40;
            } else if (marathonMode) {
                ctx.shadowColor = 'rgba(255,200,100,0.7)';
                ctx.shadowBlur = 15 + bassLevel * 25;
            } else {
                ctx.shadowColor = 'rgba(255,255,255,0.8)';
                ctx.shadowBlur = 10 + bassLevel * 30;
            }

            // Dark fill
            ctx.beginPath();
            ctx.arc(cx, cy, circleRadius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.9)';
            ctx.fill();

            // Bright stroke
            if (raveMode) {
                ctx.strokeStyle = `rgba(255,220,150,${0.7 + bassLevel * 0.3})`;
            } else {
                ctx.strokeStyle = `rgba(255,255,255,${0.6 + bassLevel * 0.4})`;
            }
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();

            // ===== LAYER 6: Sacred Geometry — Flower of Life =====
            const sacredTarget = energy > 0.6 ? 1 : 0;
            sacredGeoAlpha += (sacredTarget - sacredGeoAlpha) * 0.05;
            sacredGeoBoost *= 0.97; // decay boost from drops

            if (sacredGeoAlpha > 0.01) {
                const geoR = minDim * 0.12;
                // Rotation: BPM-synced when stable, else energy-driven
                if (bpmStable) {
                    sacredGeoAngle = bpmSyncAngle;
                } else {
                    sacredGeoAngle += energy * 0.02;
                }
                const drawAlpha = sacredGeoAlpha * (0.15 + sacredGeoBoost * 0.3);
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(sacredGeoAngle);
                ctx.strokeStyle = `rgba(255,255,255,${drawAlpha})`;
                ctx.lineWidth = 1;

                // Central circle
                ctx.beginPath();
                ctx.arc(0, 0, geoR, 0, Math.PI * 2);
                ctx.stroke();

                // 6 surrounding circles
                for (let i = 0; i < 6; i++) {
                    const a = (i / 6) * Math.PI * 2;
                    ctx.beginPath();
                    ctx.arc(Math.cos(a) * geoR, Math.sin(a) * geoR, geoR, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Outer hexagon
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const a = (i / 6) * Math.PI * 2 - Math.PI / 6;
                    const hx = Math.cos(a) * geoR * 2;
                    const hy = Math.sin(a) * geoR * 2;
                    if (i === 0) ctx.moveTo(hx, hy);
                    else ctx.lineTo(hx, hy);
                }
                ctx.closePath();
                ctx.stroke();
                ctx.restore();
            }

            // ===== LAYER 8: State Overlays =====
            // Drop burst flash
            if (dropFlashIntensity > 0.01) {
                ctx.fillStyle = `rgba(255,255,255,${dropFlashIntensity * 0.3})`;

            // Rave mode warm tint

                ctx.fillRect(0, 0, w, h);
            }

            // Silence mode blue tint

                ctx.fillStyle = 'rgba(100,120,200,0.05)';
                ctx.fillRect(0, 0, w, h);
            }

        async function startAudio() {

                console.log('🔊 AudioContext created:', audioContext.state);

                // Create audio element with proper stream configuration
                audioElement = new Audio();
                audioElement.crossOrigin = 'anonymous';
                audioElement.src = AUDIO_URL;
                audioElement.preload = 'metadata';
                audioElement.loop = false; // CRITICAL: Prevent looping on stream end
                audioElement.autoplay = false;

                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                analyser.smoothingTimeConstant = 0.8;
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                // Create source and connect to analyser
                const source = audioContext.createMediaElementSource(audioElement);
                source.connect(analyser);
                analyser.connect(audioContext.destination);

                // Resume audio context if suspended (Safari requirement)
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                    console.log('⏸️ AudioContext resumed');
                }

                // Setup buffer monitoring for stream stability
                let bufferingStartTime = null;
                let bufferingActive = false;

                // Non-spammy event logging - only log meaningful state changes
                audioElement.addEventListener('loadstart', () => {
                    if (!bufferingActive) {
                        console.log('📡 Audio stream loading...');
                        bufferingActive = true;
                        bufferingStartTime = Date.now();
                    }
                });

                audioElement.addEventListener('canplay', () => {
                    if (bufferingActive) {
                        const bufferTime = Date.now() - bufferingStartTime;
                        console.log(`✅ Audio ready (buffered: ${bufferTime}ms)`);
                        bufferingActive = false;
                        streamHealthStatus.lastDataTime = Date.now();
                        streamHealthStatus.stalledCount = 0;
                    }
                });

                audioElement.addEventListener('playing', () => {
                    console.log('▶️ Playback active');
                    streamHealthStatus.lastDataTime = Date.now();
                });

                // Monitor timeupdate to track if data is flowing
                audioElement.addEventListener('timeupdate', () => {
                    streamHealthStatus.lastDataTime = Date.now();
                    streamHealthStatus.stalledCount = 0;
                });

                // Stalled detection - only log if it persists
                let stalledLogTime = 0;
                audioElement.addEventListener('stalled', () => {
                    // Log stalled state only once every 10 seconds
                    const now = Date.now();
                    if (now - stalledLogTime > 10000) {
                        console.warn('⚠️ Stalled (no data flowing)');
                        stalledLogTime = now;
                    }
                });

                audioElement.addEventListener('pause', () => {
                    if (isPlaying && !bufferingActive) {
                        console.warn('⚠️ Unexpected pause');
                        streamHealthStatus.lastErrorTime = Date.now();
                    }
                });

                // Error handling - non-spammy logging
                let lastErrorLogTime = 0;
                audioElement.addEventListener('error', (e) => {
                    const now = Date.now();
                    let errorMsg = 'Unknown error';

                    if (e.target.error) {
                        if (e.target.error.code === e.target.error.MEDIA_ERR_NETWORK) {
                            errorMsg = 'Network unreachable';
                        } else if (e.target.error.code === e.target.error.MEDIA_ERR_DECODE) {
                            errorMsg = 'Decode error (invalid format)';
                        } else if (e.target.error.code === e.target.error.MEDIA_ERR_UNKNOWN) {
                            errorMsg = 'Unknown error';
                        }
                    }

                    // Only log if error message is different or 30+ seconds passed
                    if (streamHealthStatus.lastErrorMsg !== errorMsg || now - lastErrorLogTime > 30000) {
                        console.error(`❌ Stream error: ${errorMsg}`);
                        lastErrorLogTime = now;
                        streamHealthStatus.lastErrorMsg = errorMsg;
                        audioStatus.textContent = `ERROR: ${errorMsg}`;
                    }

                    streamHealthStatus.errorCount++;
                    streamHealthStatus.lastErrorTime = now;

                    // Trigger auto-recovery if not already retrying
                    if (isPlaying && streamHealthStatus.retryCount < streamHealthStatus.maxRetries) {
                        console.log(`🔄 Initiating recovery (attempt ${streamHealthStatus.retryCount + 1})`);
                        attemptAutoRecovery();
                    }
                });

                // Handle stream end (should not happen for infinite stream)
                audioElement.addEventListener('ended', () => {
                    console.error('❌ Stream ended unexpectedly (infinite stream should not end)');
                    isPlaying = false;
                    audioStatus.textContent = 'STREAM ENDED';
                    streamHealthStatus.lastErrorMsg = 'Stream ended';
                });

                // Start playback
                await audioElement.play();
                isPlaying = true;
                playStartTime = Date.now();
                audioStatus.textContent = 'STREAMING';
                streamHealthStatus.lastDataTime = Date.now();

                console.log('✅ Audio stream started!');

                // Start health monitoring
                startHealthMonitoring();

                animate();

            } catch (err) {
                console.error('❌ Audio startup failed:', err.message);
                isPlaying = false;
                audioStatus.textContent = 'STARTUP ERROR';
                stopHealthMonitoring();
            }
        }

                    audioElement.src = ''; // Clear stream source
                }

                    cancelAnimationFrame(animationId);

                streamHealthStatus.retryCount = 0;
                streamHealthStatus.stalledCount = 0;
                streamHealthStatus.errorCount = 0;

                            circle.classList.add('active');
                            setTimeout(() => circle.classList.remove('active'), 400);
                        }, i * 100); // sfasati di 100ms
                    }
                }

                // ✨ SILVER GLOW PARTICLES - glow argentati a ritmo medi
                const glowMidThreshold = isMobile ? 0.25 : 0.6;
                if (midLevel > glowMidThreshold && Math.random() > (isMobile ? 0.15 : 0.45)) {
                    const glow = silverGlowParticles[Math.floor(Math.random() * silverGlowParticles.length)];
                    const pos = magicPositions[Math.floor(Math.random() * magicPositions.length)];
                    const size = 40 + Math.random() * 80;
                    glow.style.width = size + 'px';
                    glow.style.height = size + 'px';
                    Object.assign(glow.style, pos);
                    glow.classList.add('active');
                    setTimeout(() => glow.classList.remove('active'), 600);
                }

                // 🌀 SPIRAL WHIRL - spiraloidi rotativi random a ritmo
                const whirlMidThreshold = isMobile ? 0.28 : 0.65;
                if (midLevel > whirlMidThreshold && Math.random() > (isMobile ? 0.2 : 0.5)) {
                    const whirl = spiralWhirls[Math.floor(Math.random() * spiralWhirls.length)];
                    const pos = magicPositions[Math.floor(Math.random() * magicPositions.length)];
                    const colors = ['rgba(200, 220, 255, 0.9)', 'rgba(150, 200, 255, 0.9)', 'rgba(220, 200, 255, 0.9)', 'rgba(255, 255, 200, 0.9)'];
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const size = 50 + Math.random() * 80;
                    whirl.style.width = size + 'px';
                    whirl.style.height = size + 'px';
                    whirl.innerHTML = createSpiralSvg(color);
                    Object.assign(whirl.style, pos);
                    whirl.classList.add('active');
                    setTimeout(() => {
                        whirl.classList.remove('active');
                        whirl.innerHTML = '';
                    }, 800);
                }

                // ✨ SHIMMER TWINKLE - scintillio argentato random
                const twinkleMidThreshold = isMobile ? 0.2 : 0.5;
                if (midLevel > twinkleMidThreshold && Math.random() > (isMobile ? 0.3 : 0.7)) {
                    const count = 1 + Math.floor(Math.random() * 3);
                    for (let i = 0; i < count; i++) {
                        setTimeout(() => {
                            const twinkle = shimmerTwinkles[Math.floor(Math.random() * shimmerTwinkles.length)];
                            const pos = magicPositions[Math.floor(Math.random() * magicPositions.length)];
                            Object.assign(twinkle.style, pos);
                            twinkle.classList.add('active');
                            setTimeout(() => twinkle.classList.remove('active'), 400);
                        }, i * 50);
                    }
                }
                
                // � DISTORTION ZONES - distorsioni parziali graduali a tempo
                // Distorsioni su bassi (stack speaker) - DISABILITATO su slow devices
                if (!isSlowDevice) {
                    const distortThreshold = isMobile ? 0.3 : 0.75;
                    if (bassLevel > distortThreshold && Math.random() > (isMobile ? 0.3 : 0.7)) {
                        const zone = distortZones[Math.floor(Math.random() * distortZones.length)];
                        zone.classList.add('active');
                        setTimeout(() => zone.classList.remove('active'), 400);
                    }

                    // Warp glitch su medi (crowd e antenna zone) - SOGLIA RIDOTTA
                    const warpThreshold = isMobile ? 0.3 : 0.7;
                    if (midLevel > warpThreshold && Math.random() > (isMobile ? 0.3 : 0.75)) {
                        const zone = warpZones[Math.floor(Math.random() * warpZones.length)];
                        zone.classList.add('active');
                        setTimeout(() => zone.classList.remove('active'), 300);
                    }

                    // Chromatic split su alti (zone laterali) - SOGLIA RIDOTTA
                    const chromaThreshold = isMobile ? 0.25 : 0.7;
                    if (trebleLevel > chromaThreshold && Math.random() > (isMobile ? 0.3 : 0.8)) {
                        const zone = chromaZones[Math.floor(Math.random() * chromaZones.length)];
                        zone.classList.add('active');
                        setTimeout(() => zone.classList.remove('active'), 200);
                    }
                }
                
                // �🎆 GEOMETRIC STROBES - brillamenti geometrici sui beat
                // Bass -> cerchi + radial burst
                const geoStrobeThreshold = isMobile ? 0.3 : 0.75;
                if (bassLevel > geoStrobeThreshold && Math.random() > (isMobile ? 0.2 : 0.6)) {
                    const choice = Math.random();
                    if (choice < 0.4) {
                        // Cerchi concentrici - OPACITÀ AUMENTATA
                        strobeCircle1.style.opacity = isMobile ? '1' : '0.9';
                        strobeCircle2.style.opacity = isMobile ? '0.9' : '0.7';
                        setTimeout(() => {
                            strobeCircle1.style.opacity = '0';
                            strobeCircle2.style.opacity = '0';
                        }, 60);
                    } else if (choice < 0.7) {
                        // Radial burst dal centro - OPACITÀ AUMENTATA
                        strobeRadial.style.opacity = isMobile ? '1' : '0.8';
                        setTimeout(() => {
                            strobeRadial.style.opacity = '0';
                        }, 80);
                    } else {
                        // Bottom crowd flash - OPACITÀ AUMENTATA
                        strobeBottom.style.opacity = isMobile ? '1' : '0.9';
                        setTimeout(() => {
                            strobeBottom.style.opacity = '0';
                        }, 70);
                    }
                }
            }
            
            // Mid -> speaker walls laterali - SOGLIA RIDOTTA
            const speakerMidThreshold = isMobile ? 0.3 : 0.7;
            if (midLevel > speakerMidThreshold && Math.random() > (isMobile ? 0.3 : 0.8)) {
                if (Math.random() < 0.5) {
                    strobeLeftWall.style.opacity = isMobile ? '1' : '0.8';
                    setTimeout(() => {
                        strobeLeftWall.style.opacity = '0';
                    }, 50);
                } else {
                    strobeRightWall.style.opacity = isMobile ? '1' : '0.8';
                    setTimeout(() => {
                        strobeRightWall.style.opacity = '0';
                    }, 50);
                }
            }

            // Treble -> top flash (antenna beams) - SOGLIA RIDOTTA
            const antennaTrebleThreshold = isMobile ? 0.3 : 0.75;
            if (trebleLevel > antennaTrebleThreshold && Math.random() > (isMobile ? 0.3 : 0.85)) {
                strobeTop.style.opacity = isMobile ? '1' : '0.9';
                setTimeout(() => {
                    strobeTop.style.opacity = '0';
                }, 40);
            }

            // Peak energy -> random geometric strobe - SOGLIA RIDOTTA
            const peakEnergyThreshold = isMobile ? 0.3 : 0.8;
            if (energy > peakEnergyThreshold && Math.random() > (isMobile ? 0.7 : 0.92)) {
                const randomStrobe = geoStrobes[Math.floor(Math.random() * geoStrobes.length)];
                randomStrobe.style.opacity = isMobile ? '1' : '0.95';
                setTimeout(() => {
                    randomStrobe.style.opacity = '0';
                }, 30 + Math.random() * 40);
            }
            
            // 🌊 CONTINUOUS MOTION BLUR - blur motion sui medi
            if (midLevel > 0.75) {
                const blurAmount = midLevel * 3;
                background.style.filter = `blur(${blurAmount}px)`;
                motionBlurActive = true;
            } else if (motionBlurActive) {
                background.style.filter = 'blur(0)';
                motionBlurActive = false;
            }
            
            // 🎲 RANDOM MICRO MOVEMENTS - movimenti sottili costanti
            if (Math.random() > 0.95) {
                const microX = (Math.random() - 0.5) * 3;
                const microY = (Math.random() - 0.5) * 3;
                const microRotate = (Math.random() - 0.5) * 1;
                background.style.transform = `scale(${zoomIntensity}) rotate(${rotateAmount + microRotate}deg) translate(${microX}px, ${microY}px)`;
            }
            
            // 🎯 EFFETTO 3D POV COMPLETO - dondolio su tutti gli assi CON EASING
            // Calcola progress con easing (0-1 ciclico ogni 2 secondi)
            const cycleTime = 2000; // 2 secondi per ciclo
            const rawProgress = (Date.now() % cycleTime) / cycleTime;
            const easedProgress = currentEasingFunc(rawProgress);
            
            // Sinistra/Destra (bassi): movimento orizzontale con easing
            const swayX = (Math.sin(easedProgress * Math.PI * 2) * bassLevel * 40) + (window.targetPoint.x * bassLevel * 0.5);
            
            // Avanti/Indietro (medi): movimento verticale + zoom con easing alternato
            const depthCycle = (Date.now() % 3000) / 3000; // ciclo 3 secondi
            const depthEased = easing.easeInOut(depthCycle); // sempre smooth per profondità
            const swayY = (Math.sin(depthEased * Math.PI * 2) * midLevel * 35) + (window.targetPoint.y * midLevel * 0.5);
            const depthZoom = Math.sin(depthEased * Math.PI * 2) * midLevel * 0.15; // oscillazione zoom per "avanti/indietro"
            
            // Rotazione testa (alti): piccole rotazioni su tutti gli assi con bounce
            const rotateCycle = (Date.now() % 2500) / 2500;
            const rotateEased = easing.bounce(rotateCycle);
            const swayRotateZ = Math.sin(rotateEased * Math.PI * 2) * trebleLevel * 4; // rotazione Z (principale)
            const swayRotateX = Math.sin(rotateEased * Math.PI * 2) * trebleLevel * 2; // tilt testa su/giù
            
            // Zoom burst verso target point CON EASING
            let burstOffsetX = 0, burstOffsetY = 0, burstBlur = 0;
            if (Date.now() - lastZoomBurst < 300) {
                const burstProgress = (Date.now() - lastZoomBurst) / 300; // 0 a 1
                const burstEased = easing.easeOut(burstProgress); // decelerazione rapida
                burstOffsetX = window.targetPoint.x * (1 - burstEased) * 0.5;
                burstOffsetY = window.targetPoint.y * (1 - burstEased) * 0.5;
                // Blur con easing sinusoidale per effetto più organico
                burstBlur = Math.sin(burstEased * Math.PI) * 8; // blur 0→8→0
            }
            
            // Applica TUTTI i movimenti combinati
            background.style.transform = `scale(${zoomIntensity + depthZoom}) rotate(${rotateAmount + swayRotateZ}deg) rotateX(${swayRotateX}deg) translate(${swayX + burstOffsetX}px, ${swayY + burstOffsetY}px)`;
            
            // Blur durante zoom burst verso target
            if (burstBlur > 0) {
                background.style.filter = `blur(${burstBlur}px)`;
            }
            
            // 🌀 CIRCLE PULSE (centro) - MOLTO più visibile con zoom burst
            // Scala diverse per mobile e desktop
            const basePulseSize = isMobile ? 80 : 150;
            const pulseMultiplier = isMobile ? 300 : 600;
            const pulseSize = basePulseSize + bassLevel * pulseMultiplier;
            const pulseBurst = (Date.now() - lastZoomBurst < 300) ? 1.5 : 1; // amplifica durante zoom burst
            circlePulse.style.width = (pulseSize * pulseBurst) + 'px';
            circlePulse.style.height = (pulseSize * pulseBurst) + 'px';
            circlePulse.style.opacity = 0.5 + bassLevel * 0.5;
            circlePulse.style.borderWidth = (Math.max(2, isMobile ? 2 : 3) + bassLevel * (isMobile ? 5 : 10)) + 'px';
            
            // Glow extra su burst
            if (pulseBurst > 1) {
                circlePulse.style.boxShadow = `
                    0 0 60px rgba(255, 255, 255, 1),
                    0 0 120px rgba(255, 255, 255, 0.8),
                    inset 0 0 60px rgba(255, 255, 255, 0.6)
                `;
            } else {
                circlePulse.style.boxShadow = `
                    0 0 30px rgba(255, 255, 255, 0.8),
                    0 0 60px rgba(255, 255, 255, 0.6),
                    inset 0 0 30px rgba(255, 255, 255, 0.4)
                `;
            }
            
            // 🔊 SPEAKER FLASHES (laterali) - più intensi
            speakerFlashes.forEach(flash => {
                flash.style.opacity = midLevel * 1.2;
                flash.style.filter = `blur(${30 + midLevel * 50}px)`;
            });
            
            // 🖼️ PROCEDURAL BACKGROUND - render with audio reactivity
            bgFrameCount++;
            let bgRenderFrequency = isSmallMobile ? 4 : isMobile ? 2 : 1;
            if (isSlowDevice) bgRenderFrequency += 2;
            if (bgFrameCount % bgRenderFrequency === 0) {
                drawProceduralBg(bgCtx, bgCanvas.width, bgCanvas.height, bassLevel, midLevel, trebleLevel, energy, Date.now(), dataArray);
            }

            // 🎨 VORTEX ROTATION - ruota e pulsa (OTTIMIZZATO: meno cerchi su mobile)
            vortexRotation += energy * 3;

            // Render con frequenza ridotta su mobile per performance
            let renderFrequency = isSmallMobile ? 4 : isMobile ? 2 : 1;
            if (isSlowDevice) renderFrequency += 2;
            if (Math.floor(vortexRotation) % renderFrequency === 0) {
                vortexCtx.clearRect(0, 0, vortexCanvas.width, vortexCanvas.height);
                vortexCtx.save();
                vortexCtx.translate(vortexCanvas.width / 2, vortexCanvas.height / 2);
                vortexCtx.rotate(vortexRotation * Math.PI / 180);

                // OTTIMIZZATO: meno cerchi su mobile e slow devices
                const maxRadius = isSlowDevice ? 600 : isMobile ? 800 : 1000;
                const step = isSlowDevice ? 200 : isSmallMobile ? 160 : isMobile ? 140 : 120;
                for (let r = 100; r < maxRadius; r += step) {
                    vortexCtx.strokeStyle = `rgba(255, 255, 255, ${(bassLevel * 0.6) * (1 - r / maxRadius)})`;
                    vortexCtx.lineWidth = 2 + bassLevel * 4;
                    if (!isSlowDevice) {
                        vortexCtx.shadowBlur = 15;
                        vortexCtx.shadowColor = 'rgba(255, 255, 255, 0.6)';
                    } else {
                        vortexCtx.shadowBlur = 0;
                    }
                    vortexCtx.beginPath();
                    vortexCtx.arc(0, 0, r, 0, Math.PI * 2);
                    vortexCtx.stroke();
                }
                vortexCtx.restore();
            }
            
            // Debug: Log frequency data occasionally
            if (Math.floor(Date.now() / 1000) % 2 === 0 && Math.random() < 0.05) {
                console.log(`Frequencies - Bass: ${Math.round(bassLevel*100)}%, Mid: ${Math.round(midLevel*100)}%, Treble: ${Math.round(trebleLevel*100)}%`);
            }
            
            animationId = requestAnimationFrame(animate);
        }
        
        console.log('FREE UNDERGROUND TEKNO - Radio VJ System Ready');
    </script>
</body>
</html>
