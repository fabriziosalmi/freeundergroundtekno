<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE UNDERGROUND TEKNO - Live Radio VJ</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%2300ff41' d='M2 1h1v1H2zM5 1h1v1H5zM10 1h1v1h-1zM13 1h1v1h-1zM3 2h1v1H3zM12 2h1v1h-1zM1 3h1v1H1zM4 3h2v1H4zM7 3h2v1H7zM10 3h2v1h-2zM14 3h1v1h-1zM1 4h1v1H1zM3 4h1v1H3zM5 4h6v1H5zM12 4h1v1h-1zM14 4h1v1h-1zM1 5h14v1H1zM1 6h1v1H1zM3 6h10v1H3zM14 6h1v1h-1zM1 7h1v1H1zM4 7h1v1H4zM11 7h1v1h-1zM14 7h1v1h-1zM2 8h2v1H2zM12 8h2v1h-2zM3 9h1v1H3zM5 9h1v1H5zM10 9h1v1h-1zM12 9h1v1h-1z'/%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        
        /* BACKGROUND IMAGE - con effetti 3D e motion blur */
        #background {
            position: fixed;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 0;
            transition: transform 0.05s ease-out, filter 0.1s ease-out;
            transform-origin: center center;
            will-change: transform, filter;
        }

        #proceduralBg {
            width: 100%;
            height: 100%;
        }
        
        /* Zoom burst effect SOTTOCASSA - PIÙ POTENTE! */
        body.zoom-burst #background {
            animation: zoom-burst 0.3s ease-out;
        }
        
        @keyframes zoom-burst {
            0% { 
                transform: scale(1);
                filter: blur(0);
            }
            50% { 
                transform: scale(1.35); /* da 1.15 a 1.35! */
                filter: blur(12px); /* da 8px a 12px! */
            }
            100% { 
                transform: scale(1);
                filter: blur(0);
            }
        }
        
        /* Rapid shake */
        body.shake-burst #background {
            animation: shake-burst 0.2s ease-out;
        }
        
        @keyframes shake-burst {
            0%, 100% { transform: translate(0, 0) scale(1); }
            20% { transform: translate(-10px, 5px) scale(1.05) rotate(2deg); }
            40% { transform: translate(10px, -5px) scale(0.98) rotate(-2deg); }
            60% { transform: translate(-8px, -5px) scale(1.03) rotate(1deg); }
            80% { transform: translate(8px, 5px) scale(0.99) rotate(-1deg); }
        }
        
        /* Psychedelic states */
        body.trip-mode #background {
            animation: breathe 4s ease-in-out infinite;
        }
        
        @keyframes breathe {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(2deg); }
        }
        
        body.khole-mode #background {
            filter: blur(3px) contrast(1.5) saturate(0);
            animation: khole-drift 8s ease-in-out infinite;
        }
        
        @keyframes khole-drift {
            0%, 100% { transform: scale(1) translateY(0); }
            25% { transform: scale(1.05) translateY(-20px) rotate(1deg); }
            75% { transform: scale(0.95) translateY(20px) rotate(-1deg); }
        }
        
        /* STROBE OVERLAY - flash bianco */
        #strobeFlash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            opacity: 0;
            z-index: 999;
            pointer-events: none;
        }
        
        /* GEOMETRIC STROBES - flash geometrici che seguono il disegno */
        .geo-strobe {
            position: fixed;
            opacity: 0;
            pointer-events: none;
            z-index: 50;
            transition: opacity 0.05s;
        }
        
        /* Strobes laterali (sound system walls) */
        .geo-strobe.left-wall {
            left: 0;
            top: 0;
            width: 25%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0.9), transparent);
        }
        
        .geo-strobe.right-wall {
            right: 0;
            top: 0;
            width: 25%;
            height: 100%;
            background: linear-gradient(to left, rgba(255,255,255,0.9), transparent);
        }
        
        /* Strobes cerchi (seguono i cerchi concentrici) */
        .geo-strobe.circle-ring {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 3px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            background: transparent;
        }
        
        /* Strobes orizzontali (crowd/stage) */
        .geo-strobe.horizontal-bottom {
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            background: linear-gradient(to top, rgba(255,255,255,0.9), transparent);
        }
        
        .geo-strobe.horizontal-top {
            top: 0;
            left: 0;
            width: 100%;
            height: 20%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
        }
        
        /* Strobes radiali dal centro */
        .geo-strobe.radial-burst {
            top: 50%;
            left: 50%;
            width: 200%;
            height: 200%;
            transform: translate(-50%, -50%);
            background: radial-gradient(
                circle at center,
                transparent 20%,
                rgba(255,255,255,0.8) 40%,
                transparent 60%
            );
        }
        
        /* PULSE EFFECT - cerchi molto più visibili */
        #circlePulse {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 5px solid rgba(255, 255, 255, 0.9);
            z-index: 1;
            pointer-events: none;
            /* Single-layer shadow (was 3 layers including an inset). Same visual
               weight, ~half the paint cost when width/height/opacity change. */
            box-shadow: 0 0 45px rgba(255, 255, 255, 0.75);
            will-change: width, height, opacity, box-shadow;
        }
        
        /* SPEAKER FLASHES - flash sulle casse laterali */
        .speaker-flash {
            position: fixed;
            width: 150px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, transparent 70%);
            opacity: 0;
            pointer-events: none;
            z-index: 2;
            filter: blur(30px);
        }
        
        .speaker-flash.left {
            left: 15%;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .speaker-flash.right {
            right: 15%;
            top: 50%;
            transform: translateY(-50%);
        }
        
        /* CROWD STROBES - luci che illuminano la folla */
        #crowdStrobe {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30%;
            background: linear-gradient(to top, rgba(255,255,255,0.8), transparent);
            opacity: 0;
            pointer-events: none;
            z-index: 3;
            mix-blend-mode: overlay;
        }
        
        /* VORTEX ROTATION - rimosso in v1.3.6: era 8 cerchi concentrici 2-6px
           con shadowBlur 15 sui kick → terzo layer di "gabbia" attorno alla
           pupilla, sopra tunnel-ring e LAYER 1 pulse-rings (anch'essi rimossi).
           Bonus: -3-5 ms/frame nel worst case. Per re-enable: git log -p. */

        /* TUNNEL EFFECT - rimosso in v1.3.6: i 6 ring CSS che ruotavano
           continuamente attorno al centro creavano una "gabbia" visiva fissa,
           non audio-reactive. Pulizia totale del bg attorno alla pupilla.
           Per re-enable: git log -p -- docs/index.html | grep -A 30 tunnel-ring */
        
        /* GRAIN OVERLAY - rumore analogico */
        #grainOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.4"/></svg>');
            opacity: 0.15;
            z-index: 100;
            pointer-events: none;
            animation: grain-move 0.5s steps(4) infinite;
            will-change: transform;
        }
        
        @keyframes grain-move {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-2px, 2px); }
            50% { transform: translate(2px, -2px); }
            75% { transform: translate(-2px, -2px); }
        }
        
        /* VHS GLITCH LINES */
        #vhsLines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 101;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
        }
        
        .vhs-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            animation: vhs-scan 8s linear infinite;
            will-change: transform;
        }

        @keyframes vhs-scan {
            0%   { transform: translateY(-2px); }
            100% { transform: translateY(100vh); }
        }
        
        /* CHROMATIC ABERRATION */
        body.aberration-mode #background {
            animation: chromatic-shift 0.3s ease-in-out infinite;
        }
        
        @keyframes chromatic-shift {
            0%, 100% { filter: none; }
            50% {
                /* Luminance offset invece di chromatic — il "ghost CRT" autoriale B&W */
                filter:
                    drop-shadow(2px 0 0 rgba(255,255,255,0.5))
                    drop-shadow(-2px 0 0 rgba(0,0,0,0.5));
            }
        }
        
        /* SCANLINES - effetto CRT */
        #scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 102;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0) 50%,
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            opacity: 0.3;
        }
        
        /* BASS-CLUSTER FLASH (BC FLASH) — composite-gated rare event.
           Triggered by adaptive bass-RMS threshold + kickStack≥2 + 30s hard floor cooldown.
           80 ms attack / 200 ms decay. Visual: bloom blu (#0ea5e9) + scanlines stretti
           + chromatic aberration shift. Z-index sopra scanlines normali, sotto grain. */
        #bcFlash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 95;
            pointer-events: none;
            opacity: 0;
            will-change: opacity, transform;
            background:
                radial-gradient(ellipse at center,
                    rgba(14, 165, 233, 0.55) 0%,
                    rgba(14, 165, 233, 0.30) 25%,
                    rgba(14, 165, 233, 0.12) 50%,
                    transparent 75%);
            mix-blend-mode: screen;
            filter: blur(1.5px);
        }
        #bcFlash::before {
            /* Scanlines orizzontali stretti, blu */
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                rgba(14, 165, 233, 0.0) 0px,
                rgba(14, 165, 233, 0.0) 2px,
                rgba(14, 165, 233, 0.45) 2px,
                rgba(14, 165, 233, 0.45) 3px
            );
            mix-blend-mode: screen;
            opacity: 0.9;
        }
        #bcFlash::after {
            /* Chromatic aberration: ring offset cyan/magenta */
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center,
                transparent 35%,
                rgba(34, 211, 238, 0.20) 45%,
                transparent 55%);
            transform: translate3d(3px, 0, 0);
            mix-blend-mode: screen;
            box-shadow:
                inset  4px 0 0 rgba(232, 121, 249, 0.10),
                inset -4px 0 0 rgba(34, 211, 238, 0.10);
        }

        /* VIGNETTE - bordi scuri */
        #vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 103;
            pointer-events: none;
            background: radial-gradient(
                ellipse at center,
                transparent 30%,
                rgba(0, 0, 0, 0.4) 80%,
                rgba(0, 0, 0, 0.8) 100%
            );
        }
        
        /* DUST PARTICLES - polvere sullo schermo */
        .dust-particle {
            position: fixed;
            width: 2px;
            height: 2px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            z-index: 104;
            pointer-events: none;
            animation: dust-float 20s linear infinite;
            will-change: transform, opacity;
        }
        
        @keyframes dust-float {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translate(var(--dust-x), var(--dust-y)) rotate(360deg);
                opacity: 0;
            }
        }
        
        
        /* 🌀 DISTORTION ZONES - distorsioni parziali graduali */
        .distortion-zone {
            position: fixed;
            pointer-events: none;
            z-index: 50;
            mix-blend-mode: screen;
            opacity: 0;
            transition: opacity 0.1s ease-out, transform 0.2s ease-out;
        }
        
        .distortion-zone.active {
            animation: distort-pulse 0.4s ease-out;
        }
        
        @keyframes distort-pulse {
            0% {
                opacity: 0;
                transform: scale(0.8);
                filter: blur(10px);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.2);
                filter: blur(5px);
            }
            100% {
                opacity: 0;
                transform: scale(1);
                filter: blur(15px);
            }
        }
        
        /* Effetto glitch warp su zone specifiche */
        .warp-zone {
            position: fixed;
            pointer-events: none;
            z-index: 51;
            background: linear-gradient(45deg,
                transparent 0%,
                rgba(255,255,255,0.25) 50%,
                transparent 100%
            );
            opacity: 0;
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
        }
        
        .warp-zone.active {
            animation: warp-glitch 0.3s steps(3) infinite;
        }
        
        @keyframes warp-glitch {
            0%   { opacity: 0.6; transform: translateX(0)    skewX(0deg);  }
            33%  { opacity: 0.8; transform: translateX(-5px) skewX(5deg);  }
            66%  { opacity: 0.7; transform: translateX(5px)  skewX(-5deg); }
            100% { opacity: 0.6; transform: translateX(0)    skewX(0deg);  }
        }
        
        /* Chromatic split su zone specifiche */
        .chroma-zone {
            position: fixed;
            pointer-events: none;
            z-index: 52;
            background: radial-gradient(
                circle at center,
                rgba(255,255,255,0.4) 0%,
                transparent 50%
            );
            opacity: 0;
            mix-blend-mode: screen;
        }
        
        .chroma-zone.active {
            animation: chroma-split 0.2s ease-out;
        }
        
        @keyframes chroma-split {
            0%   { opacity: 0;   transform: translate(0, 0);   }
            25%  { opacity: 0.9; transform: translate(-3px, 0);
                   filter: drop-shadow(6px 0 0 rgba(255,255,255,0.5)) drop-shadow(-6px 0 0 rgba(0,0,0,0.5)); }
            75%  { opacity: 0.7; transform: translate(3px, 0);
                   filter: drop-shadow(-4px 0 0 rgba(255,255,255,0.5)) drop-shadow(4px 0 0 rgba(0,0,0,0.5)); }
            100% { opacity: 0;   transform: translate(0, 0);   }
        }

        
        /* 💫 SUPER SPATIAL GLOW STROBO - effetto strobo spaziale con glow */
        #spatialStrobo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 500;
            opacity: 0;
            mix-blend-mode: screen;
            transition: opacity 0.05s linear;
        }
        
        /* Pattern 1: Radial explosion */
        #spatialStrobo.radial-explosion {
            background: radial-gradient(
                circle at center,
                rgba(255, 255, 255, 1) 0%,
                var(--glow-color, rgba(255, 255, 255, 0.8)) 30%,
                transparent 60%
            );
            filter: blur(20px);
        }
        
        /* Pattern 3: Diamond burst */
        #spatialStrobo.diamond-burst {
            background: conic-gradient(
                from 45deg at center,
                transparent 0deg,
                var(--glow-color, rgba(255, 255, 255, 0.9)) 90deg,
                transparent 180deg,
                var(--glow-color, rgba(255, 255, 255, 0.9)) 270deg,
                transparent 360deg
            );
            filter: blur(25px);
        }
        
        /* Pattern 4: Spiral glow */
        #spatialStrobo.spiral-glow {
            background: conic-gradient(
                from 0deg at center,
                var(--glow-color, rgba(255, 255, 255, 0.0)) 0deg,
                var(--glow-color, rgba(255, 255, 255, 0.9)) 60deg,
                var(--glow-color, rgba(255, 255, 255, 0.0)) 120deg,
                var(--glow-color, rgba(255, 255, 255, 0.9)) 180deg,
                var(--glow-color, rgba(255, 255, 255, 0.0)) 240deg,
                var(--glow-color, rgba(255, 255, 255, 0.9)) 300deg,
                var(--glow-color, rgba(255, 255, 255, 0.0)) 360deg
            );
            filter: blur(30px);
            animation: rotate-strobo 0.3s linear infinite;
        }
        
        /* Pattern 5: Ring pulse */
        #spatialStrobo.ring-pulse {
            background: radial-gradient(
                circle at center,
                transparent 30%,
                var(--glow-color, rgba(255, 255, 255, 0.9)) 40%,
                transparent 50%,
                var(--glow-color, rgba(255, 255, 255, 0.7)) 60%,
                transparent 70%
            );
            filter: blur(10px);
            animation: pulse-scale 0.2s ease-out infinite;
        }
        
        @keyframes rotate-strobo {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        @keyframes pulse-scale {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
        }

        /* ✨ SILVER GLOW PARTICLES - particelle glow argentate stroboscopiche */
        .silver-glow-particle {
            position: fixed;
            pointer-events: none;
            z-index: 40;
            border-radius: 50%;
            opacity: 0;
            filter: blur(8px);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.9),
                        0 0 40px rgba(255, 255, 255, 0.6),
                        0 0 60px rgba(255, 255, 255, 0.4);
            background: radial-gradient(circle, rgba(255, 255, 255, 0.8) 0%, rgba(255, 255, 255, 0.5) 50%, transparent 70%);
        }

        .silver-glow-particle.active {
            animation: glow-pulse 0.6s ease-out forwards;
        }

        @keyframes glow-pulse {
            0% {
                opacity: 0;
                transform: scale(0.3);
            }
            40% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: scale(1.8);
            }
        }

        /* 🌀 SPIRAL WHIRL - effetti spiraloidi rotativi */
        .spiral-whirl {
            position: fixed;
            pointer-events: none;
            z-index: 35;
            opacity: 0;
        }

        .spiral-whirl.active {
            animation: whirl-spin 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes whirl-spin {
            0% {
                opacity: 0;
                transform: scale(0.2) rotate(0deg);
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: scale(1.5) rotate(720deg);
            }
        }

        /* ✨ SHIMMER TWINKLE - effetto scintillio */
        .shimmer-twinkle {
            position: fixed;
            pointer-events: none;
            z-index: 38;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            opacity: 0;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
        }

        .shimmer-twinkle.active {
            animation: twinkle-flash 0.4s ease-out forwards;
        }

        @keyframes twinkle-flash {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(3);
            }
        }

        /* 🌀 LOCALIZED SPIRAL ZOOM - zoom spirale localizzati */
        .spiral-vortex {
            position: fixed;
            pointer-events: none;
            z-index: 60;
            opacity: 0;
            mix-blend-mode: screen;
            border-radius: 50%;
            transition: opacity 0.1s ease-out;
        }
        
        .spiral-vortex.active {
            animation: spiral-zoom-in 0.8s ease-out forwards;
        }
        
        @keyframes spiral-zoom-in {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.3) rotate(0deg);
                filter: blur(20px);
            }
            30% {
                opacity: 0.9;
                transform: translate(-50%, -50%) scale(1.5) rotate(180deg);
                filter: blur(5px);
            }
            70% {
                opacity: 0.7;
                transform: translate(-50%, -50%) scale(2.2) rotate(360deg);
                filter: blur(10px);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(3) rotate(540deg);
                filter: blur(25px);
            }
        }
        
        /* Variante: spirale che si contrae (implode) */
        .spiral-vortex.implode {
            animation: spiral-implode 0.6s ease-in forwards;
        }
        
        @keyframes spiral-implode {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(3) rotate(540deg);
                filter: blur(25px);
            }
            40% {
                opacity: 0.9;
                transform: translate(-50%, -50%) scale(1.5) rotate(270deg);
                filter: blur(5px);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.2) rotate(0deg);
                filter: blur(15px);
            }
        }
        
        /* Variante: spirale pulsante */
        .spiral-vortex.pulse {
            animation: spiral-pulse 0.5s ease-in-out forwards;
        }
        
        @keyframes spiral-pulse {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8) rotate(0deg);
            }
            25% {
                opacity: 0.9;
                transform: translate(-50%, -50%) scale(1.8) rotate(90deg);
                filter: blur(3px);
            }
            50% {
                opacity: 0.8;
                transform: translate(-50%, -50%) scale(1.2) rotate(180deg);
                filter: blur(8px);
            }
            75% {
                opacity: 0.6;
                transform: translate(-50%, -50%) scale(1.6) rotate(270deg);
                filter: blur(5px);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(2.5) rotate(360deg);
                filter: blur(20px);
            }
        }
        
        /* ⚫⚪ NEGATIVE LAYER - effetto negativo con raggi rotativi */
        #negativeLayer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 150;
            opacity: 0;
            mix-blend-mode: difference; /* effetto negativo/inverso */
            transition: opacity 0.05s linear;
            /* Pupil mask: cuts a soft hole that follows the pupil as it moves.
               --pupil-x / --pupil-y are px offsets from viewport center (set
               from JS each frame). --pupil-r drives the hole size + feather.
               Multi-stop gradient → contour mai netto. */
            --pupil-r: 80px;
            --pupil-x: 0px;
            --pupil-y: 0px;
            -webkit-mask: radial-gradient(circle at
                calc(50% + var(--pupil-x)) calc(50% + var(--pupil-y)),
                transparent 0,
                transparent calc(var(--pupil-r) * 0.55),
                rgba(0,0,0,0.20) calc(var(--pupil-r) * 0.80),
                rgba(0,0,0,0.55) var(--pupil-r),
                rgba(0,0,0,0.85) calc(var(--pupil-r) + 40px),
                #000 calc(var(--pupil-r) + 90px));
            mask: radial-gradient(circle at
                calc(50% + var(--pupil-x)) calc(50% + var(--pupil-y)),
                transparent 0,
                transparent calc(var(--pupil-r) * 0.55),
                rgba(0,0,0,0.20) calc(var(--pupil-r) * 0.80),
                rgba(0,0,0,0.55) var(--pupil-r),
                rgba(0,0,0,0.85) calc(var(--pupil-r) + 40px),
                #000 calc(var(--pupil-r) + 90px));
        }
        
        /* Raggi rotativi dal centro */
        .rotating-rays {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200vw;
            height: 200vw;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.05s linear;
        }
        
        .rotating-rays.active {
            animation: rotate-rays-fast 0.3s linear infinite;
        }
        
        @keyframes rotate-rays-fast {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        
        /* Pattern 1: Raggi singoli bianchi */
        .rotating-rays.single-beam {
            background: conic-gradient(
                from 0deg at center,
                transparent 0deg,
                white 2deg,
                transparent 4deg,
                transparent 180deg,
                white 182deg,
                transparent 184deg,
                transparent 360deg
            );
            filter: blur(2px) drop-shadow(0 0 20px white);
        }
        
        /* Pattern 2: Raggi multipli (8 raggi) */
        .rotating-rays.multi-beam {
            background: conic-gradient(
                from 0deg at center,
                white 0deg, transparent 5deg,
                white 45deg, transparent 50deg,
                white 90deg, transparent 95deg,
                white 135deg, transparent 140deg,
                white 180deg, transparent 185deg,
                white 225deg, transparent 230deg,
                white 270deg, transparent 275deg,
                white 315deg, transparent 320deg,
                white 360deg
            );
            filter: blur(3px) drop-shadow(0 0 15px white);
        }
        
        /* Pattern 3: Spirale continua */
        .rotating-rays.spiral-beam {
            background: conic-gradient(
                from 0deg at center,
                white 0deg,
                transparent 30deg,
                white 60deg,
                transparent 90deg,
                white 120deg,
                transparent 150deg,
                white 180deg,
                transparent 210deg,
                white 240deg,
                transparent 270deg,
                white 300deg,
                transparent 330deg,
                white 360deg
            );
            filter: blur(4px) drop-shadow(0 0 25px white);
        }
        
        /* Strobo circolari concentrici */
        .circular-strobo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 3px solid white;
            pointer-events: none;
            opacity: 0;
            box-shadow: 0 0 40px white, inset 0 0 40px white;
        }
        
        .circular-strobo.active {
            animation: circle-pulse-expand 0.4s ease-out forwards;
        }
        
        @keyframes circle-pulse-expand {
            0% {
                width: 50px;
                height: 50px;
                opacity: 1;
                border-width: 5px;
            }
            50% {
                opacity: 0.8;
                border-width: 3px;
            }
            100% {
                width: 150vw;
                height: 150vw;
                opacity: 0;
                border-width: 1px;
            }
        }
        
        /* 🌊 FRACTAL TEARS - distorsioni frattali organiche */
        .fractal-tear {
            position: fixed;
            pointer-events: none;
            z-index: 155;
            opacity: 0;
            mix-blend-mode: difference;
            background: white;
            filter: blur(3px);
        }
        
        .fractal-tear.active {
            animation: tear-distort 0.5s ease-out forwards;
        }
        
        @keyframes tear-distort {
            0% {
                opacity: 0;
                transform: scale(0.5) rotate(0deg);
            }
            40% {
                opacity: 0.9;
                transform: scale(1.2) rotate(180deg);
            }
            100% {
                opacity: 0;
                transform: scale(2) rotate(360deg);
            }
        }
        
        /* LIVE TOGGLE — iOS pill style */
        #liveToggle {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 7px;
            background: rgba(30,30,30,0.55);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 100px;
            color: rgba(255,255,255,0.85);
            padding: 7px 14px 7px 11px;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            opacity: 0.45;
            transition: opacity 0.35s ease, transform 0.12s ease, background 0.3s ease;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            box-shadow: 0 2px 12px rgba(0,0,0,0.35), inset 0 0.5px 0 rgba(255,255,255,0.06);
        }
        #liveToggle:hover {
            opacity: 0.85;
            background: rgba(40,40,40,0.65);
        }
        #liveToggle:active {
            transform: scale(0.93);
            background: rgba(50,50,50,0.7);
        }
        #liveToggle.playing {
            opacity: 0.55;
        }
        #liveToggle.playing:hover {
            opacity: 0.9;
        }
        #liveToggle.autohide {
            opacity: 0;
            pointer-events: none;
        }
        #liveIcon {
            font-size: 11px;
            line-height: 1;
            display: flex;
            align-items: center;
        }
        #liveLabel {
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.7;
        }
        /* Nested eye-toggle inside the LIVE pill. Visible only when playing.
           Tap toggles webcam-reflection mode (Phase 1: OFF / MIRROR). */
        #eyeToggle {
            display: none;
            margin-left: 4px;
            padding-left: 10px;
            border-left: 1px solid rgba(255,255,255,0.18);
            font-size: 14px;
            line-height: 1;
            min-width: 14px;            /* guarantee a tappable area even if glyph fallback */
            text-align: center;
            opacity: 0.6;
            transition: opacity 0.2s ease, transform 0.12s ease;
            cursor: pointer;
        }
        #liveToggle.playing #eyeToggle {
            display: flex;
            align-items: center;
        }
        #eyeToggle:hover { opacity: 1; }
        #eyeToggle:active { transform: scale(0.85); }
        #eyeToggle.on { opacity: 1; color: rgba(255,255,255,0.95); }

        /* 💫 DREAM SOUNDSYSTEM LAYER - blurred memory flashes */
        #dreamLayer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 250;  /* Above effects, below strobes */
            pointer-events: none;
        }

        .dream-image {
            position: fixed;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            z-index: 250;
            pointer-events: none;

            /* Dream effect: heavy blur + glow */
            filter: blur(40px) brightness(1.3) contrast(0.8);
            mix-blend-mode: screen;  /* Light blend for ghostly effect */

            /* Animation: fade in/out like dreaming */
            transition: opacity 0.8s ease-in-out;
        }

        /* Dream appearance state */
        .dream-image.dreaming {
            opacity: 0.5;  /* Semi-transparent like a memory */
        }

        /* Extra blur for more dream effect */
        .dream-image.deep-dream {
            opacity: 0.35;
            filter: blur(60px) brightness(1.5) contrast(0.6) saturate(0.8);
        }

        /* Slightly less blur for occasional clarity */
        .dream-image.lucid-dream {
            opacity: 0.6;
            filter: blur(25px) brightness(1.2) contrast(0.9);
        }

        /* Animation for gentle pulse during appearance */
        @keyframes dream-pulse {
            0% { opacity: 0; filter: blur(50px) brightness(1.0) contrast(0.7); }
            50% { opacity: 0.5; filter: blur(35px) brightness(1.4) contrast(0.8); }
            100% { opacity: 0; filter: blur(60px) brightness(1.0) contrast(0.6); }
        }

        .dream-image.pulse-dream {
            animation: dream-pulse 3s ease-in-out forwards;
        }

        /* Glow effect overlay for additional atmospheric feel */
        @keyframes dream-glow {
            0% { text-shadow: 0 0 0px rgba(255,255,255,0); }
            50% { text-shadow: 0 0 80px rgba(255,255,255,0.8); }
            100% { text-shadow: 0 0 0px rgba(255,255,255,0); }
        }

        .dream-image.glow-dream {
            animation: dream-glow 2.5s ease-in-out infinite;
        }


        /* RESPONSIVE DESIGN - MOBILE OPTIMIZATIONS */
        @media (max-width: 768px) {
            /* Speaker flashes - scale per schermi piccoli */
            .speaker-flash {
                width: 100px;
                height: 250px;
                filter: blur(20px);
            }

            .speaker-flash.left {
                left: 10%;
            }

            .speaker-flash.right {
                right: 10%;
            }

            /* Circle pulse - più piccolo su mobile */
            #circlePulse {
                width: 50px;
                height: 50px;
                border: 3px solid rgba(255, 255, 255, 0.9);
            }

            /* Geometric strobes - scale per mobile */
            #strobeCircle1 {
                width: 150px !important;
                height: 150px !important;
            }

            #strobeCircle2 {
                width: 300px !important;
                height: 300px !important;
            }

            /* Distortion zones - adjust positions for mobile */
            .distortion-zone {
                width: 120px !important;
                height: 180px !important;
            }

            .warp-zone {
                width: 200px !important;
                height: 120px !important;
            }

            .chroma-zone {
                width: 100px !important;
                height: 100px !important;
            }
        }

        /* PUPIL CANVAS — dedicated high-z layer so the central pupil sits on top
           of every audio-reactive layer, including the vortex rings that used to
           pass through it. Static at viewport center (no sway). */
        #pupilCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 600;
        }

        /* FREEZE OVERLAY — full-screen snapshot canvas that appears on extreme
           wall→silence stacchi (max 1 / 5 min). Sopra TUTTO, B&W + contrast bump.
           opacity controlled by JS (1 during hold, fade to 0 in 400 ms). */
        #freezeOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1200;
            opacity: 0;
            filter: saturate(0) contrast(1.18) brightness(0.96);
        }

        /* SILENCE MODE — page eases into stillness when audio drops out.
           JS already fades the audio-reactive layers; here we pause the
           purely-CSS continuous animations so nothing keeps moving on its own. */
        body.silent .dust-particle,
        body.silent .vhs-line,
        body.silent #grainOverlay {
            animation-play-state: paused;
        }
        body.silent .dust-particle,
        body.silent .vhs-line,
        body.silent #grainOverlay {
            opacity: 0;
            transition: opacity 0.8s ease-out;
        }

    </style>
</head>
<body>

    <script>
        const AUDIO_URL = 'https://radio.freeundergroundtekno.org/listen/free_underground_tekno/radio.mp3';
        
        let audioContext = null;
        let audioElement = null;
        let analyser = null;
        let isPlaying = false;
        let animationId = null;
        
        // DOM elements
        const background = document.getElementById('background');
        const strobeFlash = document.getElementById('strobeFlash');
        const circlePulse = document.getElementById('circlePulse');
        const speakerFlashes = document.querySelectorAll('.speaker-flash');
        const crowdStrobe = document.getElementById('crowdStrobe');
        const bgCanvas = document.getElementById('proceduralBg');
        const bgCtx = bgCanvas.getContext('2d');
        const vhsLines = document.getElementById('vhsLines');
        const grainOverlay = document.getElementById('grainOverlay');
        
        // Geometric strobes
        const strobeLeftWall = document.getElementById('strobeLeftWall');
        const strobeRightWall = document.getElementById('strobeRightWall');
        const strobeCircle1 = document.getElementById('strobeCircle1');
        const strobeCircle2 = document.getElementById('strobeCircle2');
        const strobeBottom = document.getElementById('strobeBottom');
        const strobeTop = document.getElementById('strobeTop');
        const strobeRadial = document.getElementById('strobeRadial');
        const geoStrobes = [strobeLeftWall, strobeRightWall, strobeCircle1, strobeCircle2, strobeBottom, strobeTop, strobeRadial];
        
        // 💫 Spatial strobo
        const spatialStrobo = document.getElementById('spatialStrobo');
        const stroboPatterns = ['radial-explosion', 'diamond-burst', 'spiral-glow', 'ring-pulse'];
        // Strip-color discipline: only ritualScore is authorized to add color. Strobo
        // patterns retain their geometry but stay strictly white/silver.
        const stroboColors = [
            'rgba(255, 255, 255, 0.9)'  // pure white
        ];
        let currentStroboPattern = stroboPatterns[0];
        let currentStroboColor = stroboColors[0];
        
        // 🌀 Spiral vortexes
        const spiralVortexes = [
            document.getElementById('spiral1'),
            document.getElementById('spiral2'),
            document.getElementById('spiral3'),
            document.getElementById('spiral4'),
            document.getElementById('spiral5')
        ];
        
        // Posizioni strategiche per le spirali (speaker stacks, centro, crowd, antenna)
        const spiralPositions = [
            { top: '25%', left: '15%' },   // stack speaker sinistro
            { top: '25%', left: '85%' },   // stack speaker destro
            { top: '50%', left: '50%' },   // centro spirale principale
            { top: '15%', left: '50%' },   // zona antenna
            { bottom: '25%', left: '50%' } // zona crowd
        ];
        
        // Strip-color: spiral-vortex restano in pura scala monocromatica.
        const spiralColors = [
            'rgba(255, 255, 255, 0.7)'
        ];
        
        const spiralAnimations = ['active', 'implode', 'pulse'];
        
        // Rileva se è mobile
        const isMobile = window.innerWidth <= 768;
        const isSmallMobile = window.innerWidth <= 480;

        // ===== PROCEDURAL BACKGROUND =====
        // Offscreen canvas for pre-rendered hex grid
        let hexGridCanvas = document.createElement('canvas');
        let hexGridCtx = hexGridCanvas.getContext('2d');
        // Offscreen scratch per applicare un radial hole soft al center del hex
        // prima del blit sul bgCanvas. Evita di erodere altri layer (warehouse
        // dust / listener pulses / parallax) col destination-out diretto.
        let hexMaskedCanvas = document.createElement('canvas');
        let hexMaskedCtx = hexMaskedCanvas.getContext('2d');
        let spiralAngleAccum = 0;

        // ===== V2 LAYERED ART STATE =====
        // Layer 0: Star Field / Warehouse Dust
        const starCount = isSmallMobile ? 80 : isMobile ? 120 : 200;
        const bgParticles = [];
        for (let i = 0; i < starCount; i++) {
            bgParticles.push({
                x: Math.random(),
                y: Math.random(),
                size: Math.random() * 1.5 + 0.5,
                speed: Math.random() * 0.0002 + 0.0001,
                twinkleOffset: Math.random() * Math.PI * 2,
                warm: false // set true for marathon golden particles
            });
        }

        // Pre-rendered glow sprites for stars: a soft radial gradient blitted per
        // particle. Removes the hard fillRect edges that read as "square pixels"
        // when alpha saturates on bright passages.
        function _makeStarSprite(r, g, b) {
            const c = document.createElement('canvas');
            c.width = c.height = 16;
            const sctx = c.getContext('2d');
            const grad = sctx.createRadialGradient(8, 8, 0, 8, 8, 8);
            grad.addColorStop(0,    `rgba(${r},${g},${b},1)`);
            grad.addColorStop(0.35, `rgba(${r},${g},${b},0.55)`);
            grad.addColorStop(1,    `rgba(${r},${g},${b},0)`);
            sctx.fillStyle = grad;
            sctx.fillRect(0, 0, 16, 16);
            return c;
        }
        const starSpriteWhite = _makeStarSprite(255, 255, 255);
        // Strip-color Tier 1: marathonMode non porta più tinta amber. Tutto resta bianco.

        let lastPulseTime = 0;

        const constellationMax = 6;

        let constIdx = 0;
        let lastConstellation = 0;

        let trebleHistIdx = 0;

        let lastSteadyBeatTime = 0;
        let pupilDilation = 0;      // 0-1, smoothed

        let bpmPulseIntensity = 0;

        // sub (30-60 Hz) = the subwoofer body
        // body (80-150 Hz) = the punch
        // punch (300-600 Hz) = the transient click / skin
        // kickStack counts how many bands are firing right now (0..3). A 3-stack

        let subKick = 0, bodyKick = 0, punchKick = 0, kickStack = 0;

        const bassHistory = new Float32Array(60); // ~1 s @ 60 fps

        let bassHistoryFilled = false;
        let cassoneIntensity = 0;
        let cassoneVel = 0;

        // Recharges fast on any kick band firing; decays slowly when none of them fire.
        // Multiplied into the pupil scale → "no cassa = pupilla si rimpicciolisce sempre di più".
        // Decay rate is bi-modal: 0.997/frame sopra 0.30, 0.99/frame sotto → la sag accelera
        // entrando nel breakdown profondo invece di asintotizzare piatta verso il floor.
        let bassCharge = 1;

        // Mirror negativo del cassone overshoot: la cassa che si stacca → pupilla snap-in

        let lastKickFiringAt = 0;
        let bdSnapFireAt = 0;
        let bdSnapArmed = false;
        let bdSnapAmount = 0;             // 0..1, easeOut quadratico dal fire

        // Three "voices" with the SAME anatomy:
        //   • instantaneous level     — already raw (subKick/bodyKick/punchKick, trebleLevel, midLevel)
        //   • onset event             — rising-edge of the band's primary metric
        //   • ride (sustained)        — 1s MA + asymmetric spring damping (like cassoneIntensity)
        //   • score (bar counter)     — +1/64 per onset while bpmStable (like ritualScore)
        // Downstream visuals consume the active flags + voicesActive count rather than
        // re-thresholding raw bands. Centralized thresholds, simmetria garantita.
        //
        // HAT voice (treble band, ~3.2-6.5 kHz)
        const trebleHistoryRide = new Float32Array(60); // ~1 s @ 60 fps
        let trebleHistoryRideIdx = 0;
        let trebleHistoryRideFilled = false;
        let hatRide = 0;             // 0..1, spring-damped
        let hatRideVel = 0;
        let hatScore = 0;            // 0..16, bar accumulator
        let lastHatFired = false;    // rising-edge gate
        let lastHatOnsetTime = 0;    // ms — for decay logic

        const midHistoryRide = new Float32Array(60);
        let midHistoryRideIdx = 0;
        let midHistoryRideFilled = false;
        let leadRide = 0;
        let leadRideVel = 0;
        let leadScore = 0;
        let lastLeadFired = false;
        let lastLeadOnsetTime = 0;
        // Voices summary (computed each frame after all three are updated)

        let hatActive = false;

        // (ovunque sia, segue pupilOffX/Y). Lazy-init alla prima frame di drawProceduralBg.
        // Density modulata dai listener: BASE soli quando azuracastOnline=false o 1 listener,
        // fino a MAX con community attiva (cap implicito ai ~17 listener).
        let starfield = null;
        const STARFIELD_BASE = 70;
        const STARFIELD_MAX = 160;

        // (periodico jittered) o su drop. ~160 ms totale: close fast, open back.
        const BLINK_DURATION = 160;  // ms
        let blinkActive = false;
        let blinkStart = 0;
        let nextBlinkAt = Date.now() + 12000 + Math.random() * 18000;  // first blink 12-30s
        // Last computed pupil radius (set inside drawPupil, read by drawProceduralBg
        // to mask the spiral / bg layers away from the pupil area).
        let lastPupilR = 30;

        // +1/64 per body-kick onset while bpmStable: 64 beats (16 bars) = +1.
        // Fast decay (×0.88/frame) if no kick onset for >800 ms — interruption resets fast.
        // Mapped to a 4-stage color progression in drawPupil:
        //   0..1   (0..16 bars)   nero → rosso
        //   1..4   (16..64 bars)  rosso → giallo
        //   4..8   (64..128 bars) giallo → bianco
        //   8+     (128+ bars)    bianco luminescente piena
        let ritualScore = 0;
        let lastBodyKickFired = false;
        let lastBodyKickOnsetTime = 0;

        // ===== 16-BAR CASSA STREAK — red iris flash trigger =====
        // Track consecutive bars where cassoneIntensity stayed above threshold
        // FOR THE WHOLE bar (sampling min per-bar). When the streak hits 16,
        // the next bar's downbeat fires a red iris flash + expanding trail.
        // Streak resets the moment one bar dips below threshold → richiede
        // 16 bar davvero ininterrotti, evento raro per definizione.
        let cassoneBarStreak = 0;
        let cassoneBarMin = 1;                 // min cassoneIntensity sampled in current bar
        let lastCassoneBarSeen = -1;           // bar index of previous frame, for transition edge
        let redIrisFlashT0 = 0;                // ms timestamp of last fire (0 = never)
        const RED_FLASH_DURATION = 900;        // ms — flash + scia fade
        const CASSONE_BAR_THRESHOLD = 0.25;    // matches sacred-geo gate

        // ===== BASS-CLUSTER FLASH (BC FLASH) =====
        // Composite-gated rare event: fires when bass-RMS transient exceeds an
        // ADAPTIVE threshold AND kickStack >= 2 AND cooldown >= 30 s elapsed.
        // Adaptive: threshold X = BASE + density15s * SLOPE. Dense passages raise
        // the bar (so the trigger stays scarce); sparse passages lower it (so a
        // drop after a long silence can still earn the flash). Cooldown is the
        // hard floor that makes this an EVENT, not a per-drop fixture.
        // Visual: 80 ms attack / 200 ms decay envelope on #bcFlash opacity.
        const BC_BASE_THRESHOLD   = 0.62;  // X floor (sparse passages)
        const BC_DENSITY_SLOPE    = 0.25;  // X ceiling rise (dense → +0.25)
        const BC_KICKSTACK_MIN    = 2;     // ≥2 bands firing in simultanea
        const BC_COOLDOWN_MS      = 30 * 1000;
        const BC_ATTACK_MS        = 80;
        const BC_DECAY_MS         = 200;
        // EMA-based density (15 s tau): α = dt/τ ≈ 1/(15*60) per frame @ 60fps.
        // Exponential, no buffer → O(1) memory.
        const BC_DENSITY_ALPHA    = 1 / (15 * 60);
        let bcBassDensity = 0;
        let bcLastFireAt = 0;
        let bcEnvelope = 0;                // 0..1 current overlay intensity
        let bcFireT0 = 0;                  // ms timestamp of current envelope
        let bcFlashEl = null;              // resolved lazily after DOM ready
        // Debug helper — flip to true via console (window.BC_DEBUG = true) to log fires
        window.BC_DEBUG = false;
        // Manual test helper — call window.bcFireNow() from console to force a fire
        // (ignores cooldown/gate, just kicks the envelope) — useful for visual tuning.
        window.bcFireNow = function () {
            bcLastFireAt = Date.now();
            bcFireT0 = Date.now();
            console.log('%c[BC FLASH] manual fire', 'background:#0ea5e9;color:#000;padding:2px 6px;');
        };

        // ===== BC FLASH RENDERER PROBE =====
        // Detect WebGPU availability up-front. Path 'css' is the always-on fallback
        // (already wired via #bcFlash + opacity envelope). 'webgpu' marks the device
        // capable of a future compute-pass upgrade; v1 ships CSS for both, but the
        // flag is logged so we can confirm coverage in the field before promoting.
        let bcRenderer = 'css';
        (async () => {

                console.log('[BC FLASH] renderer = css (WebGPU not present)');

            } catch (e) {
