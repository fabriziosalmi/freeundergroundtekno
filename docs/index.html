                    }
                });

                audioElement.addEventListener('pause', () => {
                    if (isPlaying && !bufferingActive) {
                        console.warn('⚠️ Unexpected pause');
                        streamHealthStatus.lastErrorTime = Date.now();
                    }
                });

                // Error handling - non-spammy logging
                let lastErrorLogTime = 0;
                audioElement.addEventListener('error', (e) => {
                    const now = Date.now();
                    let errorMsg = 'Unknown error';

                    if (e.target.error) {
                        if (e.target.error.code === e.target.error.MEDIA_ERR_NETWORK) {
                            errorMsg = 'Network unreachable';
                        } else if (e.target.error.code === e.target.error.MEDIA_ERR_DECODE) {
                            errorMsg = 'Decode error (invalid format)';
                        } else if (e.target.error.code === e.target.error.MEDIA_ERR_UNKNOWN) {
                            errorMsg = 'Unknown error';
                        }
                    }

                    // Only log if error message is different or 30+ seconds passed
                    if (streamHealthStatus.lastErrorMsg !== errorMsg || now - lastErrorLogTime > 30000) {
                        console.error(`❌ Stream error: ${errorMsg}`);
                        lastErrorLogTime = now;
                        streamHealthStatus.lastErrorMsg = errorMsg;
                        audioStatus.textContent = `ERROR: ${errorMsg}`;
                    }

                    streamHealthStatus.errorCount++;
                    streamHealthStatus.lastErrorTime = now;

                    // Trigger auto-recovery if not already retrying
                    if (isPlaying && streamHealthStatus.retryCount < streamHealthStatus.maxRetries) {
                        console.log(`🔄 Initiating recovery (attempt ${streamHealthStatus.retryCount + 1})`);
                        attemptAutoRecovery();
                    }
                });

                // Handle stream end (should not happen for infinite stream)
                audioElement.addEventListener('ended', () => {
                    console.error('❌ Stream ended unexpectedly (infinite stream should not end)');
                    isPlaying = false;
                    audioStatus.textContent = 'STREAM ENDED';
                    streamHealthStatus.lastErrorMsg = 'Stream ended';
                });

                // Start playback
                await audioElement.play();
                isPlaying = true;
                playStartTime = Date.now();
                audioStatus.textContent = 'STREAMING';
                streamHealthStatus.lastDataTime = Date.now();

                console.log('✅ Audio stream started!');

                // Start health monitoring
                startHealthMonitoring();

                animate();

            } catch (err) {
                console.error('❌ Audio startup failed:', err.message);
                isPlaying = false;
                audioStatus.textContent = 'STARTUP ERROR';
                stopHealthMonitoring();
            }
        }
        
        function stopAudio() {
            if (!isPlaying) return;

            try {
                // Stop health monitoring first
                stopHealthMonitoring();

                // Stop audio playback
                if (audioElement) {
                    audioElement.pause();
                    audioElement.currentTime = 0;
                    audioElement.src = ''; // Clear stream source
                }

                // Stop animation loop
                if (animationId) {
                    cancelAnimationFrame(animationId);
                }

                // Reset health status
                streamHealthStatus.retryCount = 0;
                streamHealthStatus.stalledCount = 0;
                streamHealthStatus.errorCount = 0;

                // Reset UI
                isPlaying = false;
                audioStatus.textContent = 'STOPPED';
                signalStatus.textContent = 'Ready';
                console.log('⏹️ Audio stream stopped');
            } catch (err) {
                console.error('Error stopping audio:', err.message);
            }
        }
        
        let dataArray = null;
        let bgFrameCount = 0;
        let zoomIntensity = 1;

        // Inizializza target point per il movimento della camera
        window.targetPoint = { x: 0, y: 0 };
        window.lastTargetChange = Date.now();
        window.currentEasing = 'easeInOut';

        function animate() {
            if (!isPlaying) return;

            // Frame rate throttling for performance — dynamic downshift in deep silence.
            const now = performance.now();
            const deltaTime = now - lastFrameTime;
            const targetFrameTime = calmness > 0.85 ? 1000 / 10 : baseFrameTime;
            if (deltaTime < targetFrameTime) {
                skippedFrames++;
                animationId = requestAnimationFrame(animate);
                return;
            }
            lastFrameTime = now;

            analyser.getByteFrequencyData(dataArray);

            // Update singularity state machine (Step 2) — reads Date.now(), drives renderers
            updateSingularity();
            updateFreeze();

            // 16-bar cassa streak → red iris flash al downbeat successivo.
            // Sampling min-per-bar di cassoneIntensity: se cala sotto soglia
            // durante un bar, lo streak si azzera. 16 bar consecutivi puliti
            // → fire al prossimo bar boundary (= prima del gruppo successivo).
            if (bpmStable && beatCount > 0) {
                const _cbBar = Math.floor((beatCount - 1) / 4);
                if (_cbBar !== lastCassoneBarSeen) {
                    if (lastCassoneBarSeen >= 0) {
                        if (cassoneBarMin >= CASSONE_BAR_THRESHOLD) {
                            cassoneBarStreak++;
                            if (cassoneBarStreak >= 16) {
                                redIrisFlashT0 = Date.now();
                                cassoneBarStreak = 0;
                                console.log('%c[iris] red flash — 16 bar cassa streak', 'color:#f33');
                            }
                        } else {
                            cassoneBarStreak = 0;
                        }
                    }
                    lastCassoneBarSeen = _cbBar;
                    cassoneBarMin = cassoneIntensity;
                } else if (cassoneIntensity < cassoneBarMin) {
                    cassoneBarMin = cassoneIntensity;
                }
            } else {
                cassoneBarStreak = 0;
                cassoneBarMin = 1;
                lastCassoneBarSeen = -1;
            }

            // L3 listener pulses — spawn rising-edge ogni 16 beat (= 4 bar) quando
            // bpmStable, ci sono listener > 1, radio online e non siamo in silenzio.
            // 1 ring per listener oltre il primo (capped a LISTENER_PULSE_CAP).
            if (bpmStable && beatCount > 0 && azuracastOnline && !silenceMode) {
                // Usa beatCount monotonic, non beatHistory.length (capped a 10).
                const _grp = Math.floor((beatCount - 1) / 16);
                if (_grp !== lastListenerPulseGroup) {
                    lastListenerPulseGroup = _grp;
                    const _extra = Math.max(0, Math.min(LISTENER_PULSE_CAP, liveListeners - 1));
                    if (_extra > 0) {
                        const _now = Date.now();
                        for (let i = 0; i < _extra; i++) {
                            listenerPulses.push({ t0: _now + i * 70, dur: LISTENER_PULSE_DUR_MS });
                        }
                        console.log('%c[listeners] pulse ×' + _extra, 'color:#888', '(4-bar group ' + _grp + ')');
                    }
                }
            }

            // === KICK DECOMPOSITION ===
            // Tekno stacks kicks: sub (30-65 Hz) + body (85-170 Hz) + punch (300-650 Hz).
            // Compute each independently so the visuals can react to the *layering*,
            // not just to a single lumped "bass" number. bassLevel kept as composite
            // for downstream code that doesn't care about the split.
            let subSum = 0;
            for (let i = 1; i < 4; i++) subSum += dataArray[i];
            subKick = subSum / (3 * 255);

            let bodySum = 0;
            for (let i = 4; i < 8; i++) bodySum += dataArray[i];
            bodyKick = bodySum / (4 * 255);

            let punchSum = 0;
            for (let i = 14; i < 30; i++) punchSum += dataArray[i];
            punchKick = punchSum / (16 * 255);

            kickStack = (subKick > 0.5 ? 1 : 0)
                      + (bodyKick > 0.5 ? 1 : 0)
                      + (punchKick > 0.45 ? 1 : 0);

            // bassCharge: 0..1, recharges fast on any kick firing, decays slowly
            // when none of the bands fire. A 4/4 dritta keeps charge ≈ 1 because
            // each kick refreshes faster than the decay between beats. A breakdown
            // (no kicks) lets it sag continuously — pupil shrinks "sempre di più".
            const _kickFiring = kickStack >= 1;
            if (_kickFiring) {
                bassCharge = Math.min(1, bassCharge + 0.35);
            } else {
                // Bi-modal decay: lento sopra 0.30 (sustain del groove), accelerato sotto
                // (3.3× più veloce) → breakdown profondo si svuota invece di plateau-are.
                bassCharge *= bassCharge < 0.30 ? 0.99 : 0.997;
            }
            if (!isFinite(bassCharge)) bassCharge = 0;

            // Bass-drop snap detector — arma su kick, fira al primo gap > soglia
            // mentre bassCharge è ancora alta. Soglia gap scala col BPM (1.5× beat
            // interval se stabile) → niente false-positive su tracce lente.
            {
                const _bdNow = Date.now();
                if (_kickFiring) {
                    lastKickFiringAt = _bdNow;
                    bdSnapArmed = true;
                }
                const _kickGap = _bdNow - lastKickFiringAt;
                const _gapThreshold = bpmStable && bpmAvgInterval > 0
                    ? bpmAvgInterval * 1.5
                    : 800;
                if (bdSnapArmed && _kickGap >= _gapThreshold && bassCharge > 0.5
                    && _bdNow - bdSnapFireAt > BD_SNAP_COOLDOWN) {
                    bdSnapFireAt = _bdNow;
                    bdSnapArmed = false;
                }
                const _bdAge = _bdNow - bdSnapFireAt;
                bdSnapAmount = _bdAge < BD_SNAP_DURATION
                    ? (1 - _bdAge / BD_SNAP_DURATION) * (1 - _bdAge / BD_SNAP_DURATION)
                    : 0;
            }

            // ritualScore: rising-edge of bodyKick is one beat. While BPM is stable,
            // each beat adds +1/64 → 64 beats (= 16 bars) per score point.
            // No body-kick onset for >800 ms → fast decay (interruption resets).
            const _bodyFiring = bodyKick > 0.5;
            const _now2 = Date.now();
            if (_bodyFiring && !lastBodyKickFired) {
                lastBodyKickOnsetTime = _now2;
                if (bpmStable) ritualScore = Math.min(16, ritualScore + 1 / 64);
            }
            lastBodyKickFired = _bodyFiring;
            if (_now2 - lastBodyKickOnsetTime > 800) {
                ritualScore *= 0.88;
            }
            if (!isFinite(ritualScore)) ritualScore = 0;

            // Composite bassLevel — weighted toward sub+body since those carry the kick body
            const bassLevel = subKick * 0.40 + bodyKick * 0.45 + punchKick * 0.30;

            // ===== BC FLASH — composite gate + adaptive threshold + envelope =====
            // 1) Update 15s EMA of bassLevel → density estimate.
            // 2) Compute adaptive threshold X = BASE + density * SLOPE.
            // 3) If bassLevel > X AND kickStack ≥ N AND cooldown elapsed → fire.
            // 4) Drive 80/200 ms attack-decay envelope on #bcFlash opacity.
            // Skipped entirely in silenceMode (no audio → no events).
            {
                bcBassDensity = bcBassDensity * (1 - BC_DENSITY_ALPHA)
                              + bassLevel * BC_DENSITY_ALPHA;
                if (!isFinite(bcBassDensity)) bcBassDensity = 0;

                const _bcNow = Date.now();
                const _bcThreshold = BC_BASE_THRESHOLD + bcBassDensity * BC_DENSITY_SLOPE;
                const _bcGateOpen = !silenceMode
                                 && bassLevel > _bcThreshold
                                 && kickStack >= BC_KICKSTACK_MIN
                                 && (_bcNow - bcLastFireAt) >= BC_COOLDOWN_MS;

                if (_bcGateOpen) {
                    bcLastFireAt = _bcNow;
                    bcFireT0 = _bcNow;
                    if (window.BC_DEBUG) {
                        console.log(
                            '%c[BC FLASH]', 'background:#0ea5e9;color:#000;font-weight:bold;padding:2px 6px;',
                            'bass=' + bassLevel.toFixed(2),
                            'X=' + _bcThreshold.toFixed(2),
                            'density=' + bcBassDensity.toFixed(2),
                            'kickStack=' + kickStack
                        );
                    }
                }

                // Envelope: 80ms linear attack, 200ms ease-out decay (1-t)^2.
                if (bcFireT0 > 0) {
                    const _age = _bcNow - bcFireT0;
                    if (_age < BC_ATTACK_MS) {
                        bcEnvelope = _age / BC_ATTACK_MS;
                    } else if (_age < BC_ATTACK_MS + BC_DECAY_MS) {
                        const _t = (_age - BC_ATTACK_MS) / BC_DECAY_MS;
                        const _inv = 1 - _t;
                        bcEnvelope = _inv * _inv;
                    } else {
                        bcEnvelope = 0;
                        bcFireT0 = 0;
                    }
                } else {
                    bcEnvelope = 0;
                }

                // Apply to DOM (lazy resolve, cap visible opacity at 0.85 to
                // never fully whiteout the scene).
                if (!bcFlashEl) bcFlashEl = document.getElementById('bcFlash');
                if (bcFlashEl) {
                    bcFlashEl.style.opacity = (bcEnvelope * 0.85).toFixed(3);
                }
            }

            let midSum = 0;
            for (let i = 40; i < 120; i++) midSum += dataArray[i];
            const midLevel = midSum / (80 * 255);

            let treSum = 0;
            for (let i = 150; i < 300; i++) treSum += dataArray[i];
            const trebleLevel = treSum / (150 * 255);

            // Calmness eases toward 1 in silence, toward 0 when sound returns.
            // Spring-damped so the fade is curved, never linear.
            const calmTarget = silenceMode ? 1 : 0;
            const calmForce = (calmTarget - calmness) * 0.03;
            calmnessVelocity = calmnessVelocity * 0.80 + calmForce;
            calmness += calmnessVelocity;
            if (calmness < 0) { calmness = 0; calmnessVelocity = 0; }
            if (calmness > 1) { calmness = 1; calmnessVelocity = 0; }
            const activity = 1 - calmness; // convenience inverse

            // Cassone detector: 1 s rolling bass moving average. When tempo is stable
            // AND bassMA is high, target → 1 → pupil inflates with a slight overshoot
            // ("flex"), then releases slowly. Asymmetric spring: rise fast, fall slow.
            bassHistory[bassHistoryIdx] = bassLevel;
            bassHistoryIdx = (bassHistoryIdx + 1) % bassHistory.length;
            if (bassHistoryIdx === 0) bassHistoryFilled = true;
            let bassMA = 0;
            const _bn = bassHistoryFilled ? bassHistory.length : bassHistoryIdx;
            if (_bn > 0) {
                for (let i = 0; i < _bn; i++) bassMA += bassHistory[i];
                bassMA /= _bn;
            }
            // Cassone target boosted by kickStack: 3-stack kicker hits 1.3× harder
            // than a single-layer kick at the same average level.
            const cassoneTarget = (bpmStable && bassMA > 0.42)
                ? Math.min(1.15, ((bassMA - 0.42) / 0.30) * (1 + kickStack * 0.15))
                : 0;
            const _cassF = cassoneTarget - cassoneIntensity;
            // Asymmetric spring: salita veloce, fall più rapido di prima (era 0.025/0.92)
            // così cassoneIntensity non parcheggia alto quando la cassa stacca → contribuisce
            // a "senza cassa pupilla piccola".
            const _cassStiff = _cassF > 0 ? 0.07 : 0.045;
            const _cassDamp  = _cassF > 0 ? 0.70 : 0.86;
            cassoneVel = cassoneVel * _cassDamp + _cassF * _cassStiff;
            cassoneIntensity = Math.max(0, Math.min(1.15, cassoneIntensity + cassoneVel));

            // ===== HAT VOICE — sustained hi-hat ride (treble band MA + spring) =====
            // Stessa anatomia di cassoneIntensity: 1s MA + asymmetric spring. Soglia
            // più bassa (0.18) perché trebleLevel ha meno energia di bassLevel a parità
            // di "presenza percepita". Onset = rising-edge su trebleLevel > 0.28.
            trebleHistoryRide[trebleHistoryRideIdx] = trebleLevel;
            trebleHistoryRideIdx = (trebleHistoryRideIdx + 1) % trebleHistoryRide.length;
            if (trebleHistoryRideIdx === 0) trebleHistoryRideFilled = true;
            let trebleMA = 0;
            const _tn = trebleHistoryRideFilled ? trebleHistoryRide.length : trebleHistoryRideIdx;
            if (_tn > 0) {
                for (let i = 0; i < _tn; i++) trebleMA += trebleHistoryRide[i];
                trebleMA /= _tn;
            }
            const hatTarget = trebleMA > 0.18
                ? Math.min(1, (trebleMA - 0.18) / 0.25)
                : 0;
            const _hatF = hatTarget - hatRide;
            const _hatStiff = _hatF > 0 ? 0.08 : 0.05;
            const _hatDamp  = _hatF > 0 ? 0.70 : 0.86;
            hatRideVel = hatRideVel * _hatDamp + _hatF * _hatStiff;
            hatRide = Math.max(0, Math.min(1, hatRide + hatRideVel));
            // Hat onset: rising-edge su trebleLevel > 0.28 (più strict di hatRide).
            // hatScore: +1/64 mentre bpmStable, decay rapido se nessun onset per >800 ms.
            const _hatFiring = trebleLevel > 0.28;
            if (_hatFiring && !lastHatFired) {
                lastHatOnsetTime = _now2;
                if (bpmStable) hatScore = Math.min(16, hatScore + 1 / 64);
            }
            lastHatFired = _hatFiring;
            if (_now2 - lastHatOnsetTime > 800) hatScore *= 0.88;
            if (!isFinite(hatScore)) hatScore = 0;

            // ===== LEAD VOICE — sustained mid-band ride (synth/melodic content) =====
            // Stessa anatomia. Soglia 0.22 (mid medio-alto, esclude pad leggeri ma
            // include lead/synth attivi). Onset = rising-edge midLevel > 0.32.
            midHistoryRide[midHistoryRideIdx] = midLevel;
            midHistoryRideIdx = (midHistoryRideIdx + 1) % midHistoryRide.length;
            if (midHistoryRideIdx === 0) midHistoryRideFilled = true;
            let midMA = 0;
            const _mn = midHistoryRideFilled ? midHistoryRide.length : midHistoryRideIdx;
            if (_mn > 0) {
                for (let i = 0; i < _mn; i++) midMA += midHistoryRide[i];
                midMA /= _mn;
            }
            const leadTarget = midMA > 0.22
                ? Math.min(1, (midMA - 0.22) / 0.25)
                : 0;
            const _leadF = leadTarget - leadRide;
            const _leadStiff = _leadF > 0 ? 0.08 : 0.05;
            const _leadDamp  = _leadF > 0 ? 0.70 : 0.86;
            leadRideVel = leadRideVel * _leadDamp + _leadF * _leadStiff;
            leadRide = Math.max(0, Math.min(1, leadRide + leadRideVel));
            const _leadFiring = midLevel > 0.32;
            if (_leadFiring && !lastLeadFired) {
                lastLeadOnsetTime = _now2;
                if (bpmStable) leadScore = Math.min(16, leadScore + 1 / 64);
            }
            lastLeadFired = _leadFiring;
            if (_now2 - lastLeadOnsetTime > 800) leadScore *= 0.88;
            if (!isFinite(leadScore)) leadScore = 0;

            // ===== VOICES SUMMARY — unified rhythm vocabulary for downstream visuals =====
            // kickActive: cassoneIntensity sostenuta OR kick istantaneo (≥1 banda firing).
            // Coverte sia "cassa che dura" sia "primo kick di un drop" appena partito.
            kickActive = cassoneIntensity > 0.15 || kickStack >= 1;
            hatActive  = hatRide > 0.15;
            leadActive = leadRide > 0.15;
            voicesActive = (kickActive ? 1 : 0) + (hatActive ? 1 : 0) + (leadActive ? 1 : 0);

            // ===== VIBE METER UPDATE (Singularity trigger logic) =====
            // Hybrid model: musical accumulator + cooldown + random gate.
            // Step 1 = decisions only (console.log). Step 2 will wire the visual.
            {
                const _nowVibe = Date.now();

                // 1) Sustained cassone fills slowly — la cassa che insiste carica piano
                vibeCharge += cassoneIntensity * 0.0005;

                // 2) RitualScore stage transition — boost grosso quando si sale di livello
                //    Stages (vedi commento di ritualScore): 0(0-1) / 1(1-4) / 2(4-8) / 3(8+)
                const _curStage = ritualScore < 1 ? 0 : ritualScore < 4 ? 1 : ritualScore < 8 ? 2 : 3;
                if (_curStage > prevRitualStage) {
                    vibeCharge += 0.15;
                    console.log('[vibe] +0.15 ritualStage ' + prevRitualStage + '→' + _curStage + ', charge=' + vibeCharge.toFixed(3));
                }
                prevRitualStage = _curStage;

                // 3) Drop detection — bassCharge crashato da >0.8 a <0.3 entro 2s
                if (bassCharge > bassChargePeak) {
                    bassChargePeak = bassCharge;
                    bassChargePeakAt = _nowVibe;
                }

                // 3a) WALL SUSTAINED tracker per il Freeze layer: il muro è considerato
                //     "attivo" se kickStack≥2 + bassLevel forte. Lo timestamp ad ogni
                //     frame attivo → il freeze richiede che il muro fosse vivo entro 1.5s.
                if (kickStack >= 2 && bassLevel > 0.55 && cassoneIntensity > 0.35) {
                    wallSustainedAt = _nowVibe;
                }
                const _wallRecent = (_nowVibe - wallSustainedAt) < 1500;

                // 3b) EXTREME STACCO → Freeze (foto-finish). Soglie più draconiche del
                //     drop standard: peak > 0.85, crash < 0.20, AND wall recente. Cooldown
                //     5 min (1 min in DEBUG) indipendente dal vibe meter.
                if (_wallRecent && bassChargePeak > 0.85 && bassCharge < 0.20
                    && _nowVibe - bassChargePeakAt < 1500
                    && _nowVibe - lastStaccoFireAt > FREEZE_COOLDOWN_MS
                    && freezeState === 'idle') {
                    lastStaccoFireAt = _nowVibe;
                    fireFreeze();
                }

                // 3c) Drop standard → vibe meter charge (immutato)
                if (bassChargePeak > 0.8 && bassCharge < 0.3 && _nowVibe - bassChargePeakAt < 2000) {
                    vibeCharge += 0.20;
                    console.log('[vibe] +0.20 drop ' + bassChargePeak.toFixed(2) + '→' + bassCharge.toFixed(2) + ', charge=' + vibeCharge.toFixed(3));
                    bassChargePeak = 0;  // richiede una nuova risalita per riarmarsi
                }
                // Peak decay se non è successo niente da 3s
                if (_nowVibe - bassChargePeakAt > 3000) bassChargePeak *= 0.95;

                // 4) Silenzio scarica
                vibeCharge -= calmness * 0.0008;
                vibeCharge = Math.max(0, Math.min(1, vibeCharge));

                // === FIRE GATE ===
                const _timeSinceLast = _nowVibe - lastSingularityFireAt;
                let _effThreshold = VIBE_BASE_THRESHOLD + satiationOffset;
                // Starvation: se troppo tempo, soglia scende lentamente (0.85+sat → 0.65+sat) nei 10 min dopo cooldown max
                if (_timeSinceLast > VIBE_COOLDOWN_MAX_MS) {
                    const _starve = Math.min(1, (_timeSinceLast - VIBE_COOLDOWN_MAX_MS) / (10 * 60 * 1000));
                    _effThreshold -= 0.20 * _starve;
                }
                const _cooldownPassed = _timeSinceLast > VIBE_COOLDOWN_MIN_MS;
                const _warmupPassed = _nowVibe - sessionStartAt > VIBE_WARMUP_MS;

                if (vibeCharge >= _effThreshold) {
                    if (!vibeArmed && _cooldownPassed && _warmupPassed) {
                        // Rising-edge: roll the random gate UNA volta
                        vibeArmed = true;
                        if (Math.random() < 0.45) {
                            console.log('%c[SINGULARITY FIRE]', 'background:#fff;color:#000;font-weight:bold;padding:2px 6px;',
                                'charge=' + vibeCharge.toFixed(3),
                                'thresh=' + _effThreshold.toFixed(3),
                                'sinceLast=' + (_timeSinceLast / 60000).toFixed(1) + 'min',
                                'satiation=+' + satiationOffset.toFixed(2));
                            lastSingularityFireAt = _nowVibe;
                            vibeCharge = 0;
                            vibeArmed = false;
                            satiationOffset = Math.min(0.10, satiationOffset + 0.05);
                            // Step 2: fire the visual. Only variation A for now.
                            fireSingularity('A');
                        } else {
                            console.log('[vibe] gate missed (random) — charge=' + vibeCharge.toFixed(3) + ', will re-arm after dip');
                        }
                    } else if (!_cooldownPassed) {
                        // Already above threshold but cooldown active — log once per arming
                        if (!vibeArmed) {
                            vibeArmed = true;
                            console.log('[vibe] threshold hit but cooldown active (' + ((VIBE_COOLDOWN_MIN_MS - _timeSinceLast) / 60000).toFixed(1) + 'min remaining)');
                        }
                    } else if (!_warmupPassed) {
                        if (!vibeArmed) {
                            vibeArmed = true;
                            console.log('[vibe] threshold hit but warmup active');
                        }
                    }
                } else if (vibeCharge < _effThreshold - 0.10) {
                    // Dipped well below — re-arm for next opportunity
                    vibeArmed = false;
                }

                // Long deep silence resets satiation (sessione "fresh" dopo riposo)
                if (calmness > 0.85 && _timeSinceLast > VIBE_SATIATION_RESET_MS) {
                    if (satiationOffset > 0) {
                        console.log('[vibe] satiation reset (long silence)');
                        satiationOffset = 0;
                    }
                }
            }

            // Overall energy
            const energy = (bassLevel + midLevel + trebleLevel) / 3;

            // 💫 DREAM SOUNDSYSTEM FLASH TRIGGERS - memoria fugace del suono
            // Dream conditions: specific frequency combinations during energetic moments
            dreamIntensity = (bassLevel * 0.4) + (midLevel * 0.6); // More mid-sensitive

            // Trigger 1: Strong mid-level with bass presence (party vibe)
            const dreamTrigger1 = bassLevel > (isMobile ? 0.4 : 0.6) &&
                                  midLevel > (isMobile ? 0.5 : 0.7) &&
                                  Math.random() > 0.92;  // Rare trigger (8% chance per frame)

            // Trigger 2: Peak energy moment with treble spike (climax effect)
            const dreamTrigger2 = energy > 0.7 &&
                                  trebleLevel > (isMobile ? 0.4 : 0.6) &&
                                  bassLevel > (isMobile ? 0.3 : 0.5) &&
                                  Math.random() > 0.88;  // Slightly less rare (12% chance)

            // Trigger 3: Sustained high mid-level (continuous presence)
            const dreamTrigger3 = midLevel > (isMobile ? 0.6 : 0.8) &&
                                  Date.now() - lastDreamFlash > 3000 &&  // Max once every 3s
                                  Math.random() > 0.94;  // Very rare (6% chance)

            if (dreamTrigger1) {
                triggerDreamFlash('party');
            } else if (dreamTrigger2) {
                triggerDreamFlash('peak');
            } else if (dreamTrigger3) {
                triggerDreamFlash('sustained');
            }

            // State machine timer
            stateTimer += deltaTime;
            if (stateTimer > nextStateChange) {
                changeState();
            }

            // 🎯 CALCOLO ZOOM E ROTAZIONE - AUMENTATO PER EFFETTO SOTTOCASSA!
            // Baseline 1.07 = pseudo-3D zoom (riempie angoli dalla perspective tilt)
            zoomIntensity = 1.07 + bassLevel * 0.6;
            const rotateAmount = energy * 5;
            
            // 🎭 TARGET POINT - punto casuale verso cui "guardare" (cambia ogni 3-8 secondi)
            if (!window.targetPoint || Date.now() - window.lastTargetChange > (3000 + Math.random() * 5000)) {
                window.targetPoint = {
                    x: (Math.random() - 0.5) * 100, // -50 a +50px
                    y: (Math.random() - 0.5) * 80   // -40 a +40px
                };
                window.lastTargetChange = Date.now();
                
                // Scegli easing casuale per il prossimo ciclo
                const easingTypes = ['easeInOut', 'easeOut', 'easeIn', 'bounce'];
                window.currentEasing = easingTypes[Math.floor(Math.random() * easingTypes.length)];
            }
            
            // 🎨 FUNZIONI DI EASING per movimento fluido e ritmato
            const easing = {
                easeInOut: (t) => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t,
                easeOut: (t) => t * (2 - t), // decelerazione
                easeIn: (t) => t * t, // accelerazione
                bounce: (t) => {
                    if (t < 0.5) return 8 * t * t * t * t;
                    return 1 - 8 * (--t) * t * t * t;
                }
            };
            
            // Applica easing corrente
            const currentEasingFunc = easing[window.currentEasing || 'easeInOut'];
            
            // Beat detection - SOGLIA RIDOTTA per mobile
            const beatThreshold = isMobile ? 0.3 : 0.7;
            if (bassLevel > beatThreshold && Date.now() - lastBeatTime > 200) {
                beatHistory.push(Date.now());
                if (beatHistory.length > 10) beatHistory.shift();
                beatCount++;                  // monotonic — usalo per qualunque counter discreto di beat

                if (beatHistory.length >= 2) {
                    const intervals = [];
                    for (let i = 1; i < beatHistory.length; i++) {
                        intervals.push(beatHistory[i] - beatHistory[i-1]);
                    }
                    const avgInterval = intervals.reduce((a, b) => a + b) / intervals.length;
                    bpm = Math.round(60000 / avgInterval);
                }

                lastBeatTime = Date.now();

                // Per-beat effect budget: cap how many effects fire on the same
                // beat to keep the scene legible. Tuned for the rave vibe; bump
                // these numbers if it feels too quiet on drops.
                let _flashBudget   = 1;                  // fullscreen blasts
                let _accentBudget  = isMobile ? 4 : 3;   // local visual accents
                let _distortBudget = isMobile ? 3 : 2;   // geometry / post-fx glitches
                // Draconian gate: nessun trigger senza ritmica vera. Triplo OR così il
                // PRIMO kick dopo silenzio scatta subito (smoothing FFT non ritarda più):
                //   bassLevel > 0.42 = composite a regime sul rising edge del kick
                //   kickStack ≥ 1     = almeno una banda kick sopra threshold strict
                //   cassoneIntensity  = 4/4 sostenuto (rimanenza tra kicks)
                const _hasRhythm = bassLevel > 0.42 || kickStack >= 1 || cassoneIntensity > 0.4;
                const _claimFlash   = () => _hasRhythm && _flashBudget--   > 0;
                const _claimAccent  = () => _hasRhythm && _accentBudget--  > 0;
                const _claimDistort = () => _hasRhythm && _distortBudget-- > 0;

                // Crowd strobe on beat - AUMENTATO
                crowdStrobe.style.opacity = isMobile ? '0.95' : '1';
                setTimeout(() => {
                    crowdStrobe.style.opacity = '0';
                }, 120);

                // 💫 SUPER SPATIAL GLOW STROBO - attiva su cassa dritta (SOGLIA RIDOTTA)
                const spatialStroboThreshold = isMobile ? 0.35 : 0.8;
                if (bassLevel > spatialStroboThreshold && Math.random() > 0.2 && _claimFlash()) { // AUMENTATA la frequenza (0.5 -> 0.2)
                    // Cambia pattern e colore casualmente
                    if (Math.random() > 0.5) { // AUMENTATA la frequenza (0.7 -> 0.5)
                        currentStroboPattern = stroboPatterns[Math.floor(Math.random() * stroboPatterns.length)];
                        currentStroboColor = stroboColors[Math.floor(Math.random() * stroboColors.length)];
                        spatialStrobo.className = currentStroboPattern;
                        spatialStrobo.style.setProperty('--glow-color', currentStroboColor);
                    }

                    // Flash strobo spaziale - AUMENTATO OPACITÀ
                    spatialStrobo.style.opacity = isMobile ? '1' : '0.9';
                    setTimeout(() => {
                        spatialStrobo.style.opacity = '0';
                    }, 50 + Math.random() * 80); // durata aumentata 50-130ms
                }

                // 🌀 SPIRAL ZOOM VORTEXES - attiva spirali localizzate randomicamente
                const spiralBassThreshold = isMobile ? 0.35 : 0.8;
                // Su bassi forti: spirale explosion (zoom out)
                if (bassLevel > spiralBassThreshold && Math.random() > 0.2 && _claimAccent()) { // AUMENTATA frequenza (0.65 -> 0.2)
                    const vortex = spiralVortexes[Math.floor(Math.random() * spiralVortexes.length)];
                    const color = spiralColors[Math.floor(Math.random() * spiralColors.length)];
                    const size = 100 + Math.random() * 150; // 100-250px
                    
                    vortex.style.width = size + 'px';
                    vortex.style.height = size + 'px';
                    vortex.style.background = `radial-gradient(circle, ${color} 0%, transparent 70%)`;
                    vortex.classList.remove('implode', 'pulse');
                    vortex.classList.add('active');
                    
                    setTimeout(() => {
                        vortex.classList.remove('active');
                    }, 800);
                }
                
                // Su medi: spirale implode (zoom in) - SOGLIA RIDOTTA
                const midThreshold = isMobile ? 0.35 : 0.75;
                if (midLevel > midThreshold && Math.random() > 0.3 && _claimAccent()) { // AUMENTATA frequenza (0.7 -> 0.3)
                    const vortex = spiralVortexes[Math.floor(Math.random() * spiralVortexes.length)];
                    const color = spiralColors[Math.floor(Math.random() * spiralColors.length)];
                    const size = 120 + Math.random() * 100; // 120-220px

                    vortex.style.width = size + 'px';
                    vortex.style.height = size + 'px';
                    vortex.style.background = `conic-gradient(from 0deg, ${color} 0deg, transparent 120deg, ${color} 240deg, transparent 360deg)`;
                    vortex.classList.remove('active', 'pulse');
                    vortex.classList.add('implode');

                    setTimeout(() => {
                        vortex.classList.remove('implode');
                    }, 600);
                }

                // Su alti: spirale pulse (pulsante) - SOGLIA RIDOTTA
                const trebleThreshold = isMobile ? 0.3 : 0.7;
                if (trebleLevel > trebleThreshold && Math.random() > 0.35 && _claimAccent()) { // AUMENTATA frequenza (0.75 -> 0.35)
                    const vortex = spiralVortexes[Math.floor(Math.random() * spiralVortexes.length)];
                    const color = spiralColors[Math.floor(Math.random() * spiralColors.length)];
                    const size = 80 + Math.random() * 80; // 80-160px

                    vortex.style.width = size + 'px';
                    vortex.style.height = size + 'px';
                    vortex.style.background = `radial-gradient(circle, transparent 20%, ${color} 40%, transparent 60%)`;
                    vortex.classList.remove('active', 'implode');
                    vortex.classList.add('pulse');

                    setTimeout(() => {
                        vortex.classList.remove('pulse');
                    }, 500);
                }

                // 🎯 ZOOM BURST SOTTOCASSA - zoom PIÙ FREQUENTE e PIÙ POTENTE!
                const zoomThreshold = isMobile ? 0.35 : 0.8;
                if (bassLevel > zoomThreshold && Date.now() - lastZoomBurst > (isMobile ? 400 : 600) && Math.random() > (isMobile ? 0.2 : 0.4) && _claimDistort()) {
                    document.body.classList.add('zoom-burst');
                    lastZoomBurst = Date.now();
                    setTimeout(() => {
                        document.body.classList.remove('zoom-burst');
                    }, 300);
                }

                // 💥 SHAKE BURST - scossa rapida su peak
                const shakeThreshold = isMobile ? 0.4 : 0.9;
                if (bassLevel > shakeThreshold && Date.now() - lastShakeBurst > (isMobile ? 800 : 1500) && Math.random() > (isMobile ? 0.3 : 0.7) && _claimDistort()) {
                    document.body.classList.add('shake-burst');
                    lastShakeBurst = Date.now();
                    setTimeout(() => {
                        document.body.classList.remove('shake-burst');
                    }, 200);
                }

                // Random strobe on peak beats - SOGLIA RIDOTTA
                const strobeThreshold = isMobile ? 0.35 : 0.85;
                if (bassLevel > strobeThreshold && Math.random() > (isMobile ? 0.3 : 0.7) && _claimFlash()) {
                    strobeFlash.style.opacity = isMobile ? '1' : '0.8';
                    setTimeout(() => {
                        strobeFlash.style.opacity = '0';
                    }, 40);
                }

                // Random VHS glitch on strong beats - SOGLIA RIDOTTA
                const vhsThreshold = isMobile ? 0.35 : 0.8;
                if (bassLevel > vhsThreshold && Math.random() > (isMobile ? 0.5 : 0.85) && _claimDistort() && singularityProgress < 0.01) {
                    vhsLines.style.opacity = isMobile ? '1' : '0.8';
                    background.style.transform = `scale(${zoomIntensity}) rotate(${rotateAmount}deg) translateX(${Math.random() * 10 - 5}px)`;
                    setTimeout(() => {
                        vhsLines.style.opacity = (psychState === 'vhs' ? '0.6' : '0');
                    }, 80);
                }
                
                // Random grain spike - SOGLIA RIDOTTA
                const grainThreshold = isMobile ? 0.3 : 0.7;
                if (energy > grainThreshold && Math.random() > (isMobile ? 0.5 : 0.9) && _claimDistort()) {
                    grainOverlay.style.opacity = isMobile ? '0.8' : '0.5';
                    setTimeout(() => {
                        grainOverlay.style.opacity = (psychState === 'vhs' ? '0.4' : '0.15');
                    }, 100);
                }

                // ⚫⚪ NEGATIVE LAYER - raggi rotativi POTENZIATI!
                // Rays single/multi: SOLO su drum hits veri (body + punch), non su synth bass.
                // bodyKick = thump (mid-bass kick), punchKick = click/skin transient (mid).
                // Sub-bass synth da solo NON triggera più — i raggi sono "linguaggio percussivo".
                const _drumHit = bodyKick > 0.45 || punchKick > 0.35;
                if (_drumHit && Math.random() > (isMobile ? 0.05 : 0.3) && _claimDistort()) {
                    const rayPattern = Math.random() < 0.5 ? rotatingRays[0] : rotatingRays[1];
                    negativeLayer.style.opacity = isMobile ? '1' : '0.95';
                    rayPattern.style.opacity = '1';
                    rayPattern.classList.add('active');

                    setTimeout(() => {
                        negativeLayer.style.opacity = '0';
                        rayPattern.style.opacity = '0';
                        rayPattern.classList.remove('active');
                    }, 180 + Math.random() * 120); // 180-300ms
                }

                // Su alti: attiva spirale o croce - SOGLIA RIDOTTA
                const negRayTrebleThreshold = isMobile ? 0.25 : 0.65;
                if (trebleLevel > negRayTrebleThreshold && Math.random() > (isMobile ? 0.1 : 0.4) && _claimDistort()) {
                    // Only spiral-beam remains for treble (cross-beam removed — "croci da levare")
                    const rayPattern = rotatingRays[2];
                    negativeLayer.style.opacity = isMobile ? '1' : '0.98';
                    rayPattern.style.opacity = '1';
                    rayPattern.classList.add('active');

                    setTimeout(() => {
                        negativeLayer.style.opacity = '0';
                        rayPattern.style.opacity = '0';
                        rayPattern.classList.remove('active');
                    }, 150 + Math.random() * 100); // 150-250ms
                }

                // 🌊 FRACTAL TEARS - distorsioni frattali organiche - SOGLIA RIDOTTA
                // TEMP: disabled — questi sono "l'invasore" (forme bianche octagon/ellipse/star che si gonfiano).
                const FRACTAL_TEAR_ENABLED = false;
                const fractalThreshold = isMobile ? 0.35 : 0.78;
                if (FRACTAL_TEAR_ENABLED && bassLevel > fractalThreshold && Math.random() > (isMobile ? 0.2 : 0.5) && _claimAccent()) {
                    const tear = fractalTears[Math.floor(Math.random() * fractalTears.length)];
                    const shape = fractalShapes[Math.floor(Math.random() * fractalShapes.length)];
                    const size = 80 + Math.random() * 180; // 80-260px

                    // Posizione random
                    tear.style.top = (20 + Math.random() * 60) + '%';
                    tear.style.left = (10 + Math.random() * 80) + '%';
                    tear.style.width = size + 'px';
                    tear.style.height = size + 'px';
                    tear.style.clipPath = shape;
                    tear.classList.add('active');

                    setTimeout(() => tear.classList.remove('active'), 500);
                }

                // ⭕ CIRCULAR STROBO - cerchi concentrici espandenti - SOGLIA RIDOTTA
                const CIRCULAR_STROBO_ENABLED = true;
                const circularBassThreshold = isMobile ? 0.35 : 0.8;
                // Su bassi: lancia cerchi concentrici
                if (CIRCULAR_STROBO_ENABLED && bassLevel > circularBassThreshold && Math.random() > (isMobile ? 0.15 : 0.5) && _claimAccent()) {
                    const circle = circularStrobos[Math.floor(Math.random() * circularStrobos.length)];
                    circle.classList.add('active');

                    setTimeout(() => {
                        circle.classList.remove('active');
                    }, 400);
                }

                // Su alti: lancia multipli cerchi veloci - SOGLIA RIDOTTA
                const circularTrebleThreshold = isMobile ? 0.3 : 0.75;
                if (CIRCULAR_STROBO_ENABLED && trebleLevel > circularTrebleThreshold && Math.random() > (isMobile ? 0.2 : 0.55) && _claimAccent()) {
                    // Lancia 2-3 cerchi in rapida successione
                    const count = 2 + Math.floor(Math.random() * 2);
                    for (let i = 0; i < count; i++) {
                        setTimeout(() => {
                            const circle = circularStrobos[Math.floor(Math.random() * circularStrobos.length)];
                            circle.classList.add('active');
                            setTimeout(() => circle.classList.remove('active'), 400);
                        }, i * 100); // sfasati di 100ms
                    }
                }

                // ✨ SILVER GLOW PARTICLES - glow argentati a ritmo medi
                const glowMidThreshold = isMobile ? 0.25 : 0.6;
                if (midLevel > glowMidThreshold && Math.random() > (isMobile ? 0.15 : 0.45) && _claimAccent()) {
                    const glow = silverGlowParticles[Math.floor(Math.random() * silverGlowParticles.length)];
                    const pos = magicPositions[Math.floor(Math.random() * magicPositions.length)];
                    const size = 40 + Math.random() * 80;
                    glow.style.width = size + 'px';
                    glow.style.height = size + 'px';
                    Object.assign(glow.style, pos);
                    glow.classList.add('active');
                    setTimeout(() => glow.classList.remove('active'), 600);
                }

                // 🌀 SPIRAL WHIRL - spiraloidi rotativi random a ritmo
                const whirlMidThreshold = isMobile ? 0.28 : 0.65;
                if (midLevel > whirlMidThreshold && Math.random() > (isMobile ? 0.2 : 0.5) && _claimAccent()) {
                    const whirl = spiralWhirls[Math.floor(Math.random() * spiralWhirls.length)];
                    const pos = magicPositions[Math.floor(Math.random() * magicPositions.length)];
                    const colors = ['rgba(255, 255, 255, 0.9)'];
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const size = 50 + Math.random() * 80;
                    whirl.style.width = size + 'px';
                    whirl.style.height = size + 'px';
                    whirl.innerHTML = createSpiralSvg(color);
                    Object.assign(whirl.style, pos);
                    whirl.classList.add('active');
                    setTimeout(() => {
                        whirl.classList.remove('active');
                        whirl.innerHTML = '';
                    }, 800);
                }

                // ✨ SHIMMER TWINKLE - scintillio argentato random
                const twinkleMidThreshold = isMobile ? 0.2 : 0.5;
                if (midLevel > twinkleMidThreshold && Math.random() > (isMobile ? 0.3 : 0.7) && _claimAccent()) {
                    const count = 1 + Math.floor(Math.random() * 3);
                    for (let i = 0; i < count; i++) {
                        setTimeout(() => {
                            const twinkle = shimmerTwinkles[Math.floor(Math.random() * shimmerTwinkles.length)];
                            const pos = magicPositions[Math.floor(Math.random() * magicPositions.length)];
                            Object.assign(twinkle.style, pos);
                            twinkle.classList.add('active');
                            setTimeout(() => twinkle.classList.remove('active'), 400);
                        }, i * 50);
                    }
                }
                
                // � DISTORTION ZONES - distorsioni parziali graduali a tempo
                // Distorsioni su bassi (stack speaker) - DISABILITATO su slow devices
                if (!isSlowDevice) {
                    const distortThreshold = isMobile ? 0.3 : 0.75;
                    if (bassLevel > distortThreshold && Math.random() > (isMobile ? 0.3 : 0.7) && _claimDistort()) {
                        const zone = distortZones[Math.floor(Math.random() * distortZones.length)];
                        zone.classList.add('active');
                        setTimeout(() => zone.classList.remove('active'), 400);
                    }

                    // Warp glitch su medi (crowd e antenna zone) - SOGLIA RIDOTTA
                    const warpThreshold = isMobile ? 0.3 : 0.7;
                    if (midLevel > warpThreshold && Math.random() > (isMobile ? 0.3 : 0.75) && _claimDistort()) {
                        const zone = warpZones[Math.floor(Math.random() * warpZones.length)];
                        zone.classList.add('active');
                        setTimeout(() => zone.classList.remove('active'), 300);
                    }

                    // Chromatic split su alti (zone laterali) - SOGLIA RIDOTTA
                    const chromaThreshold = isMobile ? 0.25 : 0.7;
                    if (trebleLevel > chromaThreshold && Math.random() > (isMobile ? 0.3 : 0.8) && _claimDistort()) {
                        const zone = chromaZones[Math.floor(Math.random() * chromaZones.length)];
                        zone.classList.add('active');
                        setTimeout(() => zone.classList.remove('active'), 200);
                    }
                }
                
                // �🎆 GEOMETRIC STROBES - brillamenti geometrici sui beat
                // Bass -> cerchi + radial burst
                const geoStrobeThreshold = isMobile ? 0.3 : 0.75;
                if (bassLevel > geoStrobeThreshold && Math.random() > (isMobile ? 0.2 : 0.6) && _claimAccent()) {
                    const choice = Math.random();
                    if (choice < 0.4) {
                        // Cerchi concentrici - OPACITÀ AUMENTATA
                        strobeCircle1.style.opacity = isMobile ? '1' : '0.9';
                        strobeCircle2.style.opacity = isMobile ? '0.9' : '0.7';
                        setTimeout(() => {
                            strobeCircle1.style.opacity = '0';
                            strobeCircle2.style.opacity = '0';
                        }, 60);
                    } else if (choice < 0.7) {
                        // Radial burst dal centro - OPACITÀ AUMENTATA
                        strobeRadial.style.opacity = isMobile ? '1' : '0.8';
                        setTimeout(() => {
                            strobeRadial.style.opacity = '0';
                        }, 80);
                    } else {
                        // Bottom crowd flash - OPACITÀ AUMENTATA
                        strobeBottom.style.opacity = isMobile ? '1' : '0.9';
                        setTimeout(() => {
                            strobeBottom.style.opacity = '0';
                        }, 70);
                    }
                }
            }
            
            // Draconian gate: these fire OUTSIDE the beat-block. Gate behind
            // recent beat activity (< 800 ms since last detected beat) so atmospheric
            // mid/treble content alone doesn't trigger strobes.
            const _recentBeat = Date.now() - lastBeatTime < 800;

            // Mid -> speaker walls laterali - SOGLIA RIDOTTA
            const speakerMidThreshold = isMobile ? 0.3 : 0.7;
            if (_recentBeat && midLevel > speakerMidThreshold && Math.random() > (isMobile ? 0.3 : 0.8)) {
                if (Math.random() < 0.5) {
                    strobeLeftWall.style.opacity = isMobile ? '1' : '0.8';
                    setTimeout(() => {
                        strobeLeftWall.style.opacity = '0';
                    }, 50);
                } else {
                    strobeRightWall.style.opacity = isMobile ? '1' : '0.8';
                    setTimeout(() => {
                        strobeRightWall.style.opacity = '0';
                    }, 50);
                }
            }

            // Treble -> top flash (antenna beams) - SOGLIA RIDOTTA
            const antennaTrebleThreshold = isMobile ? 0.3 : 0.75;
            if (_recentBeat && trebleLevel > antennaTrebleThreshold && Math.random() > (isMobile ? 0.3 : 0.85)) {
                strobeTop.style.opacity = isMobile ? '1' : '0.9';
                setTimeout(() => {
                    strobeTop.style.opacity = '0';
                }, 40);
            }

            // Peak energy -> random geometric strobe - SOGLIA RIDOTTA
            const peakEnergyThreshold = isMobile ? 0.3 : 0.8;
            if (_recentBeat && energy > peakEnergyThreshold && Math.random() > (isMobile ? 0.7 : 0.92)) {
                const randomStrobe = geoStrobes[Math.floor(Math.random() * geoStrobes.length)];
                randomStrobe.style.opacity = isMobile ? '1' : '0.95';
                setTimeout(() => {
                    randomStrobe.style.opacity = '0';
                }, 30 + Math.random() * 40);
            }

            // ✶ CONSTELLATION LINES — hi-hat / cymbal onsets connect nearby star particles
            // with thin white segments. Independent channel: no beat-budget contention.
            {
                let trebleBaseline = 0;
                const n = trebleHistFilled ? trebleHist.length : trebleHistIdx;
                if (n > 4) {
                    for (let i = 0; i < n; i++) trebleBaseline += trebleHist[i];
                    trebleBaseline /= n;
                }
                trebleHist[trebleHistIdx] = trebleLevel;
                trebleHistIdx = (trebleHistIdx + 1) % trebleHist.length;
                if (trebleHistIdx === 0) trebleHistFilled = true;

                const tNow = Date.now();
                // Onset: ratio over baseline + absolute floor + cooldown + not in deep silence
                const isOnset = trebleLevel > 0.22
                    && trebleLevel > trebleBaseline * 1.55
                    && tNow - lastConstellation > 140
                    && activity > 0.35;
                if (isOnset && bgParticles.length >= 3) {
                    // Pick anchor + 1-2 nearby particles in normalized space
                    const anchorIdx = Math.floor(Math.random() * bgParticles.length);
                    const anchor = bgParticles[anchorIdx];
                    const maxDist = 0.18;
                    const candidates = [];
                    for (let i = 0; i < bgParticles.length; i++) {
                        if (i === anchorIdx) continue;
                        const dx = bgParticles[i].x - anchor.x;
                        const dy = bgParticles[i].y - anchor.y;
                        if (dx*dx + dy*dy < maxDist*maxDist) candidates.push(i);
                    }
                    if (candidates.length > 0) {
                        const slot = constellations[constIdx % constellationMax];
                        slot.active = true;
                        slot.t0 = tNow;
                        const picks = [anchorIdx];
                        const pickCount = Math.min(candidates.length, 1 + (Math.random() < 0.4 ? 1 : 0));
                        for (let i = 0; i < pickCount; i++) {
                            const k = Math.floor(Math.random() * candidates.length);
                            picks.push(candidates[k]);
                            candidates.splice(k, 1);
                        }
                        slot.points = picks;
                        constIdx++;
                        lastConstellation = tNow;
                    }
                }
            }

            // 🌊 CONTINUOUS MOTION BLUR - target computed here, applied (lerped) at end of frame
            // Soft ramp on mid: starts at 0.6, full strength at 0.8 (no hard 0.75 step).
            
            // 🎲 RANDOM MICRO MOVEMENTS - movimenti sottili costanti
            // Suppressed in silence so the scene reads as still, not twitchy.
            // Also suppressed during a singularity event so the suction transform isn't fought.
            if (calmness < 0.4 && Math.random() > 0.95 && singularityProgress < 0.01) {
                const microX = (Math.random() - 0.5) * 3;
                const microY = (Math.random() - 0.5) * 3;
                const microRotate = (Math.random() - 0.5) * 1;
                background.style.transform = `scale(${zoomIntensity}) rotate(${rotateAmount + microRotate}deg) translate(${microX}px, ${microY}px)`;
            }
            
            // 🎯 EFFETTO 3D POV COMPLETO - dondolio su tutti gli assi CON EASING
            // Calcola progress con easing (0-1 ciclico ogni 2 secondi)
            const cycleTime = 2000; // 2 secondi per ciclo
            const rawProgress = (Date.now() % cycleTime) / cycleTime;
            const easedProgress = currentEasingFunc(rawProgress);
            
            // Sinistra/Destra (bassi): movimento orizzontale con easing
            const swayX = (Math.sin(easedProgress * Math.PI * 2) * bassLevel * 40) + (window.targetPoint.x * bassLevel * 0.5);
            
            // Avanti/Indietro (medi): movimento verticale + zoom con easing alternato
            const depthCycle = (Date.now() % 3000) / 3000; // ciclo 3 secondi
            const depthEased = easing.easeInOut(depthCycle); // sempre smooth per profondità
            const swayY = (Math.sin(depthEased * Math.PI * 2) * midLevel * 35) + (window.targetPoint.y * midLevel * 0.5);
            const depthZoom = Math.sin(depthEased * Math.PI * 2) * midLevel * 0.15; // oscillazione zoom per "avanti/indietro"
            
            // Rotazione testa (alti): piccole rotazioni su tutti gli assi con bounce
            const rotateCycle = (Date.now() % 2500) / 2500;
            const rotateEased = easing.bounce(rotateCycle);
            const swayRotateZ = Math.sin(rotateEased * Math.PI * 2) * trebleLevel * 4; // rotazione Z (principale)
            const swayRotateX = Math.sin(rotateEased * Math.PI * 2) * trebleLevel * 2; // tilt testa su/giù
            
            // Zoom burst verso target point CON EASING
            let burstOffsetX = 0, burstOffsetY = 0, burstBlur = 0;
            if (Date.now() - lastZoomBurst < 300) {
                const burstProgress = (Date.now() - lastZoomBurst) / 300; // 0 a 1
                const burstEased = easing.easeOut(burstProgress); // decelerazione rapida
                burstOffsetX = window.targetPoint.x * (1 - burstEased) * 0.5;
                burstOffsetY = window.targetPoint.y * (1 - burstEased) * 0.5;
                // Blur con easing sinusoidale per effetto più organico
                burstBlur = Math.sin(burstEased * Math.PI) * 8; // blur 0→8→0
            }
            
            // Audio-reactive skew (parallax POV): bg si inclina con la musica,
            // la pupilla resta dritta sul suo canvas → senso di "mondo tilted".
            // Ampiezza: ±0.3° in silenzio, fino a ±2.1° su mid sostenuto.
            const skewCycle = (Date.now() % 4000) / 4000;
            const skewEased = easing.easeInOut(skewCycle);
            const swaySkewX = Math.sin(skewEased * Math.PI * 2) * (midLevel * 1.8 + 0.3);

            // Applica TUTTI i movimenti combinati — perspective(900px) attiva il 3D
            // context, rotateY/X baseline (0.3°/-0.5°) creano il pseudo-lens senza
            // costo runtime (è solo matrix). Scale baseline 1.07 nel zoomIntensity.
            // Singularity Step 2 (variation A "Suction Spirale"): multiplicative scale-down +
            // additive rotation that ride on top of the existing pseudo-3D pose.
            const _singScale = 1 - singularityProgress * 0.92;   // bg shrinks to ~8% at peak
            const _singRot = singularityProgress * 540;          // 1.5 turns over collapse+hold
            background.style.transform = `perspective(900px) scale(${(zoomIntensity + depthZoom) * _singScale}) rotateY(0.3deg) rotateX(${swayRotateX - 0.5}deg) rotate(${rotateAmount + swayRotateZ + _singRot}deg) skewX(${swaySkewX}deg) translate(${swayX + burstOffsetX}px, ${swayY + burstOffsetY}px)`;

            // ===== PUPIL MOTION (decoupled from #background sway) =====
            // The pupil has its own coreography. Behaviour modes layer in priority,
            // each with its own spring stiffness/damping for distinct "feel".
            // Amplitude scales with kickStack so the pupil really fies only on 3-layer
            // tekno bangs — minimal tracks stay composed.
            {
                const _now = Date.now();
                const _minDim = Math.min(bgCanvas.width, bgCanvas.height);
                const _amp = _minDim * 0.085;                      // generous base — was tremolosa
                const _kickAmp = _amp * (1 + kickStack * 0.55);    // scales with how many kicks stack

                // Compute target + spring tuning per active mode
                let _tx = 0, _ty = 0;
                let _stiff = 0.06, _damp = 0.78; // default (slightly stiffer than before)

                // AMBIENT BASELINE — slow ambient drift always present (when none of the
                // other modes fire). Prevents the pupil from parking at center and looking
                // like a UI radio button between events.
                {
                    const _tBase = _now * 0.0009;
                    const _baseAmp = _amp * 0.22;
                    _tx = Math.cos(_tBase) * _baseAmp;
                    _ty = Math.sin(_tBase * 0.73) * _baseAmp * 0.7;
                    _stiff = 0.04; _damp = 0.86;
                }

                // BASE: silence drift — slow circular wander when scene is quiet
                if (calmness > 0.3) {
                    const t = _now * 0.001;
                    const driftAmp = _amp * 0.4 * calmness;
                    _tx = Math.cos(t * 1.05) * driftAmp;
                    _ty = Math.sin(t * 1.05) * driftAmp;
                    _stiff = 0.020; _damp = 0.88;
                }

                // OVERRIDE: Lissajous BPM-locked when tempo is stable.
                // Threshold curve on mid: flat below 0.3, climbs sharply above it.
                if (bpmStable) {
                    const ang = bpmSyncAngle;
                    const midDrive = 0.6 + Math.max(0, midLevel - 0.3) * 2.0;
                    const lissaAmp = _amp * midDrive;
                    _tx = Math.cos(ang * 0.5) * lissaAmp;
                    _ty = Math.sin(ang) * lissaAmp * 0.7;
                    _stiff = 0.06; _damp = 0.78;
                }

                // MODIFIER: Bass snap — every 4th beat, jump to a new random offset
                // sized by current kickStack (3-stack → pupil flung to edge of visible).
                // Usa beatCount monotonic, non beatHistory.length (sliding window capped 10).
                if (beatCount > 0 && beatCount !== lastBassSnapBeat && beatCount % 4 === 0) {
                    lastBassSnapBeat = beatCount;
                    bassSnapTargetX = (Math.random() - 0.5) * _kickAmp * 2.0;
                    bassSnapTargetY = (Math.random() - 0.5) * _kickAmp * 1.6;
                    bassSnapUntil = _now + 700;
                }
                if (_now < bassSnapUntil) {
                    _tx = bassSnapTargetX;
                    _ty = bassSnapTargetY;
                    _stiff = 0.12; _damp = 0.72;
                }

                // MODIFIER: Saccade — micro jolt on hi-hat onsets, sized by current treble.
                if (_now - lastConstellation < 130) {
                    if (saccadeT0 !== lastConstellation) {
                        saccadeT0 = lastConstellation;
                        const sAmp = 30 + trebleLevel * 70;        // 30 → ~100 px
                        saccadeX = (Math.random() - 0.5) * 2 * sAmp;
                        saccadeY = (Math.random() - 0.5) * 2 * sAmp;
                    }
                    _tx += saccadeX;
                    _ty += saccadeY;
                    _stiff = 0.24; _damp = 0.62;
                }

                // DROP IMPACT — rising-edge detection on dropFlashIntensity:
                // pre-shoot pupil OUT in a random direction (scaled by kickStack),
                // then ~180 ms later the standard recoil pulls it back to center.
                if (dropFlashIntensity > lastDropFlashIntensity + 0.3) {
                    const _ang = Math.random() * Math.PI * 2;
                    const _imp = _amp * (1.5 + kickStack);          // 1.5x → 4.5x _amp
                    dropImpactX = Math.cos(_ang) * _imp;
                    dropImpactY = Math.sin(_ang) * _imp;
                    dropImpactUntil = _now + 180;
                }
                lastDropFlashIntensity = dropFlashIntensity;

                if (_now < dropImpactUntil) {
                    _tx = dropImpactX;
                    _ty = dropImpactY;
                    _stiff = 0.35; _damp = 0.50;
                } else if (dropFlashIntensity > 0.3) {
                    // Post-impact recoil: pull back to center, slight overshoot.
                    _tx = 0; _ty = 0;
                    _stiff = 0.30; _damp = 0.55;
                }

                pupilTargetX = _tx;
                pupilTargetY = _ty;

                // Spring-damper update — ease-in/out curve, never linear
                pupilVelX = pupilVelX * _damp + (pupilTargetX - pupilOffX) * _stiff;
                pupilVelY = pupilVelY * _damp + (pupilTargetY - pupilOffY) * _stiff;
                pupilOffX += pupilVelX;
                pupilOffY += pupilVelY;
                // NaN/Infinity safety: once a non-finite slips into the accumulators
                // the spring stays poisoned forever and the pupil freezes. Reset.
                if (!isFinite(pupilOffX) || !isFinite(pupilOffY) ||
                    !isFinite(pupilVelX) || !isFinite(pupilVelY)) {
                    console.warn('[pupil] spring poisoned, resetting');
                    pupilOffX = pupilOffY = pupilVelX = pupilVelY = 0;
                }
                // Also clamp to a sane max so a stray spike can't fling the pupil off-screen forever
                const _maxOff = _minDim * 0.5;
                if (Math.abs(pupilOffX) > _maxOff) pupilOffX = Math.sign(pupilOffX) * _maxOff;
                if (Math.abs(pupilOffY) > _maxOff) pupilOffY = Math.sign(pupilOffY) * _maxOff;

                // Update mask CSS vars: hole radius + center offset → rays follow the pupil.
                // Same scale formula as drawPupil() so the mask hole matches the visible pupil.
                // Weights in sync con drawPupil(): trimmati su contributori "lenti" e
                // gonfiati su quelli per-frame → mask hole non parcheggia oltre il pupil.
                let _pupilScale = 1 + bassLevel * 0.28 + pupilDilation * 0.40 + cassoneIntensity * 0.45 + subKick * 0.40;
                // Keep mask hole in sync with drawPupil() fat-bass curve (sub*body*punch term included).
                const _fatBassMask = Math.max(0, (kickStack - 1.2) / 1.5) * 0.25
                                   + Math.pow(Math.max(0, cassoneIntensity - 0.4), 1.5) * 0.60
                                   + subKick * bodyKick * punchKick * 0.65;
                _pupilScale *= 1 + _fatBassMask;
                _pupilScale *= 0.10 + 0.90 * bassCharge * bassCharge;  // quadratic match drawPupil
                _pupilScale *= 1 - calmness * 0.28;
                _pupilScale *= 1 - bdSnapAmount * BD_SNAP_MAGNITUDE;  // bass-drop snap (match drawPupil)
                if (silenceMode) _pupilScale += Math.sin(_now * 0.002) * 0.05 * calmness;
                // Singularity Step 2: mask hole contracts → rays close in on the pupil.
                const _pupilR = _minDim * 0.06 * _pupilScale * (1 - singularityProgress * 0.85);
                negativeLayer.style.setProperty('--pupil-r', _pupilR.toFixed(1) + 'px');
                negativeLayer.style.setProperty('--pupil-x', pupilOffX.toFixed(1) + 'px');
                negativeLayer.style.setProperty('--pupil-y', pupilOffY.toFixed(1) + 'px');
            }
            // BLINK trigger + state machine. Two paths:
            //   1) periodic: ogni 18-38s con jitter random
            //   2) reactive: rising edge di dropFlashIntensity (drop = blink involontario)
            {
                const _nowB = Date.now();
                if (!blinkActive && _nowB > nextBlinkAt) {
                    blinkActive = true;
                    blinkStart = _nowB;
                }
                if (dropFlashIntensity > lastDropFlashIntensity + 0.3 && !blinkActive) {
                    blinkActive = true;
                    blinkStart = _nowB;
                }
                if (blinkActive && _nowB - blinkStart > BLINK_DURATION) {
                    blinkActive = false;
                    nextBlinkAt = _nowB + 18000 + Math.random() * 20000;
                }
            }
            // Draw the pupil on its dedicated top canvas (always on top of everything).
            drawPupil(Date.now(), bassLevel, midLevel, trebleLevel, pupilOffX, pupilOffY);

            // Coalesced blur: sum mid-driven soft blur + burst blur, drive a
            // spring-damper so the rise/fall is always eased (never flat).
            let targetBlur = burstBlur;
            if (midLevel > 0.6) {
                const midRamp = Math.min(1, (midLevel - 0.6) / 0.2); // 0..1 across 0.6..0.8
                targetBlur += midRamp * midLevel * 3;
            }
            // Spring: stiffness pulls toward target, damping smooths velocity →
            // velocity ramps up, peaks in the middle, decays near target.
            const blurForce = (targetBlur - currentBlur) * 0.05;
            blurVelocity = blurVelocity * 0.78 + blurForce;
            currentBlur += blurVelocity;
            if (currentBlur < 0) currentBlur = 0;
            if (currentBlur > 0.15) {
                background.style.filter = `blur(${currentBlur.toFixed(2)}px)`;
            } else if (background.style.filter) {
                background.style.filter = '';
                currentBlur = 0;
                blurVelocity = 0;
            }
            
            // 🌀 CIRCLE PULSE (centro) - MOLTO più visibile con zoom burst
            // Scala diverse per mobile e desktop
            const basePulseSize = isMobile ? 80 : 150;
            const pulseMultiplier = isMobile ? 300 : 600;
            const pulseSize = basePulseSize + bassLevel * pulseMultiplier;
            const pulseBurst = (Date.now() - lastZoomBurst < 300) ? 1.5 : 1; // amplifica durante zoom burst
            circlePulse.style.width = (pulseSize * pulseBurst) + 'px';
            circlePulse.style.height = (pulseSize * pulseBurst) + 'px';
            // Pulse opacity dimmed in silence so the breathing center reads quiet, not bright.
            circlePulse.style.opacity = (0.5 + bassLevel * 0.5) * (0.25 + 0.75 * activity);
            circlePulse.style.borderWidth = (Math.max(2, isMobile ? 2 : 3) + bassLevel * (isMobile ? 5 : 10)) + 'px';
            
            // Glow extra su burst
            // Single-layer box-shadow (matches the simplified CSS rule).
            circlePulse.style.boxShadow = (pulseBurst > 1)
                ? '0 0 90px rgba(255, 255, 255, 1)'
                : '0 0 45px rgba(255, 255, 255, 0.75)';
            
            // 🔊 SPEAKER FLASHES (laterali) - più intensi
            speakerFlashes.forEach(flash => {
                flash.style.opacity = midLevel * 1.2;
                flash.style.filter = `blur(${30 + midLevel * 50}px)`;
            });

            // body.silent pauses purely-CSS animations (dust, vhs, grain). Hysteresis
            // around the 0.85 threshold to avoid flicker on the edge of breakdowns.
            const wantSilent = calmness > 0.85;
            const isSilent = document.body.classList.contains('silent');
            if (wantSilent && !isSilent) document.body.classList.add('silent');
            else if (!wantSilent && calmness < 0.55 && isSilent) document.body.classList.remove('silent');
            
            // 🖼️ PROCEDURAL BACKGROUND - render with audio reactivity
            bgFrameCount++;
            let bgRenderFrequency = isSmallMobile ? 4 : isMobile ? 2 : 1;
            if (isSlowDevice) bgRenderFrequency += 2;
            if (bgFrameCount % bgRenderFrequency === 0) {
                drawProceduralBg(bgCtx, bgCanvas.width, bgCanvas.height, bassLevel, midLevel, trebleLevel, energy, Date.now(), dataArray);
            }

            // 🎨 VORTEX ROTATION — RIMOSSO in v1.3.6 (3° layer di "gabbia" attorno
            // al centro, dopo tunnel-ring CSS e LAYER 1 pulse-rings). Saving netto
            // ~3-5 ms/frame nel worst case (8 stroke + shadowBlur 15 quando bassLevel>0.5).

            animationId = requestAnimationFrame(animate);
        }
        
        console.log('FREE UNDERGROUND TEKNO - Radio VJ System Ready');
    </script>
</body>
