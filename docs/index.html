            }
        })();

        // ===== SINGULARITY VIBE METER =====
        // Long-form accumulator that decides when (and only when) the page
        // is allowed to collapse everything into the pupil for ~2s.
        // ~1-2 events / 30 min typical. NOT pure audio-driven: hybrid with
        // hard cooldown + random gate + starvation/satiation → irriproducibile.
        // Step 1: logging only — no visual effect attached yet.
        let vibeCharge = 0;                  // 0..1
        let vibeArmed = false;               // true after threshold crossing, until dip
        let lastSingularityFireAt = 0;       // ms timestamp
        let satiationOffset = 0;             // additive to threshold, +0.05 per fire
        let prevRitualStage = 0;             // 0/1/2/3, for stage transition detection
        let bassChargePeak = 0;              // recent peak (for drop detection)
        let bassChargePeakAt = 0;            // when peak was reached
        const sessionStartAt = Date.now();
        // ⚠️ DEBUG/TEST mode — rapid fire so we can validate the trigger logic + future visual
        // in a single short session. REVERT TO false BEFORE SHIP (or remove this block entirely).
        const VIBE_DEBUG_FAST = false;
        const VIBE_BASE_THRESHOLD     = VIBE_DEBUG_FAST ? 0.30 : 0.85;
        const VIBE_COOLDOWN_MIN_MS    = VIBE_DEBUG_FAST ? 30 * 1000          : 15 * 60 * 1000;
        const VIBE_COOLDOWN_MAX_MS    = VIBE_DEBUG_FAST ? 60 * 1000          : 25 * 60 * 1000;
        const VIBE_WARMUP_MS          = VIBE_DEBUG_FAST ? 10 * 1000          : 3  * 60 * 1000;
        const VIBE_SATIATION_RESET_MS = VIBE_DEBUG_FAST ? 5  * 60 * 1000     : 60 * 60 * 1000;

        // ===== SINGULARITY STATE MACHINE =====
        // States: 'idle' | 'collapse' (1.5s, in) | 'hold' (0.3s, peak) | 'release' (0.7s, out)
        // Driven by the vibe meter fire. singularityProgress is read by renderers.
        let singularityState = 'idle';
        let singularityStartAt = 0;
        let singularityProgress = 0;    // 0 fully out, 1 fully collapsed
        let singularityVariation = 'A'; // Step 2 only ships A; B/C/D/E come in Step 4
        const SING_COLLAPSE_MS = 1500;
        const SING_HOLD_MS     = 300;
        const SING_RELEASE_MS  = 700;
        const SING_TOTAL_MS    = SING_COLLAPSE_MS + SING_HOLD_MS + SING_RELEASE_MS;

        function fireSingularity(variation) {
            singularityState  = 'collapse';
            singularityStartAt = Date.now();
            singularityVariation = variation || 'A';
            console.log('%c[SINGULARITY START]', 'background:#000;color:#fff;font-weight:bold;padding:2px 6px;', 'variation=' + singularityVariation);
        }

        function updateSingularity() {
            if (singularityState === 'idle') { singularityProgress = 0; return; }
            const elapsed = Date.now() - singularityStartAt;
            if (elapsed < SING_COLLAPSE_MS) {
                // easeIn (quadratic) — accelerates as the pull tightens near the pupil
                const t = elapsed / SING_COLLAPSE_MS;
                singularityProgress = t * t;
                singularityState = 'collapse';
            } else if (elapsed < SING_COLLAPSE_MS + SING_HOLD_MS) {
                singularityProgress = 1;
                if (singularityState !== 'hold') {
                    singularityState = 'hold';
                    console.log('[singularity] HOLD');
                }
            } else if (elapsed < SING_TOTAL_MS) {
                // easeOut — gentle exhalation
                const t = (elapsed - SING_COLLAPSE_MS - SING_HOLD_MS) / SING_RELEASE_MS;
                singularityProgress = 1 - (1 - (1 - t) * (1 - t));
                if (singularityState !== 'release') {
                    singularityState = 'release';
                    console.log('[singularity] RELEASE');
                }
            } else {
                singularityProgress = 0;
                singularityState = 'idle';
                console.log('[singularity] idle');
            }
        }

        // ===== STACCO FREEZE — wall→silence foto-finish =====
        // Layer raro: cattura uno snapshot del frame corrente quando un "muro"
        // (kickStack≥2 + bassLevel alto sostenuto) crolla in quasi-silenzio
        // (bassCharge<0.20 dopo peak>0.85). Max 1 ogni 5 min (1 min in DEBUG).
        // Effetto: snapshot congelato 1.5s + scanline che attraversa, B&W boost
        // via CSS filter, fade-out 400 ms.
        let freezeState = 'idle';            // 'idle' | 'hold' | 'fade'
        let freezeStartAt = 0;
        let lastStaccoFireAt = 0;
        let wallSustainedAt = 0;             // ms — ultimo momento in cui il muro era attivo
        let freezeOverlayCanvas = null;
        let freezeOverlayCtx = null;
        let freezeSnapshotCanvas = null;     // offscreen, persistent snapshot del fire
        let freezeSnapshotCtx = null;
        const FREEZE_HOLD_MS = 1500;
        const FREEZE_FADE_MS = 400;
        const FREEZE_COOLDOWN_MS = VIBE_DEBUG_FAST ? 60 * 1000 : 5 * 60 * 1000;

        function fireFreeze() {
            if (!freezeOverlayCanvas || !freezeSnapshotCanvas) return;
            // Cattura: composito bgCanvas + pupilCanvas nello snapshot offscreen.
            // DOM-level effects (tunnel rings, vhs lines, grain) restano live in
            // background ma sono coperti dall'overlay opaco.
            const w = freezeSnapshotCanvas.width;
            const h = freezeSnapshotCanvas.height;
            freezeSnapshotCtx.clearRect(0, 0, w, h);
            try { freezeSnapshotCtx.drawImage(bgCanvas, 0, 0, w, h); } catch(e) {}
            try { freezeSnapshotCtx.drawImage(pupilCanvas, 0, 0, w, h); } catch(e) {}
            freezeState = 'hold';
            freezeStartAt = Date.now();
            freezeOverlayCanvas.style.opacity = '1';
            console.log('%c[STACCO FREEZE]', 'background:#fff;color:#000;font-weight:bold;padding:2px 6px;',
                'wall→silence captured');
        }

        function updateFreeze() {
            if (freezeState === 'idle') return;
            if (!freezeOverlayCanvas || !freezeSnapshotCanvas) return;
            const w = freezeOverlayCanvas.width;
            const h = freezeOverlayCanvas.height;
            const elapsed = Date.now() - freezeStartAt;

            // Redraw snapshot ogni frame + scanline che attraversa verticalmente.
            freezeOverlayCtx.clearRect(0, 0, w, h);
            freezeOverlayCtx.drawImage(freezeSnapshotCanvas, 0, 0);

            // Scanline progress: 0..1 nell'intero hold, posizionata su h.
            const _scanT = Math.min(1, elapsed / FREEZE_HOLD_MS);
            const _scanY = _scanT * h;
            // Bright thin band + dimmer trail above
            freezeOverlayCtx.save();
            freezeOverlayCtx.fillStyle = 'rgba(255,255,255,0.85)';
            freezeOverlayCtx.fillRect(0, _scanY - 1, w, 2);
            freezeOverlayCtx.fillStyle = 'rgba(255,255,255,0.18)';
            freezeOverlayCtx.fillRect(0, _scanY - 24, w, 22);
            freezeOverlayCtx.restore();

            if (elapsed < FREEZE_HOLD_MS) {
                if (freezeState !== 'hold') freezeState = 'hold';
            } else if (elapsed < FREEZE_HOLD_MS + FREEZE_FADE_MS) {
                const t = (elapsed - FREEZE_HOLD_MS) / FREEZE_FADE_MS;
                freezeOverlayCanvas.style.opacity = String(1 - t);
                if (freezeState !== 'fade') {
                    freezeState = 'fade';
                    console.log('[stacco] fade');
                }
            } else {
                freezeState = 'idle';
                freezeOverlayCanvas.style.opacity = '0';
                console.log('[stacco] idle');
            }
        }

        // ===== L3 MULTI-USER AWARENESS (Azuracast nowplaying) =====
        // La creatura "sa" quanti la ascoltano in questo momento e lo lascia
        // trapelare nel rendering (pulse-per-listener, iris alpha, parallax
        // density). Polling 45 s, server cache 10 s + Cloudflare edge cache →
        // impatto trascurabile.
        // Endpoint statico: ha CORS aperto (Access-Control-Allow-Origin: *)
        // configurato lato nginx Azuracast. Il dynamic /api/nowplaying/<station>
        // invece blocca cross-origin. Stesso shape (listeners.current/unique/total).
        // Fallback silenzioso su errore/offline → la creatura non si rompe.
        const AZURACAST_URL = 'https://radio.freeundergroundtekno.org/api/nowplaying_static/free_underground_tekno.json';
        const LISTENER_POLL_MS = 45 * 1000;
        let liveListeners = 0;          // listeners.current (smoothed lerp consumer-side)
        let liveListenersUnique = 0;
        let lastListenerFetchAt = 0;
        let azuracastOnline = false;    // true after first successful fetch
        let listenerFetchInFlight = null;  // AbortController

        // Pulse-per-listener state — 4-bar-locked micro-glow array attorno alla pupilla.
        let listenerPulses = [];        // [{t0, dur}, ...] ring waves attive
        let lastListenerPulseGroup = -1; // ultimo group di 4-bar visto, per rising-edge
        const LISTENER_PULSE_DUR_MS = 1000;
        const LISTENER_PULSE_CAP = 12;

        async function fetchListenerCount() {
            // Abort any in-flight request to avoid pile-up if the network is slow.
            if (listenerFetchInFlight) try { listenerFetchInFlight.abort(); } catch(e) {}
            const ac = new AbortController();
            listenerFetchInFlight = ac;
            const _timeout = setTimeout(() => ac.abort(), 6000);
            try {
                const res = await fetch(AZURACAST_URL, { signal: ac.signal, cache: 'default' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const j = await res.json();
                const cur = j && j.listeners && Number(j.listeners.current);
                const uniq = j && j.listeners && Number(j.listeners.unique);
                const online = !!(j && j.is_online);
                if (Number.isFinite(cur)) liveListeners = Math.max(0, cur);
                if (Number.isFinite(uniq)) liveListenersUnique = Math.max(0, uniq);
                azuracastOnline = online;
                lastListenerFetchAt = Date.now();
                console.log('%c[listeners]', 'color:#888', 'current=' + liveListeners,
                    'unique=' + liveListenersUnique, 'online=' + azuracastOnline);
            } catch (e) {
                // Silent: keep lastKnown values. If we never succeeded, azuracastOnline stays false
                // and all listener-driven viz layers stay quiet.
                if (e.name !== 'AbortError') {
                    console.log('%c[listeners] fetch failed:', 'color:#888', e.message || e);
                }
            } finally {
                clearTimeout(_timeout);
                if (listenerFetchInFlight === ac) listenerFetchInFlight = null;
            }
        }

        // ===== DROP IMPACT — pre-shoot phase of drop recoil =====
        let lastDropFlashIntensity = 0;
        let dropImpactX = 0, dropImpactY = 0;
        let dropImpactUntil = 0;

        // ===== PUPIL MOTION STATE (decoupled from #background sway) =====
        // Spring-damped offset relative to viewport center. Different "moods"
        // produce different targets + tuning so the pupil reads as a living eye,
        // not a passive passenger of the bg transform.
        let pupilOffX = 0, pupilOffY = 0;
        let pupilVelX = 0, pupilVelY = 0;
        let pupilTargetX = 0, pupilTargetY = 0;
        // Bass-snap memory (target jumps every Nth beat)
        let lastBassSnapBeat = -1;
        let bassSnapTargetX = 0, bassSnapTargetY = 0;
        let bassSnapUntil = 0;
        // Saccade memory (micro jolt on hi-hat onset)
        let saccadeT0 = 0;
        let saccadeX = 0, saccadeY = 0;

        function rebuildHexGrid() {
            const w = bgCanvas.width;
            const h = bgCanvas.height;
            hexGridCanvas.width = w;
            hexGridCanvas.height = h;
            // Keep mask offscreen in sync con bgCanvas
            hexMaskedCanvas.width = w;
            hexMaskedCanvas.height = h;
            hexGridCtx.clearRect(0, 0, w, h);

            const hexRadius = 20;
            const hexHeight = hexRadius * 2;
            const hexWidth = Math.sqrt(3) * hexRadius;
            const vertSpacing = hexHeight * 0.75;
            const cx = w / 2;
            const cy = h / 2;
            const maxDist = Math.sqrt(cx * cx + cy * cy);

            hexGridCtx.strokeStyle = 'rgba(255,255,255,1)';
            hexGridCtx.lineWidth = 0.5;

            for (let row = -1; row * vertSpacing < h + hexHeight; row++) {
                const y = row * vertSpacing;
                const offset = (row % 2 !== 0) ? hexWidth / 2 : 0;
                for (let col = -1; col * hexWidth < w + hexWidth; col++) {
                    const x = col * hexWidth + offset;
                    const dist = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
                    const radialFade = 1 - Math.min(dist / maxDist, 1);
                    const alpha = 0.03 + radialFade * 0.05;
                    hexGridCtx.globalAlpha = alpha;
                    hexGridCtx.beginPath();
                    for (let i = 0; i < 6; i++) {
                        const angle = Math.PI / 3 * i - Math.PI / 6;
                        const hx = x + hexRadius * Math.cos(angle);
                        const hy = y + hexRadius * Math.sin(angle);
                        if (i === 0) hexGridCtx.moveTo(hx, hy);
                        else hexGridCtx.lineTo(hx, hy);
                    }
                    hexGridCtx.closePath();
                    hexGridCtx.stroke();
                }
            }
            hexGridCtx.globalAlpha = 1;

            // Radial transparent mask al centro: scava un buco morbido (blur gradient)
            // delle dimensioni del cerchio bianco più grande (Flower of Life outer ring,
            // ≈ minDim * 0.24). Bake into pre-rendered canvas → zero costo a runtime.
            const _maskR = Math.min(w, h) * 0.24;
            const _maskGrad = hexGridCtx.createRadialGradient(cx, cy, 0, cx, cy, _maskR);
            _maskGrad.addColorStop(0,    'rgba(0,0,0,1)');     // pieno hole al centro
            _maskGrad.addColorStop(0.55, 'rgba(0,0,0,0.7)');   // blur falloff
            _maskGrad.addColorStop(0.85, 'rgba(0,0,0,0.2)');
            _maskGrad.addColorStop(1,    'rgba(0,0,0,0)');     // bordo: hex intatto
            hexGridCtx.globalCompositeOperation = 'destination-out';
            hexGridCtx.fillStyle = _maskGrad;
            hexGridCtx.fillRect(cx - _maskR, cy - _maskR, _maskR * 2, _maskR * 2);
            hexGridCtx.globalCompositeOperation = 'source-over';
        }
        // Build initial hex grid
        rebuildHexGrid();

        function drawProceduralBg(ctx, w, h, bassLevel, midLevel, trebleLevel, energy, time, freqData) {
            ctx.clearRect(0, 0, w, h);

            const cx = w / 2;
            const cy = h / 2;
            const minDim = Math.min(w, h);

            // ===== STATE DETECTION =====
            // Update energy history
            energyHistory[energyHistoryIdx] = energy;
            energyHistoryIdx = (energyHistoryIdx + 1) % energyHistorySize;
            if (energyHistoryIdx === 0) energyHistoryFilled = true;

            // Rolling average for drop detection
            let energyAvg = 0;
            const histLen = energyHistoryFilled ? energyHistorySize : energyHistoryIdx;
            if (histLen > 0) {
                for (let i = 0; i < histLen; i++) energyAvg += energyHistory[i];
                energyAvg /= histLen;
            }

            // Drop detector: low energy for 1s+ then bass spike
            const isDropCandidate = energyAvg < 0.15 && histLen >= 30;
            if (isDropCandidate && bassLevel > 0.7 && time > dropCooldownUntil) {
                dropFlashIntensity = 1.0;
                dropCooldownUntil = time + 5000;
                // Pulse rings spawn rimosso in v1.3.6 (LAYER 1 dismesso).
                sacredGeoBoost = 1.0;
                lastPulseTime = time;
            }

            // Sustained Peak → Rave Mode
            if (energy > 0.65) {
                if (!ravePeakStart) ravePeakStart = time;
                if (time - ravePeakStart > 5000) raveMode = true;
            } else {
                raveMode = false;
                ravePeakStart = 0;
            }

            // Silence / Breakdown — triggera anche su rhythm-less content
            // (pad / atmospheric senza kicks) oltre che su silenzio puro.
            if (energy < 0.08 || bassCharge < 0.15) {
                if (!silenceStart) silenceStart = time;
                if (time - silenceStart > 2000) silenceMode = true;
            } else {
                silenceMode = false;
                silenceStart = 0;
            }

            // Marathon mode (15 minutes of playback)
            if (playStartTime > 0 && time - playStartTime > 900000) {
                if (!marathonMode) {
                    marathonMode = true;
                    // Mark every 5th particle as warm/golden
                    for (let i = 0; i < bgParticles.length; i += 5) {
                        bgParticles[i].warm = true;
                    }
                    if (!marathonFlashShown) {
                        marathonFlashShown = true;
                        marathonFlashStart = time;
                    }
                }
            }

            // BPM sync for sacred geometry (module-level: written here, read by pupil motion)
            bpmSyncAngle = 0;
            bpmStable = false;
            let _beatH;
            try { _beatH = beatHistory; } catch(e) { _beatH = null; }
            if (_beatH && _beatH.length >= 4) {
                const intervals = [];
                for (let i = 1; i < _beatH.length; i++) {
                    intervals.push(_beatH[i] - _beatH[i - 1]);
                }
                const avgInterval = intervals.reduce((a, b) => a + b, 0) / intervals.length;
                let variance = 0;
                for (let i = 0; i < intervals.length; i++) {
                    const diff = intervals[i] - avgInterval;
                    variance += diff * diff;
                }
                variance /= intervals.length;
                bpmStable = variance < 10000; // < 100ms²
                if (bpmStable && avgInterval > 0) {
                    bpmSyncAngle = ((time % avgInterval) / avgInterval) * Math.PI * 2;
                    bpmPulsePhase = (time % avgInterval) / avgInterval;
                    bpmPulseIntensity = Math.pow(1 - bpmPulsePhase, 3); // cubic decay
                    bpmAvgInterval = avgInterval; // expose to drawPupil for BPM-locked rotation + exhale
                }
            }
            if (!bpmStable) bpmPulseIntensity *= 0.95;

            // Pupil dilation: steady beats make the pupil grow
            if (_beatH && _beatH.length >= 3) {
                const recentIntervals = [];
                for (let i = Math.max(1, _beatH.length - 4); i < _beatH.length; i++) {
                    recentIntervals.push(_beatH[i] - _beatH[i-1]);
                }
                const avgInt = recentIntervals.reduce((a,b) => a+b, 0) / recentIntervals.length;
                const lastInt = recentIntervals[recentIntervals.length - 1];
                const deviation = Math.abs(lastInt - avgInt) / avgInt;

                if (deviation < 0.3 && time - _beatH[_beatH.length-1] < 1000) {
                    // Beat is steady
                    if (lastInt !== lastBeatInterval) {
                        steadyBeatCount = Math.min(steadyBeatCount + 1, 20);
                        lastBeatInterval = lastInt;
                        lastSteadyBeatTime = time;
                    }
                }
            }
            // Decay when no steady beats
            if (time - lastSteadyBeatTime > 500) {
                steadyBeatCount = Math.max(0, steadyBeatCount - 0.05); // smooth decay per frame
            }
            pupilTarget = Math.min(1, steadyBeatCount / 16);
            pupilDilation += (pupilTarget - pupilDilation) * 0.08; // smooth lerp

            // ===== LAYER 0: Star Field / Warehouse Dust =====
            // _active is still needed by downstream layers (hex, spiral, vortex…).
            const _active = 1 - calmness;
            const STARS_ENABLED = true;
            if (STARS_ENABLED) {
                const starBrightBase = 0.25 * _active + 0.06 * calmness;
                // Outer-check: max alpha possibile = starBrightBase + (treble*0.5 + bpmPulse*0.4) * _active.
                // Se sotto soglia → ogni particle skip individualmente ma il loop gira lo stesso.
                // In silenzio profondo: _active=0 → max ≈ 0.06*calmness ≈ 0.06 quando full silence
                // (sopra soglia), ma con calmness < 0.17 max < 0.01 → skip outright.
                const _maxStarAlpha = starBrightBase + (trebleLevel * 0.5 + bpmPulseIntensity * 0.4) * _active;
                if (_maxStarAlpha >= 0.01)
                for (let i = 0; i < bgParticles.length; i++) {
                    const p = bgParticles[i];
                    // Drift upward (halts in silence)
                    p.y -= p.speed * _active;
                    if (p.y < -0.01) { p.y = 1.01; p.x = Math.random(); }

                    const twinkle = Math.sin(time * 0.003 + p.twinkleOffset) * 0.5 + 0.5;
                    const trebleBoost = trebleLevel * twinkle;
                    const bpmBoost = bpmPulseIntensity * 0.4;
                    const alpha = Math.min(1, starBrightBase + (trebleBoost * 0.5 + bpmBoost) * _active);
                    if (alpha < 0.01) continue;

                    const dispSize = Math.max(2, p.size * 2);
                    const sprite = (p.warm && marathonMode) ? starSpriteWarm : starSpriteWhite;
                    ctx.globalAlpha = alpha;
                    ctx.drawImage(sprite, p.x * w - dispSize / 2, p.y * h - dispSize / 2, dispSize, dispSize);
                }
                ctx.globalAlpha = 1;
            }

            // ===== LAYER 0b: Constellation Lines (treble onsets) =====
            // Ease-in 200ms (smoothstep), ease-out 400ms (1-t²). Suppressed in silence.
            ctx.lineWidth = 0.6;
            for (let i = 0; i < constellationMax; i++) {
                const c = constellations[i];
                if (!c.active) continue;
                const age = time - c.t0;
                if (age > 600) { c.active = false; continue; }
                let a;
                if (age < 200) {
                    const u = age / 200;
                    a = u * u * (3 - 2 * u) * 0.55;
                } else {
                    const u = (age - 200) / 400;
                    a = (1 - u * u) * 0.55;
                }
                a *= _active;
                if (a < 0.01) continue;
                ctx.strokeStyle = `rgba(255,255,255,${a})`;
                ctx.beginPath();
                for (let j = 0; j < c.points.length; j++) {
                    const p = bgParticles[c.points[j]];
                    if (j === 0) ctx.moveTo(p.x * w, p.y * h);
                    else ctx.lineTo(p.x * w, p.y * h);
                }
                ctx.stroke();
            }

            // ===== LAYER 0c: Parallax Starfield (peripheral, converges on pupil) =====
            // Piccoli traits che drift-ano radialmente dalla pupilla verso fuori. Trail
            // pointing TO the pupil → effetto "vanishing point" sull'occhio. Mask radiale
            // bell-curve: invisibili dentro pupillaR+margine E oltre _outerMax. "Appena
            // visibili": peak alpha 0.28, line width 0.7.
            if (starfield === null) {
                starfield = new Array(STARFIELD_MAX);
                for (let i = 0; i < STARFIELD_MAX; i++) {
                    starfield[i] = {
                        angle: Math.random() * Math.PI * 2,
                        depth: Math.random(),
                        speed: 0.0008 + Math.random() * 0.0016
                    };
                }
            }
            // Active count = BASE quando radio offline / 1 listener, scala fino a MAX
            // con liveListeners > 1. +4 stars per listener oltre il primo.
            const _starfieldCount = azuracastOnline
                ? Math.min(STARFIELD_MAX, STARFIELD_BASE + Math.max(0, liveListeners - 1) * 4)
                : STARFIELD_BASE;
            // Early-exit: peak alpha = 0.28 * _active. Se _active < 0.07 ogni star
            // skip individualmente ma il loop gira lo stesso → outer skip.
            if (_active >= 0.07) {
                const pcx = cx + pupilOffX;
                const pcy = cy + pupilOffY;
                const _innerMin = lastPupilR + minDim * 0.05;
                const _outerMax = minDim * 0.72;
                if (_outerMax > _innerMin) {
                    const _band = _outerMax - _innerMin;
                    const _midR = (_innerMin + _outerMax) * 0.5;
                    const _bandHalf = _band * 0.5;
                    ctx.lineWidth = 0.7;
                    // Lieve modulazione della velocità globale al BPM (drift accelera nelle bar piene).
                    const _starGlobalSpeed = 1 + bpmPulseIntensity * 0.4 + cassoneIntensity * 0.25;
                    for (let i = 0; i < _starfieldCount; i++) {
                        const s = starfield[i];
                        s.depth -= s.speed * _starGlobalSpeed;
                        if (s.depth <= 0) {
                            s.depth = 1;
                            s.angle = Math.random() * Math.PI * 2;
                            s.speed = 0.0008 + Math.random() * 0.0016;
                        }
                        const radius = _innerMin + (1 - s.depth) * _band;
                        const ca = Math.cos(s.angle);
                        const sa = Math.sin(s.angle);
                        const x = pcx + ca * radius;
                        const y = pcy + sa * radius;
                        // Bell-curve alpha: peak nel mid-ring, zero fuori dal band.
                        const _rd = Math.abs(radius - _midR) / _bandHalf;
                        const _alpha = Math.max(0, 1 - _rd * _rd) * 0.28 * _active;
                        if (_alpha < 0.02) continue;
                        // Trail length easeOut sulla profondità → più lungo quando "vicino".
                        const trail = (1 - s.depth) * (1 - s.depth) * 14;
                        const dx = -ca * trail;
                        const dy = -sa * trail;
                        ctx.strokeStyle = 'rgba(255,255,255,' + _alpha.toFixed(3) + ')';
                        ctx.beginPath();
                        ctx.moveTo(x, y);
                        ctx.lineTo(x + dx, y + dy);
                        ctx.stroke();
                    }
                }
            }

            // ===== LAYER 0d: Listener Pulses (L3 multi-user awareness) =====
            // Micro-rings espansivi attorno alla pupilla, 1 per listener oltre il primo
            // (capped a LISTENER_PULSE_CAP). Spawn 4-bar-locked dal main loop. Disegnati
            // su bgCanvas così la pupilla li copre sulla parte interna → halos naturali.
            if (listenerPulses.length > 0) {
                const pcx = cx + pupilOffX;
                const pcy = cy + pupilOffY;
                const pR = lastPupilR;
                const _nowLp = Date.now();
                for (let i = listenerPulses.length - 1; i >= 0; i--) {
                    const lp = listenerPulses[i];
                    const age = _nowLp - lp.t0;
                    if (age < 0) continue;                                  // staggered, non partito
                    if (age > lp.dur) { listenerPulses.splice(i, 1); continue; }
                    const _t = age / lp.dur;
                    const _r = pR + (1 - (1 - _t) * (1 - _t)) * pR * 1.6;   // easeOut: pR → 2.6pR
                    const _a = Math.sin(Math.PI * _t) * 0.18;                // 0 → 0.18 → 0
                    if (_a < 0.005) continue;
                    ctx.strokeStyle = 'rgba(255,255,255,' + _a.toFixed(3) + ')';
                    ctx.lineWidth = (1 - _t) * 2 + 0.5;
                    ctx.beginPath();
                    ctx.arc(pcx, pcy, _r, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }

            // ===== LAYER 0.5: Radial BPM Wave =====
            if (bpmPulseIntensity > 0.05) {
                const waveRadius = (1 - bpmPulseIntensity) * minDim * 0.6;
                const waveAlpha = bpmPulseIntensity * 0.15;
                ctx.beginPath();
                ctx.arc(cx, cy, waveRadius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255,255,255,${waveAlpha})`;
                ctx.lineWidth = 2 + bpmPulseIntensity * 3;
                ctx.stroke();
            }

            // ===== LAYER 1: Pulse Rings — RIMOSSO in v1.3.6 =====
            // Era 6 ring concentrici expansivi su ogni bass>0.5: visivamente
            // formavano una "gabbia" attorno alla pupilla. lastPulseTime variabile
            // mantenuta per altri layer (es. sacredGeoBoost timing).

            // ===== LAYER 2: Hex Grid (pre-rendered blit) =====
            // _rhythmFactor: 1 quando il kick spara, 0.25 quando assente. Hex e spirale
            // sotto pad senza drums vengono attenuati di 4x — restano vivi ma quieti.
            const _rhythmFactor = 0.25 + 0.75 * bassCharge;
            const hexBpmBoost = bpmPulseIntensity * 0.3;
            // Base abbassata 0.6 → 0.4 — meno presente di default.
            const hexAlpha = (0.4 + bassLevel * 1.0 + hexBpmBoost) * _active * _rhythmFactor;
            // Early-exit: in silenzio profondo / no-rhythm il blit hex è invisibile
            // ma comunque costa ~0.2 ms. Skip pulito.
            if (hexAlpha > 0.005) {
                // Compose hex su offscreen + radial hole soft al centro,
                // sized sul iris ring (= cerchio bianco più grande, ~2.4 × pupilR).
                // Fade gradiente tra 2.4r (fully transparent) e 3.2r (no mask) → bordo
                // soft no hard-edge. Foro segue la pupilla via pupilOffX/Y.
                hexMaskedCtx.clearRect(0, 0, w, h);
                hexMaskedCtx.drawImage(hexGridCanvas, 0, 0);
                hexMaskedCtx.save();
                hexMaskedCtx.globalCompositeOperation = 'destination-out';
                const _hexHoleCx = cx + pupilOffX;
                const _hexHoleCy = cy + pupilOffY;
                const _hexHoleInner = lastPupilR * 2.4;
                const _hexHoleOuter = lastPupilR * 3.2;
                const _hexMask = hexMaskedCtx.createRadialGradient(
                    _hexHoleCx, _hexHoleCy, _hexHoleInner,
                    _hexHoleCx, _hexHoleCy, _hexHoleOuter
                );
                _hexMask.addColorStop(0, 'rgba(0,0,0,1)');   // full erase fino al iris
                _hexMask.addColorStop(1, 'rgba(0,0,0,0)');   // fade-out smooth
                hexMaskedCtx.fillStyle = _hexMask;
                hexMaskedCtx.fillRect(0, 0, w, h);
                hexMaskedCtx.restore();
                ctx.globalAlpha = Math.min(hexAlpha, 1);
                ctx.drawImage(hexMaskedCanvas, 0, 0);
                ctx.globalAlpha = 1;
            }

            // ===== LAYER 3: Spiral Vortex =====
            if (bpmStable) {
                spiralAngleAccum = bpmSyncAngle * 0.5;
            } else {
                spiralAngleAccum += energy * 2 * 0.016;
            }
            // Step 2 (Singularity variation A — Suction Spirale): durante collapse/hold
            // la spirale si stringe (avvitamento + outer pulled inward) e si illumina.
            // _sing = 0 quando idle → tutto invariato, costo zero.
            const _sing = singularityProgress;
            if (singularityState !== 'idle') spiralAngleAccum += _sing * 0.12;
            const armCount = 14;
            // Base abbassata 0.15 → 0.10 + _rhythmFactor (quasi sparisce senza kicks)
            const spiralAlpha = (0.10 + bassLevel * 0.2) * _active * _rhythmFactor * (1 + _sing * 3);
            const spiralLineWidth = (1.5 + bassLevel * 2) * (1 + _sing * 1.5);
            let _slow = false;
            try { _slow = isSlowDevice; } catch(e) {}
            const spiralSteps = _slow ? 40 : 80;

            // Early-exit perf: in silenzio profondo (_active≈0) o senza rhythm
            // (_rhythmFactor minimo + bassLevel basso) lo spiralAlpha è praticamente
            // 0 → saltiamo gradient + 14 stroke. Saving 1.5-2.5 ms/frame.
            if (spiralAlpha >= 0.005) {
            // Radial gradient: 14 stroke/frame (era 1120). Inner radius dinamico legato
            // a lastPupilR → la spirale è trasparente dentro la pupilla, fade-in subito
            // fuori dal bordo, decade nella metà esterna come prima.
            // Suction: outer raggio tirato verso la pupilla con singularityProgress.
            // Clamp sopra _spiralInnerR + delta per non degenerare il gradient.
            const _spiralMaxBase = Math.min(cx, cy) * 0.9;
            const _spiralInnerR = lastPupilR + minDim * 0.025;
            const spiralMaxR = Math.max(_spiralInnerR + minDim * 0.05, _spiralMaxBase * (1 - _sing * 0.55));
            const spiralGradient = ctx.createRadialGradient(cx, cy, _spiralInnerR, cx, cy, spiralMaxR);
            spiralGradient.addColorStop(0,    'rgba(255,255,255,0)');                         // pulisci sopra la pupilla
            spiralGradient.addColorStop(0.10, `rgba(255,255,255,${spiralAlpha * 0.5})`);      // soft fade-in
            spiralGradient.addColorStop(0.25, `rgba(255,255,255,${spiralAlpha})`);            // full
            spiralGradient.addColorStop(0.5,  `rgba(255,255,255,${spiralAlpha * 0.75})`);
            spiralGradient.addColorStop(0.75, `rgba(255,255,255,${spiralAlpha * 0.44})`);
            spiralGradient.addColorStop(1,    'rgba(255,255,255,0)');
            ctx.strokeStyle = spiralGradient;
            ctx.lineWidth = spiralLineWidth;

            for (let arm = 0; arm < armCount; arm++) {
                const armAngle = (arm / armCount) * Math.PI * 2 + spiralAngleAccum;
                ctx.beginPath();
                for (let s = 0; s <= spiralSteps; s++) {
                    const t = s / spiralSteps;
                    const r = t * spiralMaxR;
                    const theta = armAngle + t * Math.PI * (3 + _sing * 6);
                    const x = cx + r * Math.cos(theta);
                    const y = cy + r * Math.sin(theta);
                    if (s === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
            }  // end early-exit on spiralAlpha


            // ===== LAYER 5: Central Circle + Broadcast Icon (enhanced) =====
            // MOVED to drawPupil() on its dedicated top-layer canvas (#pupilCanvas).
            // Kept here disabled for reference / easy revert.
            if (false) {
                const baseR = minDim * 0.06;
                let circleScale = 1 + bassLevel * 0.1 + pupilDilation * 0.5;
                if (silenceMode) circleScale = 1 + Math.sin(time * 0.002) * 0.03;
                const circleRadius = baseR * circleScale;
                ctx.save();
                if (raveMode) {
                    ctx.shadowColor = 'rgba(255,200,100,0.9)';
                    ctx.shadowBlur = 20 + bassLevel * 40;
                } else if (marathonMode) {
                    ctx.shadowColor = 'rgba(255,200,100,0.7)';
                    ctx.shadowBlur = 15 + bassLevel * 25;
                } else {
                    ctx.shadowColor = 'rgba(255,255,255,0.8)';
                    ctx.shadowBlur = (10 + bassLevel * 30) * (0.35 + 0.65 * _active);
                }
                ctx.beginPath();
                ctx.arc(cx, cy, circleRadius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.9)';
                ctx.fill();
                ctx.strokeStyle = raveMode
                    ? `rgba(255,220,150,${0.7 + bassLevel * 0.3})`
                    : `rgba(255,255,255,${0.6 + bassLevel * 0.4})`;
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }

            // ===== LAYER 6: Sacred Geometry — Flower of Life =====
            // Gate draconiano: la mandala spettrogramma appare SOLO con cassone vero
            // (sustained 4/4 + bpmStable), non per generico energy > 0.6.
            const sacredTarget = cassoneIntensity > 0.25 ? 1 : 0;
            sacredGeoAlpha += (sacredTarget - sacredGeoAlpha) * 0.05;
            sacredGeoBoost *= 0.97; // decay boost from drops

            if (sacredGeoAlpha > 0.01) {
                const geoR = minDim * 0.12;
                // Rotation: BPM-synced when stable, else energy-driven
                if (bpmStable) {
                    sacredGeoAngle = bpmSyncAngle;
                } else {
                    sacredGeoAngle += energy * 0.02;
                }
                const drawAlpha = sacredGeoAlpha * (0.15 + sacredGeoBoost * 0.3);

                // Mandala spettrogramma: i 6 outer circles diventano voci di banda.
                // Ognuno ascolta una zona dello spettro e respira con essa. La rotazione
                // del gruppo resta BPM-locked. Il "fisso" diventa "vivo".
                const _bands = [
                    [1, 4],     // 0  sub        — ~22-86 Hz
                    [4, 8],     // 1  body kick  — ~86-172 Hz
                    [14, 30],   // 2  punch      — ~300-645 Hz
                    [30, 60],   // 3  low-mid    — ~645-1290 Hz
                    [60, 120],  // 4  mid        — ~1.3-2.6 kHz
                    [150, 300]  // 5  treble     — ~3.2-6.5 kHz
                ];
                const _bandVals = _bands.map(([lo, hi]) => {
                    if (!freqData) return 0;
                    let s = 0;
                    for (let i = lo; i < hi; i++) s += freqData[i];
                    return s / ((hi - lo) * 255);
                });

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(sacredGeoAngle);

                // CENTRAL — pulse with ritual + cassone, never fully invisible while geo is on
                {
                    const _ca = Math.min(1, drawAlpha * (0.7 + cassoneIntensity * 0.5));
                    const _cR = geoR * (1 + bassCharge * 0.08 + (ritualScore > 0.5 ? 0.06 : 0));
                    ctx.strokeStyle = `rgba(255,255,255,${_ca})`;
                    ctx.lineWidth = 1 + bassLevel * 1.5;
                    ctx.beginPath();
                    ctx.arc(0, 0, _cR, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // 6 OUTER — circular spectrogram, each circle is a band voice
                for (let i = 0; i < 6; i++) {
                    const _a = (i / 6) * Math.PI * 2;
                    const _b = _bandVals[i];
                    const _oR = geoR * (1 + _b * 0.18);                            // ±18% size wobble
                    const _oa = Math.min(1, drawAlpha * (0.30 + _b * 1.6));        // dim → bright on band peak
                    ctx.strokeStyle = `rgba(255,255,255,${_oa})`;
                    ctx.lineWidth = 1 + _b * 1.5;
                    ctx.beginPath();
                    ctx.arc(Math.cos(_a) * geoR, Math.sin(_a) * geoR, _oR, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // OUTER HEXAGON — energy-coupled overall alpha
                ctx.strokeStyle = `rgba(255,255,255,${Math.min(1, drawAlpha * (0.5 + energy * 0.8))})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const _a = (i / 6) * Math.PI * 2 - Math.PI / 6;
                    const hx = Math.cos(_a) * geoR * 2;
                    const hy = Math.sin(_a) * geoR * 2;
                    if (i === 0) ctx.moveTo(hx, hy);
                    else ctx.lineTo(hx, hy);
                }
                ctx.closePath();
                ctx.stroke();
                ctx.restore();
            }

            // ===== LAYER 8: State Overlays =====
            // Drop burst flash
            if (dropFlashIntensity > 0.01) {
                ctx.fillStyle = `rgba(255,255,255,${dropFlashIntensity * 0.3})`;
                ctx.fillRect(0, 0, w, h);

        // Fisheye lens via SVG feDisplacementMap. We generate the displacement map
        // at startup from a small offscreen canvas (radial outward push with a
        // quadratic curve → barrel/fisheye look). Applied to the webcam reflection
        // inside the pupil so the user appears curved into the eye lens.
        const FISHEYE_ENABLED = true;
        function buildFisheyeMap() {
            const size = 256;
            const c = document.createElement('canvas');
            c.width = c.height = size;
            const cc = c.getContext('2d');
            const im = cc.createImageData(size, size);
            const half = size / 2;
            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const idx = (y * size + x) * 4;
                    const nx = (x - half) / half;
                    const ny = (y - half) / half;
                    const r = Math.min(1, Math.sqrt(nx * nx + ny * ny));
                    // Quadratic outward push: no displacement at center,
                    // increasing toward the edge → center stays sharp, edges curve.
                    const factor = r * r;
                    const ux = r > 0 ? nx / r : 0;
                    const uy = r > 0 ? ny / r : 0;
                    im.data[idx + 0] = Math.round(128 + ux * factor * 127); // R = X displacement
                    im.data[idx + 1] = Math.round(128 + uy * factor * 127); // G = Y displacement
                    im.data[idx + 2] = 128;
                    im.data[idx + 3] = 255;
                }
            }
            cc.putImageData(im, 0, 0);
            const url = c.toDataURL('image/png');
            const feImg = document.getElementById('fxFisheyeMap');
            if (feImg) {
                feImg.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', url);
                feImg.setAttribute('href', url); // modern browsers
            }
        }
        if (FISHEYE_ENABLED) {
            try { buildFisheyeMap(); } catch (e) { console.warn('Fisheye map build failed:', e.message); }
        }

        function drawPupil(time, bass, mid, treble, offX, offY) {
            const w = pupilCanvas.width;
            const h = pupilCanvas.height;
            const cx = w / 2 + offX;
            const cy = h / 2 + offY;
            const minDim = Math.min(w, h);

            pupilCtx.clearRect(0, 0, w, h);

            const baseR = minDim * 0.048;
            // Expanded dilation range — dramatic zoom in/out:
            //   4/4 dritta full kick → ~2.6× base
            //   long breakdown without kicks → shrinks toward ~40% (bassCharge → 0)
            //   deep silence → shrinks further via calmness
            const _act = 1 - calmness;
            // Tuning 2026-05-14: pupilla parcheggiava troppo grande. Trimmo i contributori
            // "lenti" che plateau-ano (pupilDilation, cassoneIntensity) e gonfio i contributori
            // per-frame (bass, subKick) → meno stazionamento, più pulse visibile per kick.
            let scale = 1 + bass * 0.28 + pupilDilation * 0.40 + cassoneIntensity * 0.45 + subKick * 0.40;
            // Singularity bloom — la sfera si gonfia mentre tutto le collassa addosso.
            scale *= 1 + singularityProgress * 0.18;
            // FAT-BASS DILATION BOOST — su kick distorti e cassa pastosa la pupilla
            // si ingrandisce ulteriormente. Tre contributi:
            //   1) kickStack pesante (≥2 bande firing) — soglia abbassata a 1.2 + coef 0.25
            //   2) cassone saturo (sustained 4/4) — coef 0.60
            //   3) HARMONIC SATURATION — prodotto sub*body*punch: scatta solo quando il
            //      kick è "pieno" su tutte e 3 le bande contemporaneamente (= distorto/cicciotto).
            //      Termine prodotto = zero appena una banda manca → detector ortogonale.
            const _fatBass = Math.max(0, (kickStack - 1.2) / 1.5) * 0.25
                            + Math.pow(Math.max(0, cassoneIntensity - 0.4), 1.5) * 0.60
                            + subKick * bodyKick * punchKick * 0.65;
            scale *= 1 + _fatBass;
            // Curva quadratica su bassCharge: shrink aggressivo nel breakdown
            // (bC=0.7 → mult 0.54 vs 0.75 lineare). Full-kick invariato (bC=1 → 1.0).
            // → "no cassa = vedi la meraviglia del centro" (spirale, hex, mandala).
            scale *= 0.10 + 0.90 * bassCharge * bassCharge;
            scale *= 1 - calmness * 0.28;        // further shrink in deep silence
            scale *= 1 - bdSnapAmount * BD_SNAP_MAGNITUDE;   // bass-drop snap: collasso transiente al gap della cassa
            if (silenceMode) scale += Math.sin(time * 0.002) * 0.05 * calmness;
            // Always-on subtle breath: pupil never holds an exact static size between events,
            // so it never reads as a default UI button.
            scale *= 1 + Math.sin(time * 0.0014) * 0.07;
            // Per-bar exhale — locked to bars: scale dips 12% al downbeat di ogni bar,
            // easeOut quadratico → ricresce in 4 beats. Rompe il plateau quando ritualScore
            // e cassoneIntensity sarebbero parcheggiati alti. Solo con bpmStable.
            if (bpmStable && bpmAvgInterval > 0 && beatCount >= 1 && beatHistory.length >= 1) {
                // Usa beatCount (monotonic), non beatHistory.length (capped a 10!).
                const _within = Math.min(1, Math.max(0, (Date.now() - beatHistory[beatHistory.length - 1]) / bpmAvgInterval));
                const _barPhase = (((beatCount - 1) % 4) + _within) / 4;
                const _exhale = (1 - _barPhase) * (1 - _barPhase);
                scale *= 1 - 0.12 * _exhale;
            }
            const r = baseR * scale;
            lastPupilR = r;   // shared with drawProceduralBg so the spiral masks around it

            // Compute blinkY (Y-scale fattore) — 1 quando occhio aperto, 0.05 al picco di chiusura
            let blinkY = 1;
            if (blinkActive) {
                const _bp = (time - blinkStart) / BLINK_DURATION;
                if (_bp < 0.3) {
                    // closing fast (easeIn quadratic)
                    const t = _bp / 0.3;
                    blinkY = 1 - t * t * 0.95;
                } else if (_bp < 1) {
                    // opening (easeOut quadratic)
                    const t = (_bp - 0.3) / 0.7;
                    blinkY = 0.05 + (1 - (1 - t) * (1 - t)) * 0.95;
                }
            }

            // Outer wrap: scala Y di tutto il pupil rendering attorno a (cx,cy)
            // → iris + sfera + reflection + stroke si chiudono come palpebra.
            pupilCtx.save();
            if (blinkY < 0.99) {
                pupilCtx.translate(cx, cy);
                pupilCtx.scale(1, blinkY);
                pupilCtx.translate(-cx, -cy);
            }

            // === IRIS (parametric ring) ===
            // Drawn FIRST so the pupil dark fill that comes next covers the center —
            // anatomically correct (the iris sits around the pupil, not over it).
            // - BASS    → ring thickness  (1 → ~5 px)
            // - MID     → ring radius     (breath in/out, threshold curve)
            // - TREBLE  → high-freq jitter (vibrazione sui hi-hat)
            // - BPM     → pulse on the beat
            // Alpha attenuates with calmness so it fades in silence.
            if (IRIS_ENABLED) {
                const irisBaseR = r * 2.4;
                const midDrive = 0.5 + Math.max(0, mid - 0.3) * 1.5;
                const irisR = irisBaseR + r * 0.5 * (midDrive - 0.5) + bpmPulseIntensity * r * 0.18;
                const irisThick = 1 + bass * 4;
                // L3 multi-user: iris ring più presente quanta più gente ascolta.
                // Cap a +25% per evitare che diventi dominante (linear su listeners, cap 6).
                const _listenerBoost = azuracastOnline ? Math.min(0.25, Math.max(0, liveListeners - 1) * 0.04) : 0;
                const irisAlpha = Math.min(1, (0.18 + bass * 0.5 + mid * 0.25 + cassoneIntensity * 0.3) * _act * (1 + _listenerBoost));
                if (irisAlpha > 0.02) {
                    pupilCtx.save();
                    pupilCtx.shadowBlur = 0;
                    pupilCtx.strokeStyle = `rgba(255,255,255,${irisAlpha})`;
                    pupilCtx.lineWidth = irisThick;
                    pupilCtx.beginPath();
                    pupilCtx.arc(cx, cy, irisR, 0, Math.PI * 2);
                    pupilCtx.stroke();
                    // Treble jitter: ghost ring slightly offset, dimmer
                    if (treble > 0.30) {
                        const tj = (Math.random() - 0.5) * treble * 4;
                        pupilCtx.globalAlpha = treble * 0.55;
                        pupilCtx.lineWidth = Math.max(0.5, irisThick * 0.6);
                        pupilCtx.beginPath();
                        pupilCtx.arc(cx, cy, irisR + tj, 0, Math.PI * 2);
                        pupilCtx.stroke();
                        pupilCtx.globalAlpha = 1;
                    }
                    pupilCtx.restore();
                }

                // Red iris flash + scia: armato dalla 16-bar cassa streak. Disegnato
                // sopra l'iride normale, indipendente da irisAlpha (sempre visibile
                // se nei RED_FLASH_DURATION ms post-fire). 3 ghost rings sfalsati che
                // si espandono verso fuori → effetto "motion blur" / scia.
                if (redIrisFlashT0 > 0) {
                    const _redAge = Date.now() - redIrisFlashT0;
                    if (_redAge >= 0 && _redAge < RED_FLASH_DURATION) {
                        const _t = _redAge / RED_FLASH_DURATION;
                        const _fade = 1 - _t;
                        const _ease = _fade * _fade;
                        pupilCtx.save();
                        pupilCtx.shadowColor = `rgba(255,30,30,${_fade})`;
                        pupilCtx.shadowBlur = 40 * _fade;
                        pupilCtx.strokeStyle = `rgba(255,40,40,${_ease})`;
                        pupilCtx.lineWidth = 2 + irisThick * 3 * _fade;
                        pupilCtx.beginPath();
                        pupilCtx.arc(cx, cy, irisR, 0, Math.PI * 2);
                        pupilCtx.stroke();
                        pupilCtx.shadowBlur = 0;
                        for (let _i = 0; _i < 3; _i++) {
                            const _tt = _t - _i * 0.10;
                            if (_tt <= 0 || _tt >= 1) continue;
                            const _gR = irisR * (1 + _tt * 0.55);
                            const _ga = (1 - _tt) * 0.45 / (1 + _i * 0.6);
                            pupilCtx.strokeStyle = `rgba(255,80,80,${_ga.toFixed(3)})`;
                            pupilCtx.lineWidth = Math.max(0.5, irisThick * 1.8 * (1 - _tt));
                            pupilCtx.beginPath();
                            pupilCtx.arc(cx, cy, _gR, 0, Math.PI * 2);
                            pupilCtx.stroke();
                        }
                        pupilCtx.restore();
                    }
                }
            }

            pupilCtx.save();
            // Outer glow — sempre argentato, mai warm. L'intensità sale con bass
            // (e con raveMode/marathonMode tramite gain bump), ma il colore resta neutro.
            const _glowGain = raveMode ? 40 : marathonMode ? 25 : 30;
            pupilCtx.shadowColor = 'rgba(245,248,252,0.85)';
            pupilCtx.shadowBlur = (10 + bass * _glowGain) * (0.35 + 0.65 * _act);
            // Spherical pupil fill — radial gradient with off-center inner highlight
            // so the body reads as a SPHERE, not a flat disc. The base color follows
            // the 4-stage ritual progression (see ritualScore comment for the curve).
            const _s = ritualScore;
            let _R, _G, _B;
            if (_s < 1)      { _R = 255 * _s; _G = 0; _B = 0; }                                  // black → red
            else if (_s < 4) { const _t = (_s - 1) / 3; _R = 255; _G = 255 * _t; _B = 0; }       // red → yellow
            else if (_s < 8) { const _t = (_s - 4) / 4; _R = 255; _G = 255; _B = 255 * _t; }     // yellow → white
            else             { _R = 255; _G = 255; _B = 255; }                                   // luminescent white
            // Darken 10% toward black — più cupo, rituale notturno
            _R *= 0.9; _G *= 0.9; _B *= 0.9;
            // Sphere shading: highlight diffuso, contrasto basso. Pupilla scura — il
            // gradiente accenna la sfera, non la dichiara.
            // Sphere rotation on axis — highlight + rim + webcam content orbit together.
            // BPM-locked quando stabile: 1 giro = ROT_BARS bar (4 bar = 16 beats di default)
            // → moto coerente con la cassa, niente più drift indipendente. In silenzio o
            // su materiale non-ritmico, fallback al free-spin lento del path originale.
            if (bpmStable && bpmAvgInterval > 0) {
                // Time-based, continuo: 1 giro = ROT_BARS * 4 beats = ROT_BARS bar.
                // Indipendente da beatHistory.length (che è capped a 10) → niente saturazione.
                const ROT_BARS = 4;
                const _period = bpmAvgInterval * ROT_BARS * 4;
                pupilSpinPhase = ((Date.now() % _period) / _period) * Math.PI * 2;
            } else {
                pupilSpinPhase += 0.0042 + (1 - _act) * 0.020;
                if (pupilSpinPhase > Math.PI * 2) pupilSpinPhase -= Math.PI * 2;
            }
            // Highlight più tenue (+12 invece di +18), edge più scuro (×0.22 invece di ×0.32),
            // 5 stops per dare curva alla transizione invece di lerp lineare = sfera con
            // body più scuro, terminator gradualmente discendente, rim shadow netto.
            const _hi = (c) => Math.min(255, c + 12);
            const _ed = (c) => c * 0.22;
            const _hiRadius = r * 0.25;
            const _hiX = cx + Math.cos(pupilSpinPhase) * _hiRadius;
            const _hiY = cy + Math.sin(pupilSpinPhase) * _hiRadius;
            const _grad = pupilCtx.createRadialGradient(
                _hiX, _hiY, r * 0.45,
                cx, cy, r
            );
            _grad.addColorStop(0,    `rgba(${_hi(_R)|0},${_hi(_G)|0},${_hi(_B)|0},0.92)`);
            _grad.addColorStop(0.28, `rgba(${((_hi(_R)+_R)*0.5)|0},${((_hi(_G)+_G)*0.5)|0},${((_hi(_B)+_B)*0.5)|0},0.93)`);  // mezzo tono
            _grad.addColorStop(0.55, `rgba(${_R|0},${_G|0},${_B|0},0.95)`);
            _grad.addColorStop(0.82, `rgba(${(_R*0.55)|0},${(_G*0.55)|0},${(_B*0.55)|0},0.97)`);  // terminator scuro
            _grad.addColorStop(1,    `rgba(${_ed(_R)|0},${_ed(_G)|0},${_ed(_B)|0},0.99)`);
            pupilCtx.beginPath();
            pupilCtx.arc(cx, cy, r, 0, Math.PI * 2);
            pupilCtx.fillStyle = _grad;
            pupilCtx.fill();

            // Rim light: subtle ambient reflection on the side opposite to the highlight,
            // emerges only near the perimeter. Fa leggere la curvatura sul lato in ombra
            // (altrimenti piatto) — pure light wrap-around, no extra highlight.
            const _rimX = cx - (_hiX - cx);
            const _rimY = cy - (_hiY - cy);
            const _rimGrad = pupilCtx.createRadialGradient(_rimX, _rimY, r * 0.55, _rimX, _rimY, r * 1.25);
            const _rimBoost = 22;
            _rimGrad.addColorStop(0,    'rgba(0,0,0,0)');
            _rimGrad.addColorStop(0.70, 'rgba(0,0,0,0)');
            _rimGrad.addColorStop(0.88, `rgba(${Math.min(255, _R + _rimBoost)|0},${Math.min(255, _G + _rimBoost)|0},${Math.min(255, _B + _rimBoost)|0},0.22)`);
            _rimGrad.addColorStop(1,    'rgba(0,0,0,0)');
            const _prevComp = pupilCtx.globalCompositeOperation;
            const _prevShadow = pupilCtx.shadowBlur;
            pupilCtx.shadowBlur = 0;
            pupilCtx.globalCompositeOperation = 'lighter';
            pupilCtx.fillStyle = _rimGrad;
            pupilCtx.fill();
            pupilCtx.globalCompositeOperation = _prevComp;
            pupilCtx.shadowBlur = _prevShadow;

            // Webcam reflection — v1 treatment: HDR + scanlines + VCR jitter + lens vignette.
            // Mirror-flipped, B&W high contrast. Composite 'lighter' so the reflection
            // reads on a dark surface, not as a photo.
            if (webcamReady && webcamMode > 0 && webcamVideo.readyState >= 2) {
                pupilCtx.save();
                pupilCtx.beginPath();
                pupilCtx.arc(cx, cy, r, 0, Math.PI * 2);
                pupilCtx.clip();
                pupilCtx.translate(cx, cy);
                pupilCtx.scale(-1, 1); // mirror
                // Sphere rotation: contenuto webcam + scanlines + lens vignette
                // ruotano insieme al highlight orbit (pupilSpinPhase). Negato per
                // allineare la direzione visiva post-mirror al moto del highlight.
                pupilCtx.rotate(-pupilSpinPhase);
                pupilCtx.shadowBlur = 0;

                const vw = webcamVideo.videoWidth || 320;
                const vh = webcamVideo.videoHeight || 240;
                // Oversize → central emphasis (poor-man's lens, peripheral compressed by clip)
                const drawW = r * 3.2;
                const drawH = drawW * (vh / vw);

                // Fisheye-prefixed filter chain: SVG displacement map first (lens curve),
                // then HDR + B&W + soft blur. If FISHEYE_ENABLED is off, fall back to
                // the flat filter chain unchanged.
                const _fxBase = 'saturate(0) brightness(0.95) contrast(1.85) blur(1.3px)';
                pupilCtx.filter = FISHEYE_ENABLED ? `url(#fxFisheye) ${_fxBase}` : _fxBase;
                pupilCtx.globalCompositeOperation = 'lighter';
                // VCR horizontal jitter: ~8% of frames the image shifts a few px
                const vcrJitter = (Math.random() < 0.08) ? (Math.random() - 0.5) * 10 : 0;
                pupilCtx.drawImage(webcamVideo, -drawW / 2 + vcrJitter, -drawH / 2, drawW, drawH);

                // Occasional ghost pass (luminance-shifted, brighter, more blur) → VCR feel
                if (Math.random() < 0.12) {
                    const _fxGhost = 'saturate(0) brightness(1.15) contrast(2.0) blur(2.2px)';
                    pupilCtx.filter = FISHEYE_ENABLED ? `url(#fxFisheye) ${_fxGhost}` : _fxGhost;
                    pupilCtx.globalAlpha = 0.28;
                    pupilCtx.drawImage(webcamVideo, -drawW / 2 + 3, -drawH / 2 + 1, drawW, drawH);
                    pupilCtx.globalAlpha = 1;
                }

                // Reset for opaque overlays
                pupilCtx.filter = 'none';
                pupilCtx.globalCompositeOperation = 'source-over';

                // Scanlines — 2 px spacing, dark line every 2 rows.
                // Pre-rendered 2×2 pattern → 1 fillRect invece di 150-300 fillRect/frame
                // (saving ~0.8-1.0 ms quando webcam ON). Pattern lazy-init dentro pupilCtx.
                if (!scanlinePattern) scanlinePattern = pupilCtx.createPattern(scanlinePatternCanvas, 'repeat');
                pupilCtx.fillStyle = scanlinePattern;
                pupilCtx.fillRect(-r, -r, r * 2, r * 2);

                // Lens vignette inside the pupil — darken periphery, central area kept bright
                const innerGrad = pupilCtx.createRadialGradient(0, 0, r * 0.35, 0, 0, r);
                innerGrad.addColorStop(0, 'rgba(0,0,0,0)');
                innerGrad.addColorStop(1, 'rgba(0,0,0,0.7)');
                pupilCtx.fillStyle = innerGrad;
                pupilCtx.fillRect(-r, -r, r * 2, r * 2);

                pupilCtx.restore();
            }

            // === SPHERICAL INNER-RIM SHADOW ===
            // Vignette interna minima, concentrata negli ultimi ~28% del raggio con
            // ease-out → accentua la sfera senza appiattire il body. Drawn dopo la
            // webcam reflection così condividono lo stesso envelope sferico. Stroke
            // dell'iride viene dopo, quindi resta nitido sopra l'ombra.
            {
                const _innerShadow = pupilCtx.createRadialGradient(cx, cy, r * 0.55, cx, cy, r);
                _innerShadow.addColorStop(0,    'rgba(0,0,0,0)');
                _innerShadow.addColorStop(0.72, 'rgba(0,0,0,0)');
                _innerShadow.addColorStop(0.88, 'rgba(0,0,0,0.10)');
                _innerShadow.addColorStop(1.00, 'rgba(0,0,0,0.28)');
                pupilCtx.save();
                pupilCtx.shadowBlur = 0;
                pupilCtx.beginPath();
                pupilCtx.arc(cx, cy, r, 0, Math.PI * 2);
                pupilCtx.fillStyle = _innerShadow;
                pupilCtx.fill();
                pupilCtx.restore();
            }

            // Iris-edge stroke — silvered white luminescente, sempre.
            // Niente più warm gold su raveMode: il colore "ritualistico" lo porta
            // solo il fill via ritualScore. Il contorno è argento, neutro, freddo.
            pupilCtx.strokeStyle = `rgba(245,248,252,${0.7 + bass * 0.3})`;
            pupilCtx.lineWidth = 2;
            pupilCtx.stroke();
            pupilCtx.restore();
            pupilCtx.restore();   // chiude il blink outer wrap

            // Singularity Step 2: HOLD FLASH — white burst at the pupil during the hold phase.
            // Drawn OUTSIDE the blink wrap so the flash is always full-sized.
            // Composite "screen" → additive feel without saturating to color.
            const _flashI = Math.max(0, (singularityProgress - 0.85) / 0.15);
            if (_flashI > 0.001) {

                pupilCtx.globalCompositeOperation = 'screen';
                const _fr = lastPupilR * (3 + _flashI * 2);
                const _fg = pupilCtx.createRadialGradient(cx, cy, 0, cx, cy, _fr);
                _fg.addColorStop(0,   'rgba(255,255,255,' + (0.95 * _flashI).toFixed(3) + ')');
                _fg.addColorStop(0.4, 'rgba(255,255,255,' + (0.35 * _flashI).toFixed(3) + ')');
                _fg.addColorStop(1,   'rgba(255,255,255,0)');
                pupilCtx.fillStyle = _fg;
                pupilCtx.fillRect(0, 0, w, h);
                pupilCtx.restore();
            }

                source.connect(analyser);

                // Resume audio context if suspended (Safari requirement)
                if (audioContext.state === 'suspended') {
